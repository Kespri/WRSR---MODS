; Local launcher schema for the installed TesmioLoader plugin "easystart".
; Describes plugins\easystart.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.
; [unlock_resource] carries no active keys by default and is not described;
; keys added there show up as a note and stay editable in the INI itself.

[launcher]
layout_version = 1
visible = 1
id = local.easystart
name = Easy Start
config = easystart.ini
enabled_field = easystart/enabled
description = The citizens' needs arrive bit by bit over the years. A need that is not yet unlocked does not count for happiness and health; the citizens still go there and shop, only the consequences stay away until its year.
description_key = easystart.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:general]
tab = settings
label = What is gated
label_key = easystart.group.general
order = 10

[group:unlock]
tab = settings
label = Unlock years
label_key = easystart.group.unlock
description = The year from which a need counts, from 1 January.\noff = never, the need stays as in the base game.\nalways = from the first day.\nThe schedule assumes the republic was founded in 1920. If you start in 1960 as in the base game, every year is already in the past and the plugin changes nothing.
description_key = easystart.group.unlock.description
order = 20

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = easystart.group.diagnostics
order = 30

[field:enabled]
section = easystart
key = enabled
label = Plugin enabled
label_key = easystart.enabled.label
description = OFF leaves the game exactly as it is without the plugin.
description_key = easystart.enabled.description
type = boolean
group = general
order = 10

[field:demands]
section = easystart
key = demands
label = Gate the nine citizen demands
label_key = easystart.demands.label
description = Food, meat, clothes, electronics, alcohol, religion, culture, sport, health.\nON holds them back until their unlock year.\nOFF leaves all nine as in the base game.
description_key = easystart.demands.description
type = boolean
group = general
order = 20

[field:utilities]
section = easystart
key = utilities
label = Gate the three building utilities
label_key = easystart.utilities.label
description = Electricity, water and heating a building needs.\nON holds them back until their unlock year.\nOFF leaves them as in the base game.
description_key = easystart.utilities.description
type = boolean
group = general
order = 30

[field:warnings]
section = easystart
key = warnings
label = Gate the building-window warnings
label_key = easystart.warnings.label
description = Messages such as "building without power supply" or "N citizens currently without drinking water". The game counts them apart from happiness, so they would stay visible otherwise.\nON hides them until the unlock year.\nOFF shows them as in the base game.
description_key = easystart.warnings.description
type = boolean
group = general
order = 40

[field:pin_status]
section = easystart
key = pin_status
label = Hold the happiness of locked needs
label_key = easystart.pin_status.label
description = ON holds the happiness of a locked need at the value below instead of letting it sink every day.\nOFF: in the unlock year the happiness is then already at the bottom.
description_key = easystart.pin_status.description
type = boolean
group = general
order = 50

[field:locked_status]
section = easystart
key = locked_status
label = Happiness while locked
label_key = easystart.locked_status.label
description = 1.0 = fully satisfied. 0.5 leaves room upwards so the need feels noticeably new when unlocked.\nFor food the value stands for satiety: 1.0 means nobody starves while food is locked.
description_key = easystart.locked_status.description
type = decimal
minimum = 0
maximum = 1
step = 0.05
group = general
order = 60

[field:clear_unsatisfied]
section = easystart
key = clear_unsatisfied
label = Drop locked needs from the unsatisfied list
label_key = easystart.clear_unsatisfied.label
description = ON takes locked needs out of the list that triggers "N citizens could not get X".\nOFF leaves the message as in the base game.
description_key = easystart.clear_unsatisfied.description
type = boolean
group = general
order = 70

[field:probe]
section = easystart
key = probe
label = Write unlocks to the log
label_key = easystart.probe.label
description = ON writes to tesmioloader.log at every turn of the year which needs are still to come, and once the first citizen whose need was held back.
description_key = easystart.probe.description
type = boolean
group = diagnostics
order = 10

[field:food]
section = unlock
key = food
label = Food
label_key = easystart.food.label
type = text
group = unlock
order = 10

