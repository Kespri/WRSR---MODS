; Local launcher schema for the installed TesmioLoader plugin "easystart".
; Describes plugins\easystart.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.
; [unlock_resource] carries no active keys by default and is not described;
; keys added there show up as a note and stay editable in the INI itself.

[launcher]
layout_version = 1
visible = 1
id = local.easystart
name = Easy Start
config = easystart.ini
enabled_field = easystart/enabled
description = The citizens' needs arrive bit by bit over the years. A need that is not yet unlocked does not count for happiness and health; the citizens still go there and shop, only the consequences stay away until its year.
description_key = easystart.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:general]
tab = settings
label = What is gated
label_key = easystart.group.general
order = 10

[group:unlock]
tab = settings
label = Unlock years
label_key = easystart.group.unlock
description = Year in which the requirement starts applying on 1 January. The schedule is designed for a republic founded in 1920. With a start in 1960, the preset years are already in the past.\noff = do not delay it; base-game behaviour\nalways = apply it from the first game day\nA year = unlock it in that year
description_key = easystart.group.unlock.description
order = 20

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = easystart.group.diagnostics
order = 30

[field:enabled]
section = easystart
key = enabled
label = Plugin enabled
label_key = easystart.enabled.label
description = ON unlocks needs and utility requirements according to the configured schedule.
description_key = easystart.enabled.description
type = boolean
group = general
order = 10

[field:demands]
section = easystart
key = demands
label = Gate the nine citizen demands
label_key = easystart.demands.label
description = ON holds back food, meat, clothes, electronics, alcohol, religion, culture, sport and health until their configured unlock years.
description_key = easystart.demands.description
type = boolean
group = general
order = 20

[field:utilities]
section = easystart
key = utilities
label = Gate the three building utilities
label_key = easystart.utilities.label
description = ON holds back electricity, water and heating requirements until their configured unlock years.
description_key = easystart.utilities.description
type = boolean
group = general
order = 30

[field:warnings]
section = easystart
key = warnings
label = Gate the building-window warnings
label_key = easystart.warnings.label
description = ON hides related warnings until the unlock year, for example “building without power supply”.
description_key = easystart.warnings.description
type = boolean
group = general
order = 40

[field:pin_status]
section = easystart
key = pin_status
label = Hold the happiness of locked needs
label_key = easystart.pin_status.label
description = ON keeps the satisfaction of a locked need at the value below.\nOFF lets satisfaction continue to fall; it may already be very low when the need unlocks.
description_key = easystart.pin_status.description
type = boolean
group = general
order = 50

[field:locked_status]
section = easystart
key = locked_status
label = Happiness while locked
label_key = easystart.locked_status.label
description = Satisfaction while a need is locked. For food, the value is satiety.\n1.0 = fully satisfied or fed\n0.5 = medium value with a noticeable improvement after unlocking
description_key = easystart.locked_status.description
type = decimal
minimum = 0
maximum = 1
step = 0.05
group = general
order = 60

[field:clear_unsatisfied]
section = easystart
key = clear_unsatisfied
label = Drop locked needs from the unsatisfied list
label_key = easystart.clear_unsatisfied.label
description = ON prevents locked needs from producing the “N citizens could not get X” message.
description_key = easystart.clear_unsatisfied.description
type = boolean
group = general
order = 70

[field:probe]
section = easystart
key = probe
label = Write unlocks to the log
label_key = easystart.probe.label
description = ON writes the needs that remain locked at every change of year to tesmioloader.log. It also records the first affected citizen once. Troubleshooting only.
description_key = easystart.probe.description
type = boolean
group = diagnostics
order = 10

