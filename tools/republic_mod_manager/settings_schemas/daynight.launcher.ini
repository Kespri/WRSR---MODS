; Local launcher schema for the installed TesmioLoader plugin "daynight" 2.1.
; Describes plugins\daynight.ini; the plugin itself is untouched. Texts here are
; the English fallback, German lives in languages\de.ini under the same keys.
; UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.daynight
name = Day and Night
config = daynight.ini
enabled_field = daynight/enabled
description = One sunrise and one sunset per calendar day. In the base game a change from day to night and back takes 13 calendar days, almost two weeks. With this plugin it fits into one day.
description_key = daynight.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:cycle]
tab = settings
label = Day and night
label_key = daynight.group.cycle
description = How long a day-night change takes and when night comes.
description_key = daynight.group.cycle.description
order = 10

[group:pace]
tab = settings
label = Pace
label_key = daynight.group.pace
description = Two separate controls: one for vehicles, one for everything else. They always apply, whatever is set above.
description_key = daynight.group.pace.description
order = 20

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = daynight.group.diagnostics
order = 30

[field:enabled]
section = daynight
key = enabled
label = Plugin enabled
label_key = daynight.enabled.label
description = ON enables the configured day-and-night cycle.
description_key = daynight.enabled.description
type = boolean
group = cycle
order = 10

[field:cycle_days]
section = daynight
key = cycle_days
label = Calendar days per day-night change
label_key = daynight.cycle_days.label
description = Calendar days from one sunrise to the next.\n1 = one sunrise and one sunset every day\n2 to 12 = a correspondingly longer cycle\n13 = the base-game cycle
description_key = daynight.cycle_days.description
type = integer
minimum = 1
maximum = 13
step = 1
group = cycle
order = 20

[field:day_scale]
section = daynight
key = day_scale
label = Day length (how much slower the calendar runs)
label_key = daynight.day_scale.label
description = How much longer a calendar day takes than in the base game.\nauto = slow the calendar automatically to match the light cycle; recommended\n1 = do not slow the calendar; day and night then change 13 times faster\n2 to 100 = slow the calendar by this factor\nChoose which parts of the game slow down under “What slows down”.
description_key = daynight.day_scale.description
type = text
group = cycle
order = 30

[field:slow]
section = daynight
key = slow
label = What slows down
label_key = daynight.slow.label
description = Which parts of the game slow down.\ncalendar = slow only the calendar; recommended\nworld = slow everything, including citizens and vehicles; high values look like slow motion\nnone = do not slow anything\nWith calendar, citizens, vehicles, construction and production keep their normal speed. Daily processes such as pollution, loans and messages keep their usual interval.
description_key = daynight.slow.description
type = choice
choices = calendar|world|none
group = cycle
order = 40

[field:offset]
section = daynight
key = offset
label = When night comes
label_key = daynight.offset.label
description = Moves the night within the calendar day.\n0 = darkness begins shortly after the middle of the day\n0.5 = darkness begins when the date changes\nWith any value other than 0, a 13-day cycle no longer exactly matches the base game.
description_key = daynight.offset.description
type = decimal
minimum = 0
maximum = 1
step = 0.05
group = cycle
order = 50

[field:fade]
section = daynight
key = fade
label = Scale the lighting fade
label_key = daynight.fade.label
description = ON shortens the transitions between morning, day, evening and night to match the configured cycle.\nOFF uses the slow base-game transitions. With short cycles, they may overlap and make the lighting look washed out.
description_key = daynight.fade.description
type = boolean
group = cycle
order = 60

[field:vehicle_scale]
section = daynight
key = vehicle_scale
label = Vehicle speed
label_key = daynight.vehicle_scale.label
description = Speed of trucks, trains, ships and aircraft. Works independently of the other settings.\n1 = base-game speed\n2 = half speed\n0.5 = double speed\nHigher value = slower vehicles
description_key = daynight.vehicle_scale.description
type = decimal
minimum = 0.1
maximum = 100
step = 0.1
group = pace
order = 10

[field:sim_scale]
section = daynight
key = sim_scale
label = Speed of everything else
label_key = daynight.sim_scale.label
description = Speed of citizens, construction, production, wear and animations.\n1 = base-game speed\n2 = half speed\n0.5 = double speed\nHigher value = slower simulation
description_key = daynight.sim_scale.description
type = decimal
minimum = 0.1
maximum = 100
step = 0.1
group = pace
order = 20

[field:probe]
section = daynight
key = probe
label = Write day lengths to the log
label_key = daynight.probe.label
description = ON writes the real duration of every calendar day and light transition to tesmioloader.log. Use only for troubleshooting and checks after a game update.
description_key = daynight.probe.description
type = boolean
group = diagnostics
order = 10
