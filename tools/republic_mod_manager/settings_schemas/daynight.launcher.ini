; Local launcher schema for the installed TesmioLoader plugin "daynight" 2.1.
; Describes plugins\daynight.ini; the plugin itself is untouched. Texts here are
; the English fallback, German lives in languages\de.ini under the same keys.
; UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.daynight
name = Day and Night
config = daynight.ini
enabled_field = daynight/enabled
description = One sunrise and one sunset per calendar day. In the base game a change from day to night and back takes 13 calendar days, almost two weeks. With this plugin it fits into one day.
description_key = daynight.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:cycle]
tab = settings
label = Day and night
label_key = daynight.group.cycle
description = How long a day-night change takes and when night comes.
description_key = daynight.group.cycle.description
order = 10

[group:pace]
tab = settings
label = Pace
label_key = daynight.group.pace
description = Two separate controls: one for vehicles, one for everything else. They always apply, whatever is set above.
description_key = daynight.group.pace.description
order = 20

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = daynight.group.diagnostics
order = 30

[field:enabled]
section = daynight
key = enabled
label = Plugin enabled
label_key = daynight.enabled.label
description = OFF leaves the game exactly as it is without the plugin.
description_key = daynight.enabled.description
type = boolean
group = cycle
order = 10

[field:cycle_days]
section = daynight
key = cycle_days
label = Calendar days per day-night change
label_key = daynight.cycle_days.label
description = How many calendar days pass from one sunrise to the next.\n1 = a sunrise and a sunset every day; that is what the plugin is for.\n13 = exactly like the base game; for comparing when something looks odd.\n2 to 12 = anything in between.
description_key = daynight.cycle_days.description
type = integer
minimum = 1
maximum = 13
step = 1
group = cycle
order = 20

[field:day_scale]
section = daynight
key = day_scale
label = Day length (how much slower the calendar runs)
label_key = daynight.day_scale.label
description = How much longer a calendar day takes than in the base game.\nauto = so much slower that day and night take as long in real time as before (13 times slower with one day per change). Recommended.\n1 = the calendar runs as usual; day and night then change 13 times faster, too fast to watch.\n2 to 100 = anything in between.\nWhat slows down is set under "What slows down".
description_key = daynight.day_scale.description
type = text
group = cycle
order = 30

[field:slow]
section = daynight
key = slow
label = What slows down
label_key = daynight.slow.label
description = calendar (recommended): only the calendar runs slower. Citizens, vehicles, construction and production run as fast as always; what the game does once a day (clearing pollution, loans, messages) still happens at the usual interval.\nworld: everything runs slower, citizens and vehicles too. At 13 times slower that looks like slow motion.\nnone: nothing runs slower, like day length 1.
description_key = daynight.slow.description
type = choice
choices = calendar|world|none
group = cycle
order = 40

[field:offset]
section = daynight
key = offset
label = When night comes
label_key = daynight.offset.label
description = Shifts the night within the day, 0 to 1. At 0 it gets dark shortly after midday, at 0.5 exactly at the date change.\nWith any value other than 0, "13 calendar days" is no longer exactly like the base game.
description_key = daynight.offset.description
type = decimal
minimum = 0
maximum = 1
step = 0.05
group = cycle
order = 50

[field:fade]
section = daynight
key = fade
label = Scale the lighting fade
label_key = daynight.fade.label
description = The game always fades the light between morning, day, evening and night equally slowly; that was meant for the long 13-day change.\nON makes the fade fittingly shorter.\nOFF leaves it as in the base game; a fade is then never finished before the next one starts and the light looks washed out.
description_key = daynight.fade.description
type = boolean
group = cycle
order = 60

[field:vehicle_scale]
section = daynight
key = vehicle_scale
label = Vehicle speed
label_key = daynight.vehicle_scale.label
description = Vehicles only: trucks, trains, ships, planes. 1 = as in the base game, 2 = half as fast, 0.5 = twice as fast. Independent of everything else.
description_key = daynight.vehicle_scale.description
type = decimal
minimum = 0.1
maximum = 100
step = 0.1
group = pace
order = 10

[field:sim_scale]
section = daynight
key = sim_scale
label = Speed of everything else
label_key = daynight.sim_scale.label
description = Everything except vehicles: citizens, construction, production, wear, animations. 1 = as in the base game, 2 = half as fast, 0.5 = twice as fast.
description_key = daynight.sim_scale.description
type = decimal
minimum = 0.1
maximum = 100
step = 0.1
group = pace
order = 20

[field:probe]
section = daynight
key = probe
label = Write day lengths to the log
label_key = daynight.probe.label
description = ON writes to tesmioloader.log how long every day and every light change took in real seconds. Only for troubleshooting. If it says a whole day-night change runs through in 3 seconds, everything works and is just too fast: raise the day length.
description_key = daynight.probe.description
type = boolean
group = diagnostics
order = 10
