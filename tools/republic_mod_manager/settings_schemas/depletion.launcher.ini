; Local launcher schema for the installed TesmioLoader plugin "depletion".
; Describes plugins\depletion.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.depletion
name = Deposit Depletion
config = depletion.ini
enabled_field = depletion/enabled
description = Deposits run out. A working mine visibly mines the deposit off the map, and the less is left, the less it produces. The mining is stored in the saved game; if you switch the plugin off later, what was mined does not come back. Test it on a copy of your saved game first.
description_key = depletion.description
language_directory = languages
icon = builtin:gear
default_tab = general
maximum_value_length = 4096

[tab:general]
label = General
label_key = depletion.tab.general
order = 10

[tab:mining]
label = Mining
label_key = depletion.tab.mining
order = 20

[group:depletion]
tab = mining
label = Mining
label_key = depletion.group.depletion
order = 10

[group:window]
tab = general
label = Mine window
label_key = depletion.group.window
order = 20

[group:diagnostics]
tab = general
label = Troubleshooting
label_key = depletion.group.diagnostics
order = 30

[field:enabled]
section = depletion
key = enabled
label = Plugin enabled
label_key = depletion.enabled.label
description = ON lets the selected deposits run out as they are mined.\nOFF stops further depletion. Resources already removed are not restored.
description_key = depletion.enabled.description
type = boolean
group = depletion
order = 10

[field:tonnes_per_texel]
section = depletion
key = tonnes_per_texel
label = Tonnes per map point
label_key = depletion.tonnes_per_texel.label
description = Tonnes a mine can extract from a completely full point of the resource map. Weaker points yield proportionally less.\nHigher value = deposits last longer\nLower value = deposits run out sooner\nFor comparison, a mine with a 210 m search radius covers several thousand map points.
description_key = depletion.tonnes_per_texel.description
type = integer
minimum = 1
maximum = 10000000
step = 100
group = depletion
order = 20

[field:vanilla]
section = depletion
key = vanilla
label = Base-game deposits that run out
label_key = depletion.vanilla.label
description = Base-game deposits that may run out. Separate several values with commas.\noil, iron, coal, uranium, bauxite, gravel = only the named deposits\nall = every deposit\nnone = no base-game deposit\nname:value = custom tonnes per map point, for example iron:3000\nDeposits from deposits.ini are always included.\ngravel permanently wears away the visible ground texture and needs a much higher value because of its small search area. Omit gravel to keep it as in the base game.
description_key = depletion.vanilla.description
type = text
group = depletion
order = 30

[field:flush_seconds]
section = depletion
key = flush_seconds
label = Seconds until the mining is saved
label_key = depletion.flush_seconds.label
description = Seconds between updates of the resource map. Output and quality change immediately; only the minimap and saved game follow at this interval.\nLower value = more frequent updates and higher performance cost\nDo not update more than four times per second.
description_key = depletion.flush_seconds.description
type = integer
minimum = 1
maximum = 600
step = 1
group = depletion
order = 40

[field:panel]
section = depletion
key = panel
label = Remaining-deposit row in the mine window
label_key = depletion.panel.label
description = ON shows the remaining stock in the mine window and makes the window slightly taller, for example “Deposit remaining: 251.4 kt / 259.3 kt (96.9 %)”.
description_key = depletion.panel.description
type = boolean
group = window
order = 10

[field:panel_caption]
section = depletion
key = panel_caption
label = Caption of that row
label_key = depletion.panel_caption.label
description = The word in front of the remainder. Letters only, no accents and no special characters, or the game shows garbage.
description_key = depletion.panel_caption.description
type = text
group = window
order = 20

[field:log_seconds]
section = depletion
key = log_seconds
label = Interval of the progress lines (seconds)
label_key = depletion.log_seconds.label
description = Seconds between mine status messages in tesmioloader.log. Each message includes the remaining amount, total amount and quality.\n0 = no status messages\nHigher value = log less often\nWatch several game days to find a suitable tonnes-per-map-point value.
description_key = depletion.log_seconds.description
type = integer
minimum = 0
maximum = 3600
step = 10
group = diagnostics
order = 10
