; Local launcher schema for the installed TesmioLoader plugin "depletion".
; Describes plugins\depletion.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.depletion
name = Deposit Depletion
config = depletion.ini
enabled_field = depletion/enabled
description = Deposits run out. A working mine visibly mines the deposit off the map, and the less is left, the less it produces. The mining is stored in the saved game; if you switch the plugin off later, what was mined does not come back. Test it on a copy of your saved game first.
description_key = depletion.description
language_directory = languages
icon = builtin:gear
default_tab = general
maximum_value_length = 4096

[tab:general]
label = General
label_key = depletion.tab.general
order = 10

[tab:mining]
label = Mining
label_key = depletion.tab.mining
order = 20

[group:depletion]
tab = mining
label = Mining
label_key = depletion.group.depletion
order = 10

[group:window]
tab = general
label = Mine window
label_key = depletion.group.window
order = 20

[group:diagnostics]
tab = general
label = Troubleshooting
label_key = depletion.group.diagnostics
order = 30

[field:enabled]
section = depletion
key = enabled
label = Plugin enabled
label_key = depletion.enabled.label
description = OFF = base game: deposits are infinite, a mine produces the same amount forever.
description_key = depletion.enabled.description
type = boolean
group = depletion
order = 10

[field:tonnes_per_texel]
section = depletion
key = tonnes_per_texel
label = Tonnes per map point
label_key = depletion.tonnes_per_texel.label
description = How many tonnes a mine can take out of one point of the resource map before it is empty; a full point yields this value, a weaker one less. The main control: more = the deposits last longer.\nFor comparison: an ore mine searches within 210 m and so covers a few thousand points. The log names each mine's stock on the first scan.
description_key = depletion.tonnes_per_texel.description
type = integer
minimum = 1
maximum = 10000000
step = 100
group = depletion
order = 20

[field:vanilla]
section = depletion
key = vanilla
label = Base-game deposits that run out
label_key = depletion.vanilla.label
description = Separated by commas: oil, iron, coal, uranium, bauxite, gravel, or all or none. After a colon a name may carry its own tonnes per map point, for example iron:3000.\nDeposits from deposits.ini are always included.\nGravel is special: mining wears the visible ground texture away for good, and because a gravel pit only searches a small area, gravel needs a much higher value per map point. Leave the word out to keep gravel as in the base game.
description_key = depletion.vanilla.description
type = text
group = depletion
order = 30

[field:flush_seconds]
section = depletion
key = flush_seconds
label = Seconds until the mining is saved
label_key = depletion.flush_seconds.label
description = Sets the seconds between the plugin writing the accumulated mining into the resource map.\nOutput and quality are always right at once; this value only sets how often the minimap and the saved game catch up. Writing costs a moment of performance, so never more than four times per second.
description_key = depletion.flush_seconds.description
type = integer
minimum = 1
maximum = 600
step = 1
group = depletion
order = 40

[field:panel]
section = depletion
key = panel
label = Remaining-deposit row in the mine window
label_key = depletion.panel.label
description = ON shows a line with the remainder in the mine window below "Current production per work day", for example "Deposit remaining: 251.4 kt / 259.3 kt (96.9 %)". The window gets a little taller for it.
description_key = depletion.panel.description
type = boolean
group = window
order = 10

[field:panel_caption]
section = depletion
key = panel_caption
label = Caption of that row
label_key = depletion.panel_caption.label
description = The word in front of the remainder. Letters only, no accents and no special characters, or the game shows garbage.
description_key = depletion.panel_caption.description
type = text
group = window
order = 20

[field:log_seconds]
section = depletion
key = log_seconds
label = Interval of the progress lines (seconds)
label_key = depletion.log_seconds.label
description = Sets the seconds between one log line per mine in tesmioloader.log.\nFor example: "coal mine: 99.86% left, 258926 of 259289 t, quality 0.686".\n0 = off\nThat is how you find the right tonnes per map point: watch for a few game days and adjust the value until a mine lasts as long as you want.
description_key = depletion.log_seconds.description
type = integer
minimum = 0
maximum = 3600
step = 10
group = diagnostics
order = 10
