; Local launcher schema for the installed TesmioLoader plugin "accumulator".
; Describes plugins\accumulator.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.accumulator
name = Accumulator
config = accumulator.ini
enabled_field = accumulator/enabled
description = Batteries for your power grid. A building with a large power store charges while power is left over and gives it back when power is short.
description_key = accumulator.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:battery]
tab = settings
label = Battery
label_key = accumulator.group.battery
description = Which buildings count as a battery and how fast they fill and empty.
description_key = accumulator.group.battery.description
order = 10

[group:window]
tab = settings
label = Building window
label_key = accumulator.group.window
order = 20

[group:grid]
tab = settings
label = Power grid
label_key = accumulator.group.grid
order = 30

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = accumulator.group.diagnostics
order = 40

[field:enabled]
section = accumulator
key = enabled
label = Plugin enabled
label_key = accumulator.enabled.label
description = OFF switches the plugin off. Your battery buildings stay and keep filling up, but no longer give power back.
description_key = accumulator.enabled.description
type = boolean
group = battery
order = 10

[field:building_types]
section = accumulator
key = building_types
label = Building types
label_key = accumulator.building_types.label
description = Which building kinds may work as a battery, as numbers separated by commas: 19 = transformer, 18 = substation. Do not enter 17 (power plant); a power plant cannot take in power in the game and would never charge.
description_key = accumulator.building_types.description
type = text
group = battery
order = 20

[field:min_capacity]
section = accumulator
key = min_capacity
label = Minimum storage to count as a battery
label_key = accumulator.min_capacity.label
description = From this store size on a building counts as a battery. Normal substations only have a small store and stay out. The shipped battery "Stationary Accumulator" has 5000.
description_key = accumulator.min_capacity.description
type = integer
minimum = 1
maximum = 1000000
step = 100
group = battery
order = 30

[field:charge_rate]
section = accumulator
key = charge_rate
label = Charging speed (power per second)
label_key = accumulator.charge_rate.label
description = How much power the battery takes in per second at most. Without this limit an empty battery would take the power away from a whole city. For comparison: a coal power plant delivers 70, a wind turbine 15. With 60 the battery fills up with roughly what a coal plant has left over.
description_key = accumulator.charge_rate.description
type = integer
minimum = 0
maximum = 100000
step = 5
group = battery
order = 40

[field:discharge_rate]
section = accumulator
key = discharge_rate
label = Discharging speed (power per second)
label_key = accumulator.discharge_rate.label
description = How much power the battery gives out per second at most. It only gives out while power is short; as long as the grid has enough, it stays full. With 60 a full 5000 battery replaces a power plant for a good 80 seconds. Higher = cover bigger outages, lower = the charge lasts longer.
description_key = accumulator.discharge_rate.description
type = integer
minimum = 0
maximum = 100000
step = 5
group = battery
order = 50

[field:panel]
section = accumulator
key = panel
label = Charge row in the battery window
label_key = accumulator.panel.label
description = ON shows an extra line with the charge level in the battery's window, for example "Charge: 4210.5 / 5000 (84.2 %)".
description_key = accumulator.panel.description
type = boolean
group = window
order = 10

[field:panel_caption]
section = accumulator
key = panel_caption
label = Caption of that row
label_key = accumulator.panel_caption.label
description = The word in front of the charge level. Letters only, no accents and no special characters, or the game shows garbage.
description_key = accumulator.panel_caption.description
type = text
group = window
order = 20

[field:gauges]
section = accumulator
key = gauges
label = Compute the window's gauges from the battery
label_key = accumulator.gauges.label
description = The game normally shows 0 power for a battery and warns "no power supply" although it is charging. ON shows instead what is going into and out of the battery right now. OFF leaves the game's display and warning as they are.
description_key = accumulator.gauges.description
type = boolean
group = window
order = 30

[field:spread_voltage]
section = accumulator
key = spread_voltage
label = Experiment: pass voltage on to neighbours (leave off)
label_key = accumulator.spread_voltage.label
description = An old experiment that did not work; the plugin handles that job differently now. Leave the switch off.
description_key = accumulator.spread_voltage.description
type = boolean
group = grid
order = 10

[field:trace]
section = accumulator
key = trace
label = Log the neighbours of the first battery
label_key = accumulator.trace.label
description = ON writes to the log how much power the buildings next to the first battery receive. Only for troubleshooting, costs a little performance.
description_key = accumulator.trace.description
type = boolean
group = diagnostics
order = 10

[field:log_seconds]
section = accumulator
key = log_seconds
label = Seconds between battery log lines
label_key = accumulator.log_seconds.label
description = Every so many seconds the plugin writes one line per battery with charge level, inflow and outflow to tesmioloader.log. 0 = off. Handy when trying it out for the first time, to see whether charging and discharging run as set.
description_key = accumulator.log_seconds.description
type = integer
minimum = 0
maximum = 3600
step = 5
group = diagnostics
order = 20

[field:probe]
section = accumulator
key = probe
label = Seconds between building lists in the log
label_key = accumulator.probe.label
description = Every so many seconds the plugin lists every building with a power store in the log. 0 = off. Switch it on only when your battery is not recognised or something is off after a game update.
description_key = accumulator.probe.description
type = integer
minimum = 0
maximum = 3600
step = 5
group = diagnostics
order = 30
