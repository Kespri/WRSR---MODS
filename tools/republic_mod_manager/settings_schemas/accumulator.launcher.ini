; Local launcher schema for the installed TesmioLoader plugin "accumulator".
; Describes plugins\accumulator.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.accumulator
name = Accumulator
config = accumulator.ini
enabled_field = accumulator/enabled
description = Batteries for your power grid. A building with a large power store charges while power is left over and gives it back when power is short.
description_key = accumulator.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:battery]
tab = settings
label = Battery
label_key = accumulator.group.battery
description = Which buildings count as a battery and how fast they fill and empty.
description_key = accumulator.group.battery.description
order = 10

[group:window]
tab = settings
label = Building window
label_key = accumulator.group.window
order = 20

[group:grid]
tab = settings
label = Power grid
label_key = accumulator.group.grid
order = 30

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = accumulator.group.diagnostics
order = 40

[field:enabled]
section = accumulator
key = enabled
label = Plugin enabled
label_key = accumulator.enabled.label
description = ON enables charging and discharging for battery buildings.\nOFF stops discharging. The buildings remain and can still fill up.
description_key = accumulator.enabled.description
type = boolean
group = battery
order = 10

[field:building_types]
section = accumulator
key = building_types
label = Building types
label_key = accumulator.building_types.label
description = Building types that may work as batteries. Separate several numbers with commas.\n19 = transformer\n18 = substation\nDo not use 17: a power plant cannot take in power and would never charge.
description_key = accumulator.building_types.description
type = text
group = battery
order = 20

[field:min_capacity]
section = accumulator
key = min_capacity
label = Minimum storage to count as a battery
label_key = accumulator.min_capacity.label
description = Minimum storage capacity for a building to count as a battery. This excludes the small stores of normal substations.\nHigher value = fewer buildings count as batteries\nLower value = more buildings count as batteries\nThe included “Stationary Accumulator” has 5000.
description_key = accumulator.min_capacity.description
type = integer
minimum = 1
maximum = 1000000
step = 100
group = battery
order = 30

[field:charge_rate]
section = accumulator
key = charge_rate
label = Charging speed (power per second)
label_key = accumulator.charge_rate.label
description = Maximum power a battery takes in per second. The limit prevents an empty battery from taking the power away from an entire city.\nHigher value = faster charging and a heavier load on the grid\nLower value = slower charging and a lighter load\nFor comparison, a coal power plant supplies 70 and a wind turbine 15.
description_key = accumulator.charge_rate.description
type = integer
minimum = 0
maximum = 100000
step = 5
group = battery
order = 40

[field:discharge_rate]
section = accumulator
key = discharge_rate
label = Discharging speed (power per second)
label_key = accumulator.discharge_rate.label
description = Maximum power a battery supplies per second. It supplies power only when the grid is short.\nHigher value = cover larger power shortages\nLower value = stored energy lasts longer\nExample: at 60, a full battery with 5000 capacity replaces a power plant for a little over 80 seconds.
description_key = accumulator.discharge_rate.description
type = integer
minimum = 0
maximum = 100000
step = 5
group = battery
order = 50

[field:panel]
section = accumulator
key = panel
label = Charge row in the battery window
label_key = accumulator.panel.label
description = ON adds the charge level to the battery window, for example “Charge: 4210.5 / 5000 (84.2 %)”.
description_key = accumulator.panel.description
type = boolean
group = window
order = 10

[field:panel_caption]
section = accumulator
key = panel_caption
label = Caption of that row
label_key = accumulator.panel_caption.label
description = The word in front of the charge level. Letters only, no accents and no special characters, or the game shows garbage.
description_key = accumulator.panel_caption.description
type = text
group = window
order = 20

[field:gauges]
section = accumulator
key = gauges
label = Compute the window's gauges from the battery
label_key = accumulator.gauges.label
description = ON replaces the incorrect game display with the actual flow into and out of the battery.\nOFF uses the normal game display. It may show 0 power and “without power supply” while the battery is charging.
description_key = accumulator.gauges.description
type = boolean
group = window
order = 30

[field:spread_voltage]
section = accumulator
key = spread_voltage
label = Experiment: pass voltage on to neighbours (leave off)
label_key = accumulator.spread_voltage.label
description = ON has no effect. This old function has been replaced technically. Leave it OFF.
description_key = accumulator.spread_voltage.description
type = boolean
group = grid
order = 10

[field:trace]
section = accumulator
key = trace
label = Log the neighbours of the first battery
label_key = accumulator.trace.label
description = ON writes how much power the buildings next to the first battery receive to the log. Troubleshooting only; may cost performance.
description_key = accumulator.trace.description
type = boolean
group = diagnostics
order = 10

[field:log_seconds]
section = accumulator
key = log_seconds
label = Seconds between battery log lines
label_key = accumulator.log_seconds.label
description = Interval between battery status messages in tesmioloader.log. Each message includes charge, inflow and outflow.\n0 = no status messages\nHigher value = log less often
description_key = accumulator.log_seconds.description
type = integer
minimum = 0
maximum = 3600
step = 5
group = diagnostics
order = 20

[field:probe]
section = accumulator
key = probe
label = Seconds between building lists in the log
label_key = accumulator.probe.label
description = Interval between lists of all buildings with power storage in tesmioloader.log. Use only when a battery is not recognised or after a game update.\n0 = do not write these lists\nHigher value = log less often
description_key = accumulator.probe.description
type = integer
minimum = 0
maximum = 3600
step = 5
group = diagnostics
order = 30
