; Local launcher schema for the installed TesmioLoader plugin "walking".
; Describes plugins\walking.ini; the plugin itself is untouched. Texts here are
; the English fallback, German lives in languages\de.ini under the same keys.
; UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.walking
name = Walking Distance
config = walking.ini
enabled_field = walking/enabled
description = How far citizens walk and how far car owners drive between home, work and parking.
description_key = walking.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:distances]
tab = settings
label = Distances
label_key = walking.group.distances
description = Measured along roads and footpaths, not as the crow flies. A building 400 m away across the river can mean a 1200 m walk.
description_key = walking.group.distances.description
order = 10

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = walking.group.diagnostics
order = 20

[field:enabled]
section = walking
key = enabled
label = Plugin enabled
label_key = walking.enabled.label
description = OFF leaves the game exactly as it is without the plugin.
description_key = walking.enabled.description
type = boolean
group = distances
order = 10

[field:distance]
section = walking
key = distance
label = Walking distance (m)
label_key = walking.distance.label
description = The longest way a citizen walks. The base game uses 480 m.\nA higher value: more buildings are within walking distance, more citizens walk, and building creates more connections.\n0 = no limit; in a large city every placement then takes several seconds. The plugin does not accept more than 20000.
description_key = walking.distance.description
type = integer
minimum = 0
maximum = 20000
step = 10
group = distances
order = 20

[field:car_distance]
section = walking
key = car_distance
label = Driving distance for car owners (m)
label_key = walking.car_distance.label
description = The longest drive between home, work and parking the game allows. The base game uses 2500 m.\nRaise it together with the walking distance so a car still reaches further than the feet; with equal values a car is no use.
description_key = walking.car_distance.description
type = integer
minimum = 0
maximum = 50000
step = 10
group = distances
order = 30

[field:regen_on_load]
section = walking
key = regen_on_load
label = Rebuild connections when a save is loaded
label_key = walking.regen_on_load.label
description = Who walks and drives where is stored in the saved game.\nON rebuilds all walking and parking connections on load, so an existing city uses the new distances too.\nOFF: only newly built buildings use the new distances.
description_key = walking.regen_on_load.description
type = boolean
group = distances
order = 40

[field:probe]
section = walking
key = probe
label = Write check values to the log
label_key = walking.probe.label
description = ON writes to tesmioloader.log which values the plugin found in the game before changing them. Only useful after a game update, to see whether the plugin still fits.
description_key = walking.probe.description
type = boolean
group = diagnostics
order = 10
