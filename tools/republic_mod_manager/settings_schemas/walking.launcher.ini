; Local launcher schema for the installed TesmioLoader plugin "walking".
; Describes plugins\walking.ini; the plugin itself is untouched. Texts here are
; the English fallback, German lives in languages\de.ini under the same keys.
; UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.walking
name = Walking Distance
config = walking.ini
enabled_field = walking/enabled
description = How far citizens walk and how far car owners drive between home, work and parking.
description_key = walking.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:distances]
tab = settings
label = Distances
label_key = walking.group.distances
description = Measured along roads and footpaths, not as the crow flies. A building 400 m away across the river can mean a 1200 m walk.
description_key = walking.group.distances.description
order = 10

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = walking.group.diagnostics
order = 20

[field:enabled]
section = walking
key = enabled
label = Plugin enabled
label_key = walking.enabled.label
description = ON enables the configured walking and driving distances.
description_key = walking.enabled.description
type = boolean
group = distances
order = 10

[field:distance]
section = walking
key = distance
label = Walking distance (m)
label_key = walking.distance.label
description = The longest route a citizen will walk. The base game uses 480 m.\nHigher value = more buildings are within walking distance and construction creates more connections\n0 = no limit; construction may then take several seconds in a large city\n20000 = highest accepted value
description_key = walking.distance.description
type = integer
minimum = 0
maximum = 20000
step = 10
group = distances
order = 20

[field:car_distance]
section = walking
key = car_distance
label = Driving distance for car owners (m)
label_key = walking.car_distance.label
description = The longest permitted drive between home, work and parking. The base game uses 2500 m.\nHigher value = car owners drive farther\nSet this above the walking distance. At equal values, a car provides no distance advantage.
description_key = walking.car_distance.description
type = integer
minimum = 0
maximum = 50000
step = 10
group = distances
order = 30

[field:regen_on_load]
section = walking
key = regen_on_load
label = Rebuild connections when a save is loaded
label_key = walking.regen_on_load.label
description = Walking and parking connections are stored in the saved game.\nON rebuilds every connection when the save is loaded, so the configured distances also affect existing cities.\nOFF applies the configured distances only to newly constructed buildings.
description_key = walking.regen_on_load.description
type = boolean
group = distances
order = 40

[field:probe]
section = walking
key = probe
label = Write check values to the log
label_key = walking.probe.label
description = ON writes the values found in the game before the plugin changes them to tesmioloader.log. Use only for troubleshooting and checks after a game update.
description_key = walking.probe.description
type = boolean
group = diagnostics
order = 10
