[language]
name = Deutsch

[strings]
plugin.resources = Resources
plugin.resources.description = Ressourcen, Eigenschaften und optionale Preisvorgaben verwalten.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Eigene Ressourcen mit Resources Plus: dieselbe Liste wie beim Original, in plugins\resources_plus.ini, ohne den Absturz beim Beenden.
resources_plus.save_warning = Änderungen landen erst beim Speichern in plugins\resources_plus.ini. Entfernst du eine Ressource, die ein Spielstand schon nutzt, kann dieser Spielstand kaputtgehen.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Eigene Bürgerbedürfnisse mit Needs Plus: dieselbe Liste wie beim Original, in der Datei needs_plus.ini im Ordner plugins, beim ersten Start aus needs.ini übernommen.
needs_plus.save_warning = Änderungen landen erst beim Speichern in needs_plus.ini im Ordner plugins. Jedes Bedürfnis gibt den betroffenen Läden einen Lagerplatz, und der gehört zum Spielstand - teste zuerst auf einer Kopie.
tab.resources.editor = Ressourcen
group.resource_definitions = Ressourcendefinitionen
detail.transport = Transportklasse
detail.transport.description = Welche Fahrzeuge und Lager die Ressource transportieren. Der Name genügt; das Plugin ergänzt die Kennzahlen des Grundspiels für diese Klasse.
detail.kind = Preisart
detail.kind.description = 0 Rohstoff, 1 verarbeitet, 2 Nahrung/Kleidung, 3 fortgeschrittenes Material, 4 Elektronik.
detail.record_price = Startpreis im Datensatz
detail.record_price.description = Optionale RUB- und USD-Startwerte im Ressourcendatensatz.
detail.record_base_price = Basispreis im Datensatz
detail.record_base_price.description = Optionale RUB- und USD-Basiswerte im Ressourcendatensatz.
detail.trade_mult = Handelsfaktoren
detail.trade_mult.description = Verkaufs- und Einkaufsfaktor, normalerweise 0.95, 1.05.
detail.market_rub = RUB-Marktblock
detail.market_usd = USD-Marktblock
detail.market.description = Zwei Marktwerte und ein optionaler Koeffizient.\n(Beschreibung in der INI beachten)
detail.packed = Verpackte Fracht
detail.packed.description = Automatische, unverpackte oder verpackte Frachtdarstellung.
detail.family = Materialfamilie
detail.family.description = Wie das Material auf Baustellen aussieht und sehr wahrscheinlich, zu welcher Abfallsorte es wird. Jede Familie hat genau eine Abfallsorte. Zahlen 10 bis 19 aus der INI werden mit Namen angezeigt.
detail.cargo = Frachtgeometrie
detail.cargo.description = Auswahl der Geometrie für die Frachtdarstellung.
detail.pinned_base_price = Festgeschriebener Basispreis
detail.pinned_base_price.description = Optionaler RUB- und USD-Wert in [base_price]. Leer bedeutet: kein persönlicher Eintrag.
detail.forced_price = Erzwungener Endpreis
detail.forced_price.description = Optionaler RUB- und USD-Wert in [price]. Leer bedeutet: Das Spiel berechnet den Preis.

; --- Lokale Schemas fuer installierte Upstream-Plugins (seit 0.13.0) ---
daynight.description = Ein Sonnenaufgang und ein Sonnenuntergang pro Kalendertag. Im Grundspiel dauert ein Wechsel von Tag zu Nacht und zurück 13 Kalendertage, also fast zwei Wochen. Mit diesem Plugin passt er in einen Tag.
daynight.group.cycle = Tag und Nacht
daynight.group.cycle.description = Wie lang ein Tag-Nacht-Wechsel dauert und wann die Nacht kommt.
daynight.group.pace = Tempo
daynight.group.pace.description = Zwei getrennte Regler: einer für Fahrzeuge, einer für alles andere. Sie wirken immer, egal was oben eingestellt ist.
daynight.group.diagnostics = Fehlersuche
daynight.enabled.label = Plugin aktiv
daynight.enabled.description = AUS lässt das Spiel genau so, wie es ohne das Plugin ist.
daynight.cycle_days.label = Kalendertage pro Tag-Nacht-Wechsel
daynight.cycle_days.description = Wie viele Kalendertage von einem Sonnenaufgang bis zum nächsten vergehen.\n1 = jeden Tag ein Sonnenaufgang und ein Sonnenuntergang; dafür ist das Plugin da.\n13 = genau wie im Grundspiel; zum Vergleichen, wenn etwas seltsam aussieht.\n2 bis 12 = alles dazwischen.
daynight.day_scale.label = Tageslänge (wie viel langsamer der Kalender läuft)
daynight.day_scale.description = Wie viel länger ein Kalendertag dauert als im Grundspiel.\nauto = so viel langsamer, dass Tag und Nacht in echter Zeit genauso lange dauern wie bisher (bei einem Tag pro Wechsel 13-mal langsamer). Empfohlen.\n1 = der Kalender läuft wie gewohnt; Tag und Nacht wechseln dann 13-mal schneller, zu schnell zum Zusehen.\n2 bis 100 = alles dazwischen.\nWas dabei langsamer wird, stellst du unter „Was langsamer wird“ ein.
daynight.slow.label = Was langsamer wird
daynight.slow.description = calendar (empfohlen): Nur der Kalender läuft langsamer. Bürger, Fahrzeuge, Bau und Produktion laufen so schnell wie immer; was das Spiel einmal am Tag erledigt (Verschmutzung abbauen, Kredite, Meldungen), passiert weiter im gewohnten Abstand.\nworld: Alles läuft langsamer, auch Bürger und Fahrzeuge. Bei 13-mal langsamer wirkt das wie Zeitlupe.\nnone: Nichts läuft langsamer, wie Tageslänge 1.
daynight.offset.label = Wann die Nacht kommt
daynight.offset.description = Verschiebt die Nacht innerhalb des Tages, 0 bis 1. Bei 0 wird es kurz nach der Tagesmitte dunkel, bei 0.5 genau beim Datumswechsel.\nMit einem anderen Wert als 0 ist „13 Kalendertage“ nicht mehr exakt wie im Grundspiel.
daynight.fade.label = Lichtwechsel anpassen
daynight.fade.description = Das Spiel blendet das Licht zwischen Morgen, Tag, Abend und Nacht immer gleich langsam ein; das war für den langen 13-Tage-Wechsel gedacht.\nEIN macht die Überblendung passend kürzer.\nAUS lässt sie wie im Grundspiel; dann ist eine Überblendung nie fertig, bevor die nächste beginnt, und das Licht wirkt verwaschen.
daynight.vehicle_scale.label = Fahrzeuggeschwindigkeit
daynight.vehicle_scale.description = Nur Fahrzeuge: Lkw, Züge, Schiffe, Flugzeuge. 1 = wie im Grundspiel, 2 = halb so schnell, 0.5 = doppelt so schnell. Unabhängig von allem anderen.
daynight.sim_scale.label = Tempo von allem anderen
daynight.sim_scale.description = Alles außer Fahrzeugen: Bürger, Bau, Produktion, Verschleiß, Animationen. 1 = wie im Grundspiel, 2 = halb so schnell, 0.5 = doppelt so schnell.
daynight.probe.label = Tageslängen ins Protokoll schreiben
daynight.probe.description = EIN schreibt in tesmioloader.log, wie lange jeder Tag und jeder Lichtwechsel in echten Sekunden gedauert hat. Nur für die Fehlersuche. Steht dort, dass ein ganzer Tag-Nacht-Wechsel in 3 Sekunden durchläuft, ist alles in Ordnung und nur zu schnell: Tageslänge erhöhen.
walking.description = Wie weit Bürger zu Fuß gehen und wie weit Autobesitzer zwischen Zuhause, Arbeit und Parkplatz fahren.
walking.group.distances = Entfernungen
walking.group.distances.description = Gemessen wird der Weg über Straßen und Gehwege, nicht die Luftlinie. Ein Gebäude 400 m entfernt auf der anderen Flussseite kann 1200 m Fußweg bedeuten.
walking.group.diagnostics = Fehlersuche
walking.enabled.label = Plugin aktiv
walking.enabled.description = AUS lässt das Spiel genau so, wie es ohne das Plugin ist.
walking.distance.label = Fußweg (m)
walking.distance.description = Der längste Weg, den ein Bürger zu Fuß geht. Im Grundspiel sind es 480 m.\nEin höherer Wert: Mehr Gebäude sind zu Fuß erreichbar, mehr Bürger laufen, und beim Bauen entstehen mehr Verbindungen.\n0 = keine Grenze; in einer großen Stadt dauert dann jedes Bauen mehrere Sekunden. Mehr als 20000 nimmt das Plugin nicht an.
walking.car_distance.label = Fahrweg für Autobesitzer (m)
walking.car_distance.description = Die längste Fahrt zwischen Zuhause, Arbeit und Parkplatz, die das Spiel zulässt. Im Grundspiel sind es 2500 m.\nErhöhe diesen Wert zusammen mit dem Fußweg, damit ein Auto weiterhin weiter reicht als die Füße; bei gleichen Werten bringt ein Auto nichts.
walking.regen_on_load.label = Verbindungen beim Laden neu aufbauen
walking.regen_on_load.description = Wer wohin läuft und fährt, steht im Spielstand.\nEIN baut beim Laden alle Fuß- und Parkverbindungen neu auf, damit auch eine bestehende Stadt die neuen Entfernungen nutzt.\nAUS: Nur neu gebaute Gebäude nutzen die neuen Entfernungen.
walking.probe.label = Prüfwerte ins Protokoll schreiben
walking.probe.description = EIN schreibt in tesmioloader.log, welche Werte das Plugin im Spiel vorgefunden hat, bevor es sie ändert. Nur nach einem Spiel-Update nützlich, um zu sehen, ob das Plugin noch passt.
accumulator.description = Batterien für dein Stromnetz. Ein Gebäude mit großem Stromspeicher lädt sich auf, wenn Strom übrig ist, und gibt ihn wieder ab, wenn Strom fehlt.
accumulator.group.battery = Batterie
accumulator.group.battery.description = Welche Gebäude als Batterie gelten und wie schnell sie sich füllen und leeren.
accumulator.group.window = Gebäudefenster
accumulator.group.grid = Stromnetz
accumulator.group.diagnostics = Fehlersuche
accumulator.enabled.label = Plugin aktiv
accumulator.enabled.description = AUS schaltet das Plugin ab. Deine Batteriegebäude bleiben stehen und füllen sich weiter, geben aber keinen Strom mehr ab.
accumulator.building_types.label = Gebäudetypen
accumulator.building_types.description = Welche Gebäudearten als Batterie arbeiten dürfen, als Nummern mit Komma getrennt: 19 = Transformator, 18 = Umspannwerk. 17 (Kraftwerk) nicht eintragen; ein Kraftwerk kann im Spiel keinen Strom aufnehmen und würde nie laden.
accumulator.min_capacity.label = Mindestspeicher für eine Batterie
accumulator.min_capacity.description = Ab diesem Speicher gilt ein Gebäude als Batterie. Normale Umspannwerke haben nur einen kleinen Speicher und bleiben so außen vor. Die mitgelieferte Batterie „Stationary Accumulator“ hat 5000.
accumulator.charge_rate.label = Ladegeschwindigkeit (Strom pro Sekunde)
accumulator.charge_rate.description = Wie viel Strom die Batterie höchstens pro Sekunde aufnimmt. Ohne diese Grenze würde eine leere Batterie einer ganzen Stadt den Strom wegnehmen. Zum Vergleich: Ein Kohlekraftwerk liefert 70, ein Windrad 15. Mit 60 füllt sich die Batterie etwa mit dem, was ein Kohlekraftwerk übrig hat.
accumulator.discharge_rate.label = Entladegeschwindigkeit (Strom pro Sekunde)
accumulator.discharge_rate.description = Wie viel Strom die Batterie höchstens pro Sekunde abgibt. Sie gibt nur ab, wenn Strom fehlt; solange das Netz genug hat, bleibt sie voll. Mit 60 ersetzt eine volle 5000er-Batterie ein Kraftwerk für gut 80 Sekunden. Höher = größere Ausfälle abfangen, niedriger = die Ladung reicht länger.
accumulator.panel.label = Ladezeile im Batteriefenster
accumulator.panel.description = EIN zeigt im Fenster der Batterie eine zusätzliche Zeile mit dem Ladestand, zum Beispiel „Charge: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Beschriftung dieser Zeile
accumulator.panel_caption.description = Das Wort vor dem Ladestand. Nur Buchstaben ohne Umlaute und ohne Sonderzeichen, sonst zeigt das Spiel Zeichensalat.
accumulator.gauges.label = Anzeigen im Fenster von der Batterie berechnen
accumulator.gauges.description = Das Spiel zeigt bei einer Batterie normalerweise 0 Strom und warnt „ohne Stromversorgung“, obwohl sie lädt. EIN zeigt stattdessen, was gerade in die Batterie hinein- und aus ihr herausgeht. AUS lässt die Anzeige des Spiels samt Warnung so, wie sie ist.
accumulator.spread_voltage.label = Versuch: Spannung an Nachbarn weitergeben (aus lassen)
accumulator.spread_voltage.description = Ein alter Versuch, der nicht funktioniert hat; die Aufgabe übernimmt das Plugin inzwischen anders. Lass den Schalter aus.
accumulator.trace.label = Nachbarn der ersten Batterie protokollieren
accumulator.trace.description = EIN schreibt ins Protokoll, was die Gebäude neben der ersten Batterie an Strom bekommen. Nur für die Fehlersuche, kostet etwas Leistung.
accumulator.log_seconds.label = Abstand der Batterie-Protokollzeilen (Sekunden)
accumulator.log_seconds.description = Alle so viele Sekunden schreibt das Plugin je Batterie eine Zeile mit Ladestand, Zufluss und Abfluss in tesmioloader.log. 0 = aus. Beim ersten Ausprobieren hilfreich, um zu sehen, ob Laden und Entladen wie eingestellt laufen.
accumulator.probe.label = Abstand der Gebäudelisten im Protokoll (Sekunden)
accumulator.probe.description = Alle so viele Sekunden listet das Plugin alle Gebäude mit Stromspeicher im Protokoll auf. 0 = aus. Nur einschalten, wenn deine Batterie nicht erkannt wird oder nach einem Spiel-Update etwas nicht mehr stimmt.
cities.description = Größe und Form jeder Stadt. Im Grundspiel ist jede Stadt ein Kreis mit 1000 m Radius. Mit diesem Plugin stellst du den Radius für jede Stadt einzeln ein, wahlweise als Quadrat, direkt im Stadtfenster. Die Werte werden im Spielstand gespeichert.
cities.group.cities = Städte
cities.group.slider = Radiusregler
cities.group.slider.description = Wie weit der Regler im Stadtfenster reicht und wie viel ein Klick auf + oder - ändert.
cities.group.layout = Anordnung im Stadtfenster
cities.group.layout.description = Wo die zwei neuen Zeilen im Stadtfenster stehen. Die Zahlen sind Positionen in der Maßeinheit des Spielfensters; das Fenster ist etwa 500 breit.
cities.group.overlay = Punktraster am Boden
cities.group.diagnostics = Fehlersuche
cities.enabled.label = Plugin aktiv
cities.enabled.description = AUS lässt das Spiel genau so, wie es ohne das Plugin ist.
cities.window.label = Radiusregler und Formkästchen im Stadtfenster
cities.window.description = EIN zeigt im Stadtfenster den Radiusregler und das Kästchen für die quadratische Form.\nAUS blendet beide aus; die eingestellten Werte bleiben, du kannst sie aber nicht mehr ändern.
cities.adopt.label = Verwaisten Gebäuden eine eigene Stadt geben
cities.adopt.description = Wenn du eine Stadt verkleinerst, können Gebäude außerhalb landen, die zu keiner Stadt mehr gehören.\nEIN gründet für sie eine neue Stadt mit zufälligem Namen und dem heutigen Datum, so wie das Spiel es selbst tut.\nAUS lässt sie ohne Stadt; wie sich das Spiel dann verhält, ist nicht geprüft.
cities.radius.label = Standardradius (m)
cities.radius.description = Radius für jede Stadt, die du noch nie einzeln eingestellt hast. 1000 ist das Grundspiel. Ein anderer Wert ändert alle diese Städte auf allen Karten gleichzeitig.
cities.square.label = Standardform quadratisch
cities.square.description = EIN macht jede noch nie einzeln eingestellte Stadt quadratisch.\nAUS = Kreis wie im Grundspiel.
cities.radius_min.label = Kleinster Radius am Regler (m)
cities.radius_min.description = Der Wert ganz links am Regler.
cities.radius_max.label = Größter Radius am Regler (m)
cities.radius_max.description = Der Wert ganz rechts am Regler. Der Regler hat 100 Stufen; bei 200 bis 5000 ist eine Stufe 48 m.
cities.step.label = Prozent je Klick
cities.step.description = Wie viel Prozent des Reglerbereichs ein Klick auf + oder - ändert. Beim Ziehen des Reglers gilt das nicht.
cities.label_x.label = Position der Beschriftung
cities.label_x.description = Abstand der Beschriftung vom linken Fensterrand.
cities.widget_x.label = Position des Bedienelements
cities.widget_x.description = Abstand von Regler und Kästchen vom linken Fensterrand. Der Regler braucht etwa 225.
cities.checkbox_dy.label = Kästchenzeile nach oben oder unten schieben
cities.checkbox_dy.description = Das Spiel zeichnet Kästchen etwas höher als angegeben; dieser Wert gleicht das aus, damit das Kästchen nicht auf dem Regler sitzt. Höher = Zeile weiter unten, niedriger = weiter oben.
cities.overlay.label = Raster folgt Radius und Form
cities.overlay.description = Bei offenem Stadtfenster zeigt das Spiel ein blaues Punktraster am Boden, aber immer nur für einen Kreis von 1000 m.\nEIN passt das Raster an deinen Radius und die Form an.\nAUS lässt es wie im Grundspiel.
cities.overlay_step.label = Rasterabstand (m)
cities.overlay_step.description = Abstand zwischen den Punkten. 0 wählt automatisch ein Zwanzigstel des Radius, mindestens 50 m wie im Grundspiel. Ein zu kleiner Abstand bei großem Radius kostet viel Leistung, weil das Spiel jeden Punkt einzeln prüft.
cities.probe.label = Städte ins Protokoll schreiben
cities.probe.description = EIN schreibt nach jedem Laden alle Städte mit Radius, Form und Gebäudezahl in tesmioloader.log, dazu laufend Zeilen, solange ein Stadtfenster offen ist. Nur für die Fehlersuche, das Protokoll wird groß.
depletion.description = Vorkommen gehen zur Neige. Eine arbeitende Mine baut das Vorkommen auf der Karte sichtbar ab, und je weniger übrig ist, desto weniger fördert sie. Der Abbau wird im Spielstand gespeichert; schaltest du das Plugin später aus, kommt das Abgebaute nicht zurück. Teste es zuerst auf einer Kopie deines Spielstands.
depletion.group.depletion = Abbau
depletion.group.window = Minenfenster
depletion.group.diagnostics = Fehlersuche
depletion.enabled.label = Plugin aktiv
depletion.enabled.description = AUS = Grundspiel: Vorkommen sind unendlich, eine Mine fördert für immer gleich viel.
depletion.tonnes_per_texel.label = Tonnen je Kartenpunkt
depletion.tonnes_per_texel.description = Wie viele Tonnen eine Mine aus einem Punkt der Ressourcenkarte holen kann, bevor er leer ist; ein voller Punkt liefert diesen Wert, ein schwächerer entsprechend weniger. Der wichtigste Regler: Mehr = die Vorkommen halten länger.\nZum Vergleich: Eine Erzmine sucht im Umkreis von 210 m und deckt damit einige tausend Punkte ab. Das Protokoll nennt beim ersten Abtasten den Vorrat jeder Mine.
depletion.vanilla.label = Vorkommen des Grundspiels, die zur Neige gehen
depletion.vanilla.description = Mit Komma getrennt: oil, iron, coal, uranium, bauxite, gravel, oder all (alle) oder none (keines). Hinter einem Doppelpunkt kann ein eigener Wert für Tonnen je Kartenpunkt stehen, zum Beispiel iron:3000.\nVorkommen aus deposits.ini sind immer dabei.\nKies (gravel) ist ein Sonderfall: Der Abbau trägt die sichtbare Bodentextur dauerhaft ab, und weil eine Kiesgrube nur einen kleinen Umkreis absucht, braucht Kies einen viel höheren Wert je Kartenpunkt. Lass das Wort weg, um Kies wie im Grundspiel zu lassen.
depletion.flush_seconds.label = Sekunden bis zum Speichern des Abbaus
depletion.flush_seconds.description = Stellt die Sekunden ein, in der das Plugin den angesammelten Abbau in die Ressourcenkarte schreibt.\nFörderung und Qualität stimmen immer sofort; dieser Wert bestimmt nur, wie oft Minimap und Spielstand nachziehen. Das Schreiben kostet kurz Leistung, deshalb nie öfter als viermal pro Sekunde.
depletion.panel.label = Restvorkommen-Zeile im Minenfenster
depletion.panel.description = EIN zeigt im Minenfenster unter „Aktuelle Produktion pro Arbeitstag“ eine Zeile mit dem Rest, zum Beispiel „Deposit remaining: 251.4 kt / 259.3 kt (96.9 %)“. Das Fenster wird dafür etwas höher.
depletion.panel_caption.label = Beschriftung dieser Zeile
depletion.panel_caption.description = Das Wort vor dem Restwert. Nur Buchstaben ohne Umlaute und ohne Sonderzeichen, sonst zeigt das Spiel Zeichensalat.
depletion.log_seconds.label = Abstand der Fortschrittszeilen (Sekunden)
depletion.log_seconds.description = Stellt die Sekunden ein, in der je Mine eine Zeile in tesmioloader.log eingetragen wird.\nZum Beispiel: „coal mine: 99.86% left, 258926 of 259289 t, quality 0.686“.\n0 = aus\nSo findest du den passenden Wert für Tonnen je Kartenpunkt: ein paar Spieltage zusehen und den Wert anpassen, bis eine Mine so lange hält, wie du willst.
easystart.description = Die Bedürfnisse der Bürger kommen nach und nach mit den Jahren. Ein noch nicht freigeschaltetes Bedürfnis zählt nicht für Zufriedenheit und Gesundheit; die Bürger gehen trotzdem hin und kaufen ein, nur die Folgen bleiben bis zum Freischaltjahr aus.
easystart.group.general = Was zurückgehalten wird
easystart.group.unlock = Freischaltjahre
easystart.group.unlock.description = Das Jahr, ab dem ein Bedürfnis zählt, jeweils ab dem 1. Januar.\noff = nie, das Bedürfnis bleibt wie im Grundspiel.\nalways = vom ersten Tag an.\nDer Zeitplan geht von einer Republikgründung 1920 aus. Startest du wie im Grundspiel ab 1960, liegen alle Jahre schon in der Vergangenheit und das Plugin ändert nichts.
easystart.group.diagnostics = Fehlersuche
easystart.enabled.label = Plugin aktiv
easystart.enabled.description = AUS lässt das Spiel genau so, wie es ohne das Plugin ist.
easystart.demands.label = Die neun Bürgerbedürfnisse zurückhalten
easystart.demands.description = Nahrung, Fleisch, Kleidung, Elektronik, Alkohol, Religion, Kultur, Sport, Gesundheit.\nEIN hält sie bis zu ihrem Freischaltjahr zurück.\nAUS lässt alle neun wie im Grundspiel.
easystart.utilities.label = Die drei Gebäudeversorgungen zurückhalten
easystart.utilities.description = Strom, Wasser und Heizung, die ein Gebäude braucht.\nEIN hält sie bis zu ihrem Freischaltjahr zurück.\nAUS lässt sie wie im Grundspiel.
easystart.warnings.label = Warnungen im Gebäudefenster zurückhalten
easystart.warnings.description = Meldungen wie „Gebäude ohne Stromversorgung“ oder „N Bürger derzeit ohne Trinkwasser“. Das Spiel zählt sie getrennt von der Zufriedenheit, deshalb blieben sie sonst sichtbar.\nEIN blendet sie bis zum Freischaltjahr aus.\nAUS zeigt sie wie im Grundspiel.
easystart.pin_status.label = Zufriedenheit gesperrter Bedürfnisse festhalten
easystart.pin_status.description = EIN hält die Zufriedenheit eines gesperrten Bedürfnisses auf dem Wert darunter fest, statt sie jeden Tag sinken zu lassen.\nAUS: Im Freischaltjahr ist die Zufriedenheit dann schon ganz unten.
easystart.locked_status.label = Zufriedenheit während der Sperre
easystart.locked_status.description = 1.0 = völlig zufrieden. 0.5 lässt Luft nach oben, damit sich das Bedürfnis beim Freischalten spürbar neu anfühlt.\nBei Nahrung steht der Wert für die Sättigung: 1.0 heißt, niemand verhungert, solange Nahrung gesperrt ist.
easystart.clear_unsatisfied.label = Gesperrte Bedürfnisse aus der Mangelliste nehmen
easystart.clear_unsatisfied.description = EIN nimmt gesperrte Bedürfnisse aus der Liste, die „N Bürger konnten X nicht bekommen“ auslöst.\nAUS lässt die Meldung wie im Grundspiel.
easystart.probe.label = Freischaltungen ins Protokoll schreiben
easystart.probe.description = EIN schreibt bei jedem Jahreswechsel in tesmioloader.log, welche Bedürfnisse noch kommen, und einmalig den ersten Bürger, bei dem ein Bedürfnis zurückgehalten wurde.
easystart.food.label = Nahrung
easystart.religion.label = Religion
easystart.meat.label = Fleisch
easystart.clothes.label = Kleidung
easystart.alcohol.label = Alkohol
easystart.sport.label = Sport
easystart.culture.label = Kultur
easystart.health.label = Gesundheit
easystart.electricity.label = Strom
easystart.water.label = Wasser (deckt Abwasser mit ab)
easystart.heating.label = Heizung
easystart.electronics.label = Elektronik
easystart.school.label = Schule
easystart.school.description = Vor diesem Jahr lernen Kinder auch ohne Schule, wie in der Bildungseinstellung „Einfach“ des Spiels, und die Meldung „N Kinder können nicht zur Schule“ bleibt aus.
easystart.kindergarten.label = Kindergarten
easystart.kindergarten.description = Vor diesem Jahr muss kein Elternteil wegen eines Kindes unter sechs zu Hause bleiben, und die Meldung „N Arbeiter können nicht arbeiten, weil alle Kindergärten …“ bleibt aus.

; workshop_bridge (seit 0.14.0)
workshop_bridge.description = Lädt die Spiel-DLLs deiner abonnierten Workshop-Pakete direkt in TesmioLoader, ohne Soviet Mod Loader und ohne Kopieren. Bleibt untätig, solange Soviet Mod Loader eingeschaltet ist, und lädt nie ein Paket, das auch in plugins\ liegt.
workshop_bridge.group.bridge = Bridge
workshop_bridge.group.log = Fehlersuche
workshop_bridge.prune.label = Bridge-Liste aufräumen
workshop_bridge.prune.description = Entfernt alte Einträge aus der Paketliste, deren Paket nicht mehr in deiner Plugin-Liste liegt. Einträge vorhandener Pakete bleiben, auch ausgeschaltete. So entscheidest du selbst, ob ein Paket nur vorübergehend weg ist.
workshop_bridge.prune.button = Jetzt aufräumen
workshop_bridge.notice = Welche Pakete laden, stellst du nicht hier ein: Schalte „Plugin aktiv“ bei jedem Workshop-Paket ein oder aus. Die Bridge führt diese Liste in user_config\workshop_bridge.ini.
workshop_bridge.enabled.label = Bridge aktiv
workshop_bridge.enabled.description = AUS lässt jedes Workshop-Paket ungeladen, sofern nicht Soviet Mod Loader oder eine lokale Kopie in plugins\ es übernimmt.
workshop_bridge.policy.label = Pakete ohne Listeneintrag
workshop_bridge.policy.description = list: Nur Pakete laden, die du eingeschaltet hast. all: Jedes abonnierte Paket mit Eingriffen ins Spiel lädt, sofern du es nicht ausgeschaltet hast.
workshop_bridge.workshop_root.label = Workshop-Ordner
workshop_bridge.workshop_root.description = auto findet steamapps\workshop\content\784150 in der Steam-Bibliothek des Spiels. Sonst ein absoluter Pfad mit einem Unterordner je Paket.
workshop_bridge.log_verbose.label = Jedes übersprungene Paket protokollieren
workshop_bridge.log_verbose.description = EIN schreibt je Paket, das die Bridge angesehen und nicht geladen hat, eine Zeile in tesmioloader.log. Praktisch, wenn ein Paket fehlt.
plugin.needs = Needs
plugin.needs.description = Zusätzliche Bedürfnisse der Bürger (gewünschte Ressourcen) und die Plugin-Schalter verwalten, ohne die Originaldatei zu bearbeiten.
tab.needs.editor = Bedürfnisse
group.needs = Bedürfnisse der Bürger
group.needs.plugin = Plugin-Einstellungen
group.needs.plugin.description = Schalter, die für alle Bedürfnisse gelten.
needs.list = Bedürfnisliste
needs.add = Bedürfnis hinzufügen
needs.select_help = Wähle links ein Bedürfnis aus oder füge mit + eine durch Resources registrierte Ressource hinzu.
needs.resource = Ressource
needs.resource.help = Die Ressource, die die Bürger wollen sollen. Sie muss in der Liste des Resources-Plugins registriert sein.
needs.donor = Spender-Bedürfnis
needs.donor.description = Vorhandenes Bürgerbedürfnis, von dem das neue kopiert wird. food oder meat für Lebensmittelläden, clothes oder eletronics für Kaufhäuser (Schreibweise des Spiels).
needs.factor = Mengenfaktor
needs.factor.description = Wie viel davon, gemessen am Spender-Bedürfnis. 1.0 heißt: so viel wie vom Spender.
needs.category = Ladenkategorie
needs.category.description = Welche Läden die Ware führen.\nauto = wie beim Spender-Bedürfnis\nnone = kein Regal, ein Gebäude muss es selbst vorsehen\nbasic, medium, advanced, mediumadvanced, hotel = nur diese Ladengröße\nEine Zahl trägt das Spiel direkt als Ladenwert ein (nur für Kenner der Spieldateien).
needs.chance = Wahrscheinlichkeit
needs.chance.description = 0 bis 1, wie oft ein Bürger das Bedürfnis überhaupt aufnimmt. Unter 1 macht das Bedürfnis vom Spender unabhängig.
needs.unhappy = Unzufriedenheit
needs.unhappy.description = Wie viel Zufriedenheit ein Bürger jedes Mal verliert, wenn er die Ware nicht bekommt, 0 bis 1.\n0 = das Bedürfnis wird nur angezeigt.\nFür ein Komfortgut etwa 0.005 bis 0.02.
needs.enabled = Plugin aktiv
needs.enabled.description = EIN lässt das Plugin arbeiten.\nAUS schaltet es beim nächsten Spielstart komplett ab.
needs.demand = Bedürfnisse vergeben
needs.demand.description = EIN gibt den Bürgern das neue Bedürfnis.\nAUS lässt die Bürger in Ruhe und bestückt nur die Läden.
needs.storage = Läden bestücken
needs.storage.description = EIN legt die Ware in jeden Laden, der auch den Spender führt.\nAUS heißt: Die Bürger wollen die Ware, finden sie aber nirgends.
needs.max_demands = Bedürfnisse je Bürger
needs.max_demands.description = Wie viele Bedürfnisse ein Bürger gleichzeitig tragen darf. 7 ist eine harte Obergrenze.
needs.when_full = Wenn der Bürger voll ist
needs.when_full.description = skip = wartet, bis der Bürger wieder Platz hat\nreplace = nimmt diesmal den Platz des Spender-Bedürfnisses
needs.probe = Ausführliches Protokoll
needs.probe.description = EIN schreibt die Bedürfnislisten der Bürger und eine Zeile je Laden ins Protokoll des Plugins. Lass es EIN, bis die Läden bestückt sind.\nAUS schreibt nur Warnungen.
needs.log_seconds = Abstand der Fortschrittszeilen (Sekunden)
needs.log_seconds.description = So viele Sekunden liegen zwischen zwei Zeilen im Protokoll, die melden, wie viele Bedürfnisse schon vergeben sind.\n0 schaltet diese Zeilen ab.
tab.needs.general = Allgemein
plugin.deposits = Deposits
plugin.deposits.description = Vorkommen verwalten, die das Grundspiel nicht kennt, sowie die Plugin-Schalter, ohne die Originaldatei zu bearbeiten.
tab.deposits.general = Allgemein
tab.deposits.editor = Vorkommen
group.deposits = Vorkommen
group.deposits.description = Original-Vorkommen sind geschützt und können ausgeblendet werden. Persönliche Vorkommen werden getrennt gespeichert und in die wirksame deposits.ini übernommen. Jeder Abschnitt außer [deposits] ist ein Vorkommen.
group.deposits.plugin = Plugin-Einstellungen
group.deposits.plugin.description = Die drei Teilsysteme im Abschnitt [deposits]. Ist ein Schalter hier aus, gilt das für alle Vorkommen.
deposits.notice = Typnummer, Kartenplatz und das Token in der building.ini eines Vorkommens sind Teil des Spielstands, sobald eine Mine sie verwendet. Ein Vorkommen zu entfernen oder umzunummerieren, das ein Spielstand nutzt, kann diesen Spielstand unbrauchbar machen – erst auf einer Kopie testen.
deposits.list = Vorkommenliste
deposits.add = Vorkommen hinzufügen
deposits.select_help = Wähle links ein Vorkommen oder leg mit + ein neues für eine Ressource aus Resources an.
deposits.name = Vorkommen
deposits.name.help = Der Abschnittsname in der deposits.ini. Er benennt das Vorkommen im Protokoll und im Editor-Pinsel und kann nicht nachträglich geändert werden.
deposits.new_name = Name des Vorkommens
deposits.new_hint = Hier gibst du nur die Grunddaten an. Komponente, Gebäudetyp und Erschöpfung stellst du nach dem Hinzufügen rechts ein.
deposits.code_patch = Anpassung der Spieldatei
deposits.code_patch.description = Trägt die eingetragenen $TYPE_MINE_-Vorkommenstypen ins Spiel ein, damit Minen sie über die building.ini finden und nutzen können. Wenn die Spieldaten nicht wie erwartet passen, nimmt das Plugin keine Änderung vor.
deposits.minimap_all = Minimap-Ebenen
deposits.minimap_all.description = EIN legt für jedes Vorkommen mit eingeschaltetem Minimap-Knopf einen Knopf unter die fünf Knöpfe des Spiels.\nAUS zeigt keine Knöpfe für Plugin-Vorkommen, auch wenn sie einzeln eingeschaltet sind.
deposits.editor_all = Pinsel im Terrain-Editor
deposits.editor_all.description = EIN legt für jedes Vorkommen mit Pinselname ein Mal- und Lösch-Paar im Reiter Resources des Geländeeditors an.\nAUS zeigt keine Pinsel für Plugin-Vorkommen, auch wenn sie einzeln einen Namen haben.
deposits.token = Gebäude-Token
deposits.token.description = Das Token, das in der building.ini für dieses Vorkommen verwendet wird, zum Beispiel $TYPE_MINE_COPPER. Es wird dort wie $TYPE_MINE_GRAVEL eingetragen. Nie zwei Token in derselben building.ini verwenden.
deposits.type = Typnummer
deposits.type.description = Die Typnummer, über die das Spiel das Vorkommen eindeutig zuordnet. Pflichtfeld mit einem Wert von 10 bis 127; die Nummern 0 bis 9 sind für das Grundspiel reserviert. Zwei Vorkommen dürfen nicht dieselbe Nummer verwenden. Der Dialog schlägt automatisch die nächste freie Nummer vor.
deposits.map = Karte
deposits.map.description = Bestimmt, wo das Vorkommen gespeichert wird: auto ist normalerweise richtig und nutzt eigene Karten des Plugins; resourcemap und resourcemap2 gehören zum Grundspiel. terrain ist nur für Ressourcen wie Kies gedacht, die direkt aus bemaltem Boden abgebaut werden; ihr Pinsel erscheint unter ROCKS.
deposits.component = Platz auf der Karte
deposits.component.description = Jede Karte hat vier Plätze, 0 bis 3, und jeder Platz trägt ein Vorkommen. Bei auto leer lassen, das Plugin sucht selbst einen freien Platz. Bei terrain: 2 ist die Kiesschicht, 3 die Oasenschicht.
deposits.building_type = Gebäudetyp
deposits.building_type.description = 7 ist eine Mine, was fast immer gewollt ist; Wasserbrunnen sind 92. Leer bedeutet 7.
deposits.radius = Suchradius
deposits.radius.description = Wie weit die Mine nach ihrem Vorkommen sucht. Eine Konstante des Spiels (oil, ore, bauxite, gravel, wood, water, watersurface) übernimmt deren Wert; eine Zahl gilt direkt; Wenn das Feld leer ist, gilt ore; Ohne Radius findet die Mine nichts.
deposits.icon = Minimap-Symbol
deposits.icon.description = Name der Ressource, deren Symbol auf dem Minimap-Knopf erscheint. Das Plugin nimmt das Symbol, das das Spiel für diese Ressource schon geladen hat; eine eigene Bilddatei ist nicht nötig; Ressourcen aus dem Resources-Plugin müssen dort registriert sein; Wenn das Feld leer ist, gilt kein Symbol.
deposits.minimap = Minimap-Knopf
deposits.minimap.description = EIN fügt für dieses Vorkommen einen Minimap-Knopf hinzu.
deposits.editor = Pinselname im Editor
deposits.editor.description = Gib dem Pinsel-Paar im Terrain-Editor einen Namen. Er ist zugleich der Name der zwei Bilddateien: tool_paint_<name>.png und tool_erase_<name>.png unter vfs\media_soviet\editor.\nHöchstens 31 Zeichen, Buchstaben, Ziffern, _ und -. Leer lässt den Pinsel weg.
deposits.deplete = Tonnen je Kartenpunkt
deposits.deplete.description = Wird vom Plugin depletion gelesen, nicht von diesem. Legt fest, wie viele Tonnen eine Mine aus einem Punkt der Ressourcenkarte holen kann, bevor er leer ist; ein voller Punkt liefert diesen Wert, ein schwächerer entsprechend weniger. Überschreibt tonnes_per_texel in plugins\depletion.ini; 0 nimmt das Vorkommen aus und lässt es unendlich; Leer übernimmt den globalen Wert.
deposits.save_warning = Änderungen werden erst beim Speichern in die wirksame deposits.ini übernommen. Typnummern, Kartenplätze und Token von Vorkommen, die ein Spielstand bereits nutzt, dürfen sich nicht ändern – das kann diesen Spielstand unbrauchbar machen.
depletion.tab.general = Allgemein
depletion.tab.mining = Abbau
needs.save_warning = Änderungen landen erst beim Speichern in der wirksamen needs.ini. Jedes Bedürfnis gibt den betroffenen Läden ein Lagerfach, das zum Spielstand gehört – teste das erst auf einer Kopie.
bp.name = Buildings Plus
bp.description = Neue Gebäude aus einer Erklärung: ein Spendergebäude des Spiels plus die Zeilen der building.ini, die anders sein sollen. Beim Spielstart als vollständige Workshop-Objekte geschrieben.
bp.notice = Jedes Gebäude wird ein Ordner unter media_soviet\workshop_wip mit eigener Workshop-ID. Lässt du die ID leer, vergibt das Plugin beim Spielstart die nächste freie Nummer ab 9300000000 und merkt sie sich in plugins\buildings_plus.ids.ini. Das Spiel liest den Ordner wie ein unveröffentlichtes Workshop-Objekt. Änderungen brauchen einen vollständigen Neustart. Ein Spielstand, der so ein Gebäude enthält, braucht den Ordner beim Laden.
bp.tab.general = Allgemein
bp.tab.buildings = Gebäude
bp.tab.sml = SML-Gebäude
bp.wip = Von Soviet Mod Loader erzeugte Gebäude
bp.wip.description = Die Gebäude eines Inhaltspakets erzeugt Soviet Mod Loader selbst, nach media_soviet\workshop_wip. Sie gehören nicht zu Buildings Plus - was hier steht, ist aus den Ordnern gelesen.
bp.wip.empty = Soviet Mod Loader hat hier kein Gebäude erzeugt. Ohne Inhaltspaket, das eines mitbringt, ist das normal.
bp.group = Gebäude
bp.group.notice = Ein Gebäude hier ist eine Kopie eines Spielgebäudes mit anderen Zeilen: gleiches Modell, gleiche Anschlüsse, dein Rezept. Wähle einen Spender derselben Art (Mine für Mine, Fabrik für Fabrik).
bp.list = Gebäude
bp.add = Hinzufügen
bp.select_help = Wähle links ein Gebäude oder lege mit + eines an. Der Spender wird zuerst abgefragt, die Workshop-ID kannst du leer lassen; Name und Zeilen folgen rechts.
bp.id = Objektname
bp.id.help = Benennt den Ordner und das Objekt des erzeugten Gebäudes und taucht so im Protokoll auf. Nur Buchstaben, Ziffern, _ und -, höchstens 64 Zeichen; nicht nachträglich änderbar.
bp.save_warning = Änderungen werden erst beim Speichern in die wirksame buildings_plus.ini übernommen und gelten nach einem vollständigen Neustart des Spiels. Das Plugin schreibt dann den Ordner unter media_soviet\workshop_wip; ein Abschnitt mit Fehler wird übersprungen und im Protokoll genannt.
bp.list.note = Höchstens 256 Gebäude.
bp.new_name = Objektname
bp.new_hint = Leerzeichen werden zu Unterstrichen, Großbuchstaben zu Kleinbuchstaben.
bp.card.folders = Erzeugte Ordner
bp.card.log = Fehlersuche
bp.card.new = Neues Gebäude
bp.links = Anleitungen
bp.link.readme = README (Anleitung)
bp.prune = Ordner aufräumen
bp.prune.description = EIN entfernt beim nächsten Spielstart den erzeugten Ordner eines Gebäudes, das du gelöscht oder ausgeschaltet hast (nur Ordner, die dieses Plugin geschrieben hat).\nAUS lässt solche Ordner liegen; das Spiel lädt diese Gebäude weiter.
bp.always = Immer neu schreiben
bp.always.description = EIN schreibt jeden Gebäudeordner bei jedem Spielstart neu.\nAUS schreibt einen Ordner nur, wenn sich sein Abschnitt, das Plugin oder eine Spenderdatei geändert hat. Lass es auf AUS.
bp.verbose = Ausführliches Protokoll
bp.verbose.description = EIN schreibt jede kopierte Datei und jede entfernte Spenderzeile nach logs\tesmioloader.buildings_plus.log.\nAUS schreibt nur Ergebnisse, Warnungen und Fehler.
bp.repair_owner_ids = Besitzer-ID nachtragen
bp.repair_owner_ids.description = EIN trägt beim Spielstart deine Steam-ID in erzeugte Gebäude nach, in denen keine steht - auch in die von Soviet Mod Loader. Fehlt sie, fragt das Spiel bei jedem Laden eines Spielstands nach fehlenden Workshop-Objekten.\nAUS lässt die Ordner anderer Generatoren in Ruhe.
bp.enabled = Gebäude aktiv
bp.enabled.description = AUS lässt den Abschnitt stehen, erzeugt aber nichts; mit „Ordner aufräumen“ EIN wird sein Ordner beim nächsten Start entfernt.
bp.item_id = Workshop-ID
bp.item_id.description = Eigene Nummer möglich: 9000000000 bis 9999999999, außer 9100000000 bis 9199999999 (die gehören Soviet Mod Loader)\nDie Nummer benennt den Ordner unter workshop_wip im Spielordner, sollte nachträglich nicht geändert werden.
bp.donor = Spendergebäude
bp.donor.description = Das Gebäude, von dem die Kopie ausgeht - ein Workshop-Gebäude musst du abonniert haben.\nMit „Spender wählen..." kannst du deine Objekte durchsuchen. Nimm die passende Art: eine Mine für eine Mine, eine Fabrik für eine Fabrik, einen Laden für einen Laden.
bp.item_name = Name im Spiel
bp.item_name.description = Der Name, welcher im Spiel angezeigt wird.\nMit Punkten darin gilt er als Übersetzungsschlüssel und wird über das Plugin Localization aufgelöst, zum Beispiel: localization.lang.salt_mine
bp.desc = Beschreibung
bp.desc.description = Die Beschreibung des Workshop-Eintrags, je Zeile eine Zeile. Keine Anführungszeichen.
bp.line = Zeilen der building.ini
bp.line.description = Je Zeile eine Zeile der building.ini, zum Beispiel $PRODUCTION raw_salt 1.0. Mit „Zeile wählen…“ holst du eine Zeile aus dem Spendergebäude und passt sie an. Deine Zeilen stehen vor denen des Spenders und ersetzen: dasselbe Token; jedes $TYPE_*; jedes $STORAGE* zusammen mit $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION und $CONSUMPTION_PER_SECOND als ein Rezept. Alles andere vom Spender bleibt.\nFür eigene Ressourcen immer $STORAGE_IMPORT_SPECIAL bzw. $STORAGE_EXPORT_SPECIAL mit dem Ressourcennamen nehmen, sonst listet das Lager alle Ressourcen der Transportklasse.
bp.strip = Spenderzeilen entfernen
bp.strip.description = Je Zeile ein $TOKEN, zum Beispiel $WORKERS_NEEDED. Jede Spenderzeile mit diesem Token fällt ersatzlos weg.
bp.life = Lebensdauer
bp.life.description = Leer = 3000\nLIFE in der renderconfig.ini: wie viel das Gebäude aushält, bevor es einstürzt. Wie die meisten Spielgebäude.
bp.card.lines = Zeilen
bp.item_id.empty = das Plugin vergibt beim Spielstart die nächste freie Nummer ab 9300000000.
bp.item_name.empty = der Objektname - nicht empfohlen.
needs_plus.card.log = Fehlersuche
resources_plus.card.log = Fehlersuche
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Geklonte Datensätze protokollieren
resources_plus.custom_report.description = EIN schreibt für jede Ressource mit Vorbild, was der Klon wirklich geerbt hat (Transportklasse, Faktoren, Flags). Ressourcen ohne Vorbild stehen immer drin.\nAUS schreibt nur die ohne Vorbild.
resources_plus.customs_hook = Zollhäuser auffrischen
resources_plus.customs_hook.description = EIN gibt bestehenden Zollhäusern die neuen Ressourcen zum Handel dazu.\nAUS ist das Grundspiel: ein Zollhaus handelt nur, was es beim Bau kannte - dann hilft nur Abreißen und neu bauen.
resources_plus.customs_probe = Zollhaus-Zeilen protokollieren
resources_plus.customs_probe.description = EIN schreibt eine Zeile je Ressource, die einem Zollhaus zum Handel dazugegeben wird, in tesmioloader.log. Schalte es AUS, sobald deine Zollhäuser zeigen, was du erwartest.
resources_plus.price_hook = Preise aus der INI anwenden
resources_plus.price_hook.description = EIN lässt die Abschnitte [base_price] und [price] wirken: Grundpreise werden vor der Preisrechnung des Spiels gesetzt, feste Preise danach.\nAUS überlässt die Preise dem Spiel.
resources_plus.price_report = Preistabelle protokollieren
resources_plus.price_report.description = EIN schreibt nach jeder Preisrechnung des Spiels alle Ressourcen mit Preis, Grundpreis und Preisart ins ausführliche Protokoll. Ein Preis von 0.00 heißt: kein Gebäude stellt die Ressource her.\nAUS schreibt nichts.
tab.resources_plus.general = Allgemein
resources.heading.basics = Transport und Preisart
resources.heading.cargo = Fracht und Material
resources.heading.fixed = Feste Preise
resources.heading.market = Marktwerte
resources.heading.prices = Preise im Datensatz
