[language]
name = Deutsch

[strings]
plugin.resources = Resources
plugin.resources.description = Ressourcen, Eigenschaften und optionale Preisvorgaben verwalten.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Eigene Ressourcen mit Resources Plus: dieselbe Liste wie beim Original, in plugins\resources_plus.ini, ohne den Absturz beim Beenden.
resources_plus.save_warning = Änderungen landen erst beim Speichern in plugins\resources_plus.ini. Entfernst du eine Ressource, die ein Spielstand schon nutzt, kann dieser Spielstand kaputtgehen.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Eigene Bürgerbedürfnisse mit Needs Plus: dieselbe Liste wie beim Original, in der Datei needs_plus.ini im Ordner plugins, beim ersten Start aus needs.ini übernommen.
needs_plus.save_warning = Änderungen landen erst beim Speichern in needs_plus.ini im Ordner plugins. Jedes Bedürfnis gibt den betroffenen Läden einen Lagerplatz, und der gehört zum Spielstand - teste zuerst auf einer Kopie.
tab.resources.editor = Ressourcen
group.resource_definitions = Ressourcendefinitionen
detail.transport = Transportklasse
detail.transport.description = Transportklasse der Ressource. Sie bestimmt passende Fahrzeuge und Lager. Das Plugin ergänzt die zugehörigen Spielwerte automatisch.\ncovered = gedeckte Fracht\nopen = offene Fracht\ngravel = Schüttgut\noil = Flüssigkeit im Tank\ncement = Zement\ncooler = Kühlware\nlivestock = Vieh\npassanger = Fahrgäste; Schreibweise des Spiels\nconcrete = Beton\neletric = Strom; Schreibweise des Spiels\nvehicles = Fahrzeuge\ngeneral = allgemeine Fracht\nnuclear1, nuclear2 = nukleare Fracht\nheating = Wärme\nwater = Wasser\nsewage = Abwasser\nwaste = Abfall
detail.kind = Preisart
detail.kind.description = Art der Ressource für die Preisberechnung.\n0 = Rohstoff\n1 = verarbeitetes Material\n2 = Nahrung oder Kleidung\n3 = fortgeschrittenes Material\n4 = Elektronik
detail.record_price = Startpreis im Datensatz
detail.record_price.description = Startpreis im Ressourcendatensatz.\nErster Wert = RUB\nZweiter Wert = USD\nDie Preisberechnung des Spiels kann diese Werte später überschreiben.
detail.record_base_price = Basispreis im Datensatz
detail.record_base_price.description = Startwert für den Grundpreis im Ressourcendatensatz.\nErster Wert = RUB\nZweiter Wert = USD\nFür dauerhaft feste Grundpreise verwende [base_price].
detail.trade_mult = Handelsfaktoren
detail.trade_mult.description = Faktoren für Verkauf und Einkauf.\nErster Wert = Verkaufsfaktor\nZweiter Wert = Einkaufsfaktor\nÜblicher Wert = 0.95, 1.05
detail.market_rub = RUB-Marktblock
detail.market_usd = USD-Marktblock
detail.market.description = Marktwerte im Ressourcendatensatz.\nErster Wert = Verkaufswert\nZweiter Wert = Einkaufswert\nDritter Wert = optionaler Koeffizient\nNur ändern, wenn du die Preisfelder des Spiels kennst.
detail.packed = Verpackte Fracht
detail.packed.description = Darstellung der Fracht.\nauto = passend zur Transportklasse automatisch wählen\n0 = unverpackt darstellen\n1 = verpackt darstellen
detail.family = Materialfamilie
detail.family.description = Materialfamilie für die Darstellung auf Baustellen und wahrscheinlich für die spätere Abfallsorte.\nnone = keine Familie\ngravel, steel, aluminium, plastic, bio, food, burnable, toxic, other, ash = entsprechende Familie\n10 bis 19 = Familie direkt als Spielwert eintragen
detail.cargo = Frachtgeometrie
detail.cargo.description = Geometrie der sichtbaren Fracht.\nauto = vorhandene Dateien oder die Darstellung der Vorlage verwenden\nnone = keine sichtbare Fracht\nbulk = Schüttgut in mehreren Füllstufen\nopen = offene Fracht auf einer Ladefläche
detail.pinned_base_price = Festgeschriebener Basispreis
detail.pinned_base_price.description = Optionaler Grundpreis in RUB und USD im Abschnitt [base_price].\nLeeres Feld = keinen eigenen Grundpreis festlegen
detail.forced_price = Erzwungener Endpreis
detail.forced_price.description = Optionaler fester Preis in RUB und USD im Abschnitt [price].\nLeeres Feld = Preis vom Spiel berechnen lassen

; --- Lokale Schemas fuer installierte Upstream-Plugins (seit 0.13.0) ---
daynight.description = Ein Sonnenaufgang und ein Sonnenuntergang pro Kalendertag. Im Grundspiel dauert ein Wechsel von Tag zu Nacht und zurück 13 Kalendertage, also fast zwei Wochen. Mit diesem Plugin passt er in einen Tag.
daynight.group.cycle = Tag und Nacht
daynight.group.cycle.description = Wie lang ein Tag-Nacht-Wechsel dauert und wann die Nacht kommt.
daynight.group.pace = Tempo
daynight.group.pace.description = Zwei getrennte Regler: einer für Fahrzeuge, einer für alles andere. Sie wirken immer, egal was oben eingestellt ist.
daynight.group.diagnostics = Fehlersuche
daynight.enabled.label = Plugin aktiv
daynight.enabled.description = EIN aktiviert den eingestellten Tag-Nacht-Zyklus.
daynight.cycle_days.label = Kalendertage pro Tag-Nacht-Wechsel
daynight.cycle_days.description = Kalendertage von einem Sonnenaufgang bis zum nächsten.\n1 = jeden Tag ein Sonnenaufgang und ein Sonnenuntergang\n2 bis 12 = entsprechend längerer Zyklus\n13 = Zyklus des Grundspiels
daynight.day_scale.label = Tageslänge (wie viel langsamer der Kalender läuft)
daynight.day_scale.description = Wie viel länger ein Kalendertag dauert als im Grundspiel.\nauto = Kalender automatisch passend verlangsamen; empfohlen\n1 = Kalender nicht verlangsamen; Tag und Nacht wechseln dann 13-mal schneller\n2 bis 100 = Kalender entsprechend verlangsamen\nWelche Teile des Spiels langsamer werden, legst du unter „Was langsamer wird“ fest.
daynight.slow.label = Was langsamer wird
daynight.slow.description = Legt fest, welche Teile des Spiels langsamer werden.\ncalendar = nur den Kalender verlangsamen; empfohlen\nworld = alles verlangsamen, auch Bürger und Fahrzeuge; hohe Werte wirken wie Zeitlupe\nnone = nichts verlangsamen\nBei calendar laufen Bürger, Fahrzeuge, Bau und Produktion normal weiter. Tägliche Vorgänge wie Verschmutzung, Kredite und Meldungen bleiben im gewohnten Abstand.
daynight.offset.label = Wann die Nacht kommt
daynight.offset.description = Verschiebt die Nacht innerhalb des Tages.\n0 = Dunkelheit beginnt kurz nach der Tagesmitte\n0.5 = Dunkelheit beginnt beim Datumswechsel\nBei einem anderen Wert als 0 entsprechen 13 Kalendertage nicht mehr genau dem Grundspiel.
daynight.fade.label = Lichtwechsel anpassen
daynight.fade.description = EIN verkürzt die Übergänge zwischen Morgen, Tag, Abend und Nacht passend zum eingestellten Zyklus.\nAUS verwendet die langsamen Übergänge des Grundspiels. Bei kurzen Zyklen können sie sich überlagern und verwaschen wirken.
daynight.vehicle_scale.label = Fahrzeuggeschwindigkeit
daynight.vehicle_scale.description = Geschwindigkeit von Lkw, Zügen, Schiffen und Flugzeugen. Wirkt unabhängig von den anderen Einstellungen.\n1 = Geschwindigkeit des Grundspiels\n2 = halb so schnell\n0.5 = doppelt so schnell\nHöherer Wert = langsamere Fahrzeuge
daynight.sim_scale.label = Tempo von allem anderen
daynight.sim_scale.description = Geschwindigkeit von Bürgern, Bau, Produktion, Verschleiß und Animationen.\n1 = Geschwindigkeit des Grundspiels\n2 = halb so schnell\n0.5 = doppelt so schnell\nHöherer Wert = langsamere Simulation
daynight.probe.label = Tageslängen ins Protokoll schreiben
daynight.probe.description = EIN schreibt die echte Dauer jedes Kalendertags und Lichtwechsels in tesmioloader.log. Nur für die Fehlersuche und die Prüfung nach einem Spielupdate.
walking.description = Wie weit Bürger zu Fuß gehen und wie weit Autobesitzer zwischen Zuhause, Arbeit und Parkplatz fahren.
walking.group.distances = Entfernungen
walking.group.distances.description = Gemessen wird der Weg über Straßen und Gehwege, nicht die Luftlinie. Ein Gebäude 400 m entfernt auf der anderen Flussseite kann 1200 m Fußweg bedeuten.
walking.group.diagnostics = Fehlersuche
walking.enabled.label = Plugin aktiv
walking.enabled.description = EIN aktiviert die eingestellten Geh- und Fahrentfernungen.
walking.distance.label = Fußweg (m)
walking.distance.description = Der längste Weg, den ein Bürger zu Fuß geht. Im Grundspiel sind es 480 m.\nHöherer Wert = mehr Gebäude sind zu Fuß erreichbar und beim Bauen entstehen mehr Verbindungen\n0 = keine Begrenzung; in großen Städten kann das Bauen dadurch mehrere Sekunden dauern\n20000 = höchster erlaubter Wert
walking.car_distance.label = Fahrweg für Autobesitzer (m)
walking.car_distance.description = Längste erlaubte Fahrt zwischen Zuhause, Arbeit und Parkplatz. Im Grundspiel sind es 2500 m.\nHöherer Wert = Autobesitzer fahren weiter\nStelle den Wert höher als die Gehstrecke ein. Bei gleichen Werten bietet das Auto keinen Entfernungsvorteil.
walking.regen_on_load.label = Verbindungen beim Laden neu aufbauen
walking.regen_on_load.description = Fuß- und Parkverbindungen werden im Spielstand gespeichert.\nEIN berechnet beim Laden alle Verbindungen neu. Dadurch gelten die eingestellten Entfernungen auch für bestehende Städte.\nAUS berechnet nur die Verbindungen neu gebauter Gebäude mit den eingestellten Entfernungen.
walking.probe.label = Prüfwerte ins Protokoll schreiben
walking.probe.description = EIN schreibt in tesmioloader.log, welche Werte das Plugin vor der Änderung im Spiel gefunden hat. Nur für die Fehlersuche und die Prüfung nach einem Spielupdate.
accumulator.description = Batterien für dein Stromnetz. Ein Gebäude mit großem Stromspeicher lädt sich auf, wenn Strom übrig ist, und gibt ihn wieder ab, wenn Strom fehlt.
accumulator.group.battery = Batterie
accumulator.group.battery.description = Welche Gebäude als Batterie gelten und wie schnell sie sich füllen und leeren.
accumulator.group.window = Gebäudefenster
accumulator.group.grid = Stromnetz
accumulator.group.diagnostics = Fehlersuche
accumulator.enabled.label = Plugin aktiv
accumulator.enabled.description = EIN aktiviert Laden und Entladen der Batteriegebäude.\nAUS beendet das Entladen. Die Gebäude bleiben stehen und können sich weiterhin füllen.
accumulator.building_types.label = Gebäudetypen
accumulator.building_types.description = Welche Gebäudetypen als Batterie arbeiten dürfen. Trenne mehrere Nummern mit einem Komma.\n19 = Transformator\n18 = Umspannwerk\n17 nicht verwenden: Ein Kraftwerk kann im Spiel keinen Strom aufnehmen und würde nie laden.
accumulator.min_capacity.label = Mindestspeicher für eine Batterie
accumulator.min_capacity.description = Ab dieser Speicherkapazität gilt ein Gebäude als Batterie. Kleine Speicher normaler Umspannwerke bleiben dadurch unberücksichtigt.\nHöherer Wert = weniger Gebäude werden als Batterie erkannt\nNiedrigerer Wert = mehr Gebäude werden als Batterie erkannt\nDie mitgelieferte „Stationary Accumulator“ hat 5000.
accumulator.charge_rate.label = Ladegeschwindigkeit (Strom pro Sekunde)
accumulator.charge_rate.description = Wie viel Strom eine Batterie höchstens pro Sekunde aufnimmt. Die Begrenzung verhindert, dass eine leere Batterie einer ganzen Stadt den Strom wegnimmt.\nHöherer Wert = Batterie lädt schneller und belastet das Stromnetz stärker\nNiedrigerer Wert = Batterie lädt langsamer und schont das Stromnetz\nZum Vergleich: Ein Kohlekraftwerk liefert 70, ein Windrad 15.
accumulator.discharge_rate.label = Entladegeschwindigkeit (Strom pro Sekunde)
accumulator.discharge_rate.description = Wie viel Strom die Batterie höchstens pro Sekunde abgibt. Sie gibt nur Strom ab, wenn im Netz Strom fehlt.\nHöherer Wert = größere Stromausfälle ausgleichen\nNiedrigerer Wert = die gespeicherte Energie reicht länger\nBeispiel: Mit 60 ersetzt eine volle Batterie mit 5000 Kapazität ein Kraftwerk für etwas mehr als 80 Sekunden.
accumulator.panel.label = Ladezeile im Batteriefenster
accumulator.panel.description = EIN zeigt im Batteriefenster eine zusätzliche Zeile mit dem Ladestand, zum Beispiel „Charge: 4210.5 / 5000 (84.2 %)“.
accumulator.panel_caption.label = Beschriftung dieser Zeile
accumulator.panel_caption.description = Das Wort vor dem Ladestand. Nur Buchstaben ohne Umlaute und ohne Sonderzeichen, sonst zeigt das Spiel Zeichensalat.
accumulator.gauges.label = Anzeigen im Fenster von der Batterie berechnen
accumulator.gauges.description = EIN zeigt anstelle der falschen Spielanzeige den tatsächlichen Stromfluss in die Batterie und aus ihr heraus.\nAUS verwendet die normale Spielanzeige. Sie kann 0 Strom und „ohne Stromversorgung“ anzeigen, obwohl die Batterie lädt.
accumulator.spread_voltage.label = Versuch: Spannung an Nachbarn weitergeben (aus lassen)
accumulator.spread_voltage.description = EIN hat keine Wirkung mehr. Diese alte Funktion wurde technisch ersetzt. Lass den Schalter auf AUS.
accumulator.trace.label = Nachbarn der ersten Batterie protokollieren
accumulator.trace.description = EIN schreibt in das Protokoll, wie viel Strom die Gebäude neben der ersten Batterie erhalten. Nur für die Fehlersuche; kann Leistung kosten.
accumulator.log_seconds.label = Abstand der Batterie-Protokollzeilen (Sekunden)
accumulator.log_seconds.description = Abstand zwischen zwei Statusmeldungen je Batterie in tesmioloader.log. Jede Meldung enthält Ladestand, Zufluss und Abfluss.\n0 = keine Statusmeldungen\nHöherer Wert = seltener protokollieren
accumulator.probe.label = Abstand der Gebäudelisten im Protokoll (Sekunden)
accumulator.probe.description = Abstand zwischen zwei Listen aller Gebäude mit Stromspeicher in tesmioloader.log. Nur verwenden, wenn eine Batterie nicht erkannt wird oder das Plugin nach einem Spielupdate geprüft werden muss.\n0 = keine Listen schreiben\nHöherer Wert = seltener protokollieren
cities.description = Größe und Form jeder Stadt. Im Grundspiel ist jede Stadt ein Kreis mit 1000 m Radius. Mit diesem Plugin stellst du den Radius für jede Stadt einzeln ein, wahlweise als Quadrat, direkt im Stadtfenster. Die Werte werden im Spielstand gespeichert.
cities.group.cities = Städte
cities.group.slider = Radiusregler
cities.group.slider.description = Wie weit der Regler im Stadtfenster reicht und wie viel ein Klick auf + oder - ändert.
cities.group.layout = Anordnung im Stadtfenster
cities.group.layout.description = Wo die zwei neuen Zeilen im Stadtfenster stehen. Die Zahlen sind Positionen in der Maßeinheit des Spielfensters; das Fenster ist etwa 500 breit.
cities.group.overlay = Punktraster am Boden
cities.group.diagnostics = Fehlersuche
cities.enabled.label = Plugin aktiv
cities.enabled.description = EIN aktiviert eigene Stadtgrößen und Stadtformen.
cities.window.label = Radiusregler und Formkästchen im Stadtfenster
cities.window.description = EIN zeigt im Stadtfenster den Radiusregler und das Kästchen für die quadratische Form.\nAUS blendet beide aus; die eingestellten Werte bleiben, du kannst sie aber nicht mehr ändern.
cities.adopt.label = Verwaisten Gebäuden eine eigene Stadt geben
cities.adopt.description = Wenn du eine Stadt verkleinerst, können Gebäude außerhalb landen, die zu keiner Stadt mehr gehören.\nEIN gründet für sie eine neue Stadt mit zufälligem Namen und dem heutigen Datum, so wie das Spiel es selbst tut.\nAUS lässt sie ohne Stadt; wie sich das Spiel dann verhält, ist nicht geprüft.
cities.radius.label = Standardradius (m)
cities.radius.description = Standardradius für Städte, die du noch nicht einzeln eingestellt hast. Der Wert gilt auf allen Karten.\n1000 = Radius des Grundspiels\nHöherer Wert = größere Städte\nNiedrigerer Wert = kleinere Städte
cities.square.label = Standardform quadratisch
cities.square.description = EIN macht noch nicht einzeln eingestellte Städte quadratisch.\nAUS verwendet einen Kreis wie im Grundspiel.
cities.radius_min.label = Kleinster Radius am Regler (m)
cities.radius_min.description = Kleinster Radius am linken Ende des Reglers.
cities.radius_max.label = Größter Radius am Regler (m)
cities.radius_max.description = Größter Radius am rechten Ende des Reglers. Der Regler hat 100 Stufen. Bei 200 bis 5000 entspricht eine Stufe 48 m.
cities.step.label = Prozent je Klick
cities.step.description = Wie viel Prozent des Reglerbereichs ein Klick auf + oder - verändert. Beim Ziehen des Reglers gilt dieser Wert nicht.\nHöherer Wert = größere Änderung je Klick\nNiedrigerer Wert = feinere Änderung je Klick
cities.label_x.label = Position der Beschriftung
cities.label_x.description = Abstand der Beschriftung vom linken Fensterrand.
cities.widget_x.label = Position des Bedienelements
cities.widget_x.description = Abstand von Regler und Kästchen vom linken Fensterrand. Der Regler braucht etwa 225.
cities.checkbox_dy.label = Kästchenzeile nach oben oder unten schieben
cities.checkbox_dy.description = Verschiebt das Kästchen nach oben oder unten, damit es nicht auf dem Regler liegt.\nHöherer Wert = Kästchen weiter unten\nNiedrigerer Wert = Kästchen weiter oben
cities.overlay.label = Raster folgt Radius und Form
cities.overlay.description = Bei offenem Stadtfenster zeigt das Spiel ein blaues Punktraster am Boden, aber immer nur für einen Kreis von 1000 m.\nEIN passt das Raster an deinen Radius und die Form an.\nAUS lässt es wie im Grundspiel.
cities.overlay_step.label = Rasterabstand (m)
cities.overlay_step.description = Abstand zwischen den Punkten des Stadtbereichs.\n0 = automatisch ein Zwanzigstel des Radius verwenden, mindestens 50 m\nKleinerer Wert = dichteres Raster und höhere Leistungsbelastung
cities.probe.label = Städte ins Protokoll schreiben
cities.probe.description = EIN schreibt nach jedem Laden Radius, Form und Gebäudezahl aller Städte in tesmioloader.log. Solange ein Stadtfenster offen ist, kommen weitere Meldungen hinzu. Nur für die Fehlersuche; das Protokoll kann schnell groß werden.
depletion.description = Vorkommen gehen zur Neige. Eine arbeitende Mine baut das Vorkommen auf der Karte sichtbar ab, und je weniger übrig ist, desto weniger fördert sie. Der Abbau wird im Spielstand gespeichert; schaltest du das Plugin später aus, kommt das Abgebaute nicht zurück. Teste es zuerst auf einer Kopie deines Spielstands.
depletion.group.depletion = Abbau
depletion.group.window = Minenfenster
depletion.group.diagnostics = Fehlersuche
depletion.enabled.label = Plugin aktiv
depletion.enabled.description = EIN lässt die ausgewählten Vorkommen beim Abbau zur Neige gehen.\nAUS beendet weiteren Abbau. Bereits abgebaute Ressourcen werden nicht wiederhergestellt.
depletion.tonnes_per_texel.label = Tonnen je Kartenpunkt
depletion.tonnes_per_texel.description = Tonnen, die eine Mine aus einem vollständig gefüllten Punkt der Ressourcenkarte fördern kann. Schwächere Punkte liefern entsprechend weniger.\nHöherer Wert = Vorkommen halten länger\nNiedrigerer Wert = Vorkommen sind schneller erschöpft\nZum Vergleich: Eine Erzmine erfasst mit 210 m Suchradius mehrere tausend Kartenpunkte.
depletion.vanilla.label = Vorkommen des Grundspiels, die zur Neige gehen
depletion.vanilla.description = Welche Vorkommen des Grundspiels aufgebraucht werden können. Trenne mehrere Werte mit einem Komma.\noil, iron, coal, uranium, bauxite, gravel = nur die genannten Vorkommen\nall = alle Vorkommen\nnone = keine Vorkommen des Grundspiels\nname:wert = eigener Wert für Tonnen je Kartenpunkt, zum Beispiel iron:3000\nVorkommen aus deposits.ini sind immer enthalten.\ngravel trägt die sichtbare Bodentextur dauerhaft ab und benötigt wegen des kleinen Suchbereichs einen deutlich höheren Wert. Lässt du gravel weg, bleibt Kies wie im Grundspiel.
depletion.flush_seconds.label = Sekunden bis zum Speichern des Abbaus
depletion.flush_seconds.description = Sekunden zwischen zwei Aktualisierungen der Ressourcenkarte. Förderung und Qualität werden sofort berechnet; nur Minimap und Spielstand folgen in diesem Abstand.\nKleinerer Wert = häufigere Aktualisierung und höhere Leistungsbelastung\nNicht häufiger als viermal pro Sekunde aktualisieren.
depletion.panel.label = Restvorkommen-Zeile im Minenfenster
depletion.panel.description = EIN zeigt im Minenfenster den verbleibenden Vorrat und vergrößert das Fenster etwas, zum Beispiel „Deposit remaining: 251.4 kt / 259.3 kt (96.9 %)“.
depletion.panel_caption.label = Beschriftung dieser Zeile
depletion.panel_caption.description = Das Wort vor dem Restwert. Nur Buchstaben ohne Umlaute und ohne Sonderzeichen, sonst zeigt das Spiel Zeichensalat.
depletion.log_seconds.label = Abstand der Fortschrittszeilen (Sekunden)
depletion.log_seconds.description = Sekunden zwischen zwei Statusmeldungen je Mine in tesmioloader.log. Die Meldung enthält Restmenge, Gesamtmenge und Qualität.\n0 = keine Statusmeldungen\nHöherer Wert = seltener protokollieren\nBeobachte einige Spieltage, um einen passenden Wert für Tonnen je Kartenpunkt zu finden.
easystart.description = Die Bedürfnisse der Bürger kommen nach und nach mit den Jahren. Ein noch nicht freigeschaltetes Bedürfnis zählt nicht für Zufriedenheit und Gesundheit; die Bürger gehen trotzdem hin und kaufen ein, nur die Folgen bleiben bis zum Freischaltjahr aus.
easystart.group.general = Was zurückgehalten wird
easystart.group.unlock = Freischaltjahre
easystart.group.unlock.description = Jahr, ab dem die jeweilige Anforderung ab dem 1. Januar gilt. Der Zeitplan ist für eine Republikgründung 1920 gedacht. Bei einem Start ab 1960 liegen die voreingestellten Jahre bereits in der Vergangenheit.\noff = nicht verzögern; Verhalten des Grundspiels\nalways = vom ersten Spieltag an anwenden\nEine Jahreszahl = ab diesem Jahr freischalten
easystart.group.diagnostics = Fehlersuche
easystart.enabled.label = Plugin aktiv
easystart.enabled.description = EIN schaltet Bedürfnisse und Versorgungsanforderungen nach dem eingestellten Zeitplan frei.
easystart.demands.label = Die neun Bürgerbedürfnisse zurückhalten
easystart.demands.description = EIN hält Nahrung, Fleisch, Kleidung, Elektronik, Alkohol, Religion, Kultur, Sport und Gesundheit bis zum jeweiligen Freischaltjahr zurück.
easystart.utilities.label = Die drei Gebäudeversorgungen zurückhalten
easystart.utilities.description = EIN hält Anforderungen an Strom, Wasser und Heizung bis zum jeweiligen Freischaltjahr zurück.
easystart.warnings.label = Warnungen im Gebäudefenster zurückhalten
easystart.warnings.description = EIN blendet zugehörige Warnungen bis zum Freischaltjahr aus, zum Beispiel „Gebäude ohne Stromversorgung“.
easystart.pin_status.label = Zufriedenheit gesperrter Bedürfnisse festhalten
easystart.pin_status.description = EIN hält die Zufriedenheit eines gesperrten Bedürfnisses auf dem unten eingestellten Wert.\nAUS lässt die Zufriedenheit weiter sinken; beim Freischalten kann sie bereits sehr niedrig sein.
easystart.locked_status.label = Zufriedenheit während der Sperre
easystart.locked_status.description = Zufriedenheit, solange ein Bedürfnis gesperrt ist. Bei Nahrung steht der Wert für die Sättigung.\n1.0 = vollständig zufrieden beziehungsweise satt\n0.5 = mittlerer Wert mit spürbarer Verbesserung nach dem Freischalten
easystart.clear_unsatisfied.label = Gesperrte Bedürfnisse aus der Mangelliste nehmen
easystart.clear_unsatisfied.description = EIN verhindert bei gesperrten Bedürfnissen die Meldung „N Bürger konnten X nicht bekommen“.
easystart.probe.label = Freischaltungen ins Protokoll schreiben
easystart.probe.description = EIN schreibt bei jedem Jahreswechsel die noch gesperrten Bedürfnisse in tesmioloader.log. Zusätzlich wird einmal der erste betroffene Bürger protokolliert. Nur für die Fehlersuche.
easystart.food.label = Nahrung
easystart.religion.label = Religion
easystart.meat.label = Fleisch
easystart.clothes.label = Kleidung
easystart.alcohol.label = Alkohol
easystart.sport.label = Sport
easystart.culture.label = Kultur
easystart.health.label = Gesundheit
easystart.electricity.label = Strom
easystart.water.label = Wasser (deckt Abwasser mit ab)
easystart.heating.label = Heizung
easystart.electronics.label = Elektronik
easystart.school.label = Schule
easystart.school.description = Jahr, vor dem Kinder auch ohne Schule lernen. Die Meldung „N Kinder können nicht zur Schule“ bleibt bis dahin aus.
easystart.kindergarten.label = Kindergarten
easystart.kindergarten.description = Jahr, vor dem Eltern wegen eines Kindes unter sechs nicht zu Hause bleiben müssen. Die entsprechende Warnmeldung bleibt bis dahin aus.

; workshop_bridge (seit 0.14.0)
workshop_bridge.description = Lädt die Spiel-DLLs deiner abonnierten Workshop-Pakete direkt in TesmioLoader, ohne Soviet Mod Loader und ohne Kopieren. Bleibt untätig, solange Soviet Mod Loader eingeschaltet ist, und lädt nie ein Paket, das auch in plugins\ liegt.
workshop_bridge.group.bridge = Bridge
workshop_bridge.group.log = Fehlersuche
workshop_bridge.prune.label = Bridge-Liste aufräumen
workshop_bridge.prune.description = Entfernt alte Einträge aus der Paketliste, deren Paket nicht mehr in deiner Plugin-Liste liegt. Einträge vorhandener Pakete bleiben, auch ausgeschaltete. So entscheidest du selbst, ob ein Paket nur vorübergehend weg ist.
workshop_bridge.prune.button = Jetzt aufräumen
workshop_bridge.notice = Welche Pakete laden, stellst du nicht hier ein: Schalte „Plugin aktiv“ bei jedem Workshop-Paket ein oder aus. Die Bridge führt diese Liste in user_config\workshop_bridge.ini.
workshop_bridge.enabled.label = Bridge aktiv
workshop_bridge.enabled.description = EIN lädt freigegebene Workshop-Plugins direkt in TesmioLoader.\nAUS lädt über die Bridge keine Pakete. Soviet Mod Loader oder lokale Kopien unter plugins\ können sie weiterhin laden.
workshop_bridge.policy.label = Pakete ohne Listeneintrag
workshop_bridge.policy.description = Regel für Pakete ohne eigenen Eintrag in der Paketliste.\nlist = nur ausdrücklich eingeschaltete Pakete laden\nall = alle Pakete mit Hooks laden, außer ausdrücklich ausgeschaltete
workshop_bridge.workshop_root.label = Workshop-Ordner
workshop_bridge.workshop_root.description = Ordner mit einem Unterordner je Workshop-Paket.\nauto = steamapps\workshop\content\784150 in der Steam-Bibliothek des Spiels automatisch finden\nAnderer Wert = diesen absoluten Ordnerpfad verwenden
workshop_bridge.log_verbose.label = Jedes übersprungene Paket protokollieren
workshop_bridge.log_verbose.description = EIN schreibt für jedes geprüfte, aber nicht geladene Paket eine Zeile in tesmioloader.log. Nur für die Fehlersuche bei fehlenden Paketen.
plugin.needs = Needs
plugin.needs.description = Zusätzliche Bedürfnisse der Bürger (gewünschte Ressourcen) und die Plugin-Schalter verwalten, ohne die Originaldatei zu bearbeiten.
tab.needs.editor = Bedürfnisse
group.needs = Bedürfnisse der Bürger
group.needs.plugin = Plugin-Einstellungen
group.needs.plugin.description = Schalter, die für alle Bedürfnisse gelten.
needs.list = Bedürfnisliste
needs.add = Bedürfnis hinzufügen
needs.select_help = Wähle links ein Bedürfnis aus oder füge mit + eine durch Resources registrierte Ressource hinzu.
needs.resource = Ressource
needs.resource.help = Die Ressource, die die Bürger wollen sollen. Sie muss in der Liste des Resources-Plugins registriert sein.
needs.donor = Spender-Bedürfnis
needs.donor.description = Vorhandenes Bedürfnis, das als Vorlage dient.\nfood oder meat = für Lebensmittelläden\nclothes oder eletronics = für Kaufhäuser\nalcohol = für Alkohol-Verkaufsstellen\neletronics ist die Schreibweise des Spiels.
needs.factor = Mengenfaktor
needs.factor.description = Menge der Ware im Verhältnis zum Spender-Bedürfnis.\n1.0 = gleiche Menge wie beim Spender\nHöherer Wert = Bürger benötigen mehr\nNiedrigerer Wert = Bürger benötigen weniger
needs.category = Ladenkategorie
needs.category.description = Welche Läden die Ware führen.\nauto = dieselben Läden wie beim Spender-Bedürfnis\nnone = kein automatisches Regal; ein Gebäude muss die Ware selbst vorsehen\nbasic = nur einfache Läden\nmedium = nur mittlere Läden\nadvanced = nur große Läden\nmediumadvanced = nur mittlere und große Läden\nhotel = nur Hotels\nEine Zahl = diesen Ladenwert direkt ins Spiel eintragen; nur für Kenner der Spieldateien
needs.chance = Wahrscheinlichkeit
needs.chance.description = Wahrscheinlichkeit von 0 bis 1, mit der ein Bürger dieses Bedürfnis erhält. Bei einem Wert unter 1 wird es unabhängig vom Spender verteilt.\n0 = kein Bürger erhält es\n1 = jeder passende Bürger erhält es
needs.unhappy = Unzufriedenheit
needs.unhappy.description = Wie viel Zufriedenheit ein Bürger verliert, wenn er die Ware nicht bekommt.\n0 = kein Verlust; das Bedürfnis wird nur angezeigt\n0.005 bis 0.02 = typischer Bereich für ein Komfortgut\nErlaubter Bereich: 0 bis 1
needs.enabled = Plugin aktiv
needs.enabled.description = EIN aktiviert das Plugin.\nAUS schaltet es beim nächsten Spielstart vollständig ab.
needs.demand = Bedürfnisse vergeben
needs.demand.description = EIN gibt Bürgern das neue Bedürfnis.\nAUS verteilt das Bedürfnis nicht, kann die Ware aber weiterhin in Läden einrichten.
needs.storage = Läden bestücken
needs.storage.description = EIN richtet die Ware in den ausgewählten Läden ein.\nAUS fügt keine Lagerplätze hinzu; Bürger können die Ware dann nur in Gebäuden finden, die sie selbst vorsehen.
needs.max_demands = Bedürfnisse je Bürger
needs.max_demands.description = Höchste Anzahl zusätzlicher Bedürfnisse, die ein Bürger gleichzeitig haben kann.\n1 = höchstens ein zusätzliches Bedürfnis\n7 = höchste erlaubte Anzahl
needs.when_full = Wenn der Bürger voll ist
needs.when_full.description = Verhalten, wenn ein Bürger bereits die höchste Anzahl zusätzlicher Bedürfnisse hat.\nskip = warten, bis wieder ein Platz frei ist\nreplace = für diesen Vorgang das Spender-Bedürfnis ersetzen
needs.probe = Ausführliches Protokoll
needs.probe.description = EIN schreibt die Bedürfnislisten der Bürger und Angaben zu jedem Laden in das ausführliche Plugin-Protokoll.\nAUS schreibt nur Warnungen. Für die erste Prüfung neuer Läden vorübergehend einschalten.
needs.log_seconds = Abstand der Fortschrittszeilen (Sekunden)
needs.log_seconds.description = Sekunden zwischen zwei Meldungen zur Anzahl bereits verteilter Bedürfnisse.\n0 = diese Meldungen ausschalten\nHöherer Wert = seltener protokollieren
tab.needs.general = Allgemein
plugin.deposits = Deposits
plugin.deposits.description = Vorkommen verwalten, die das Grundspiel nicht kennt, sowie die Plugin-Schalter, ohne die Originaldatei zu bearbeiten.
tab.deposits.general = Allgemein
tab.deposits.editor = Vorkommen
group.deposits = Vorkommen
group.deposits.description = Original-Vorkommen sind geschützt und können ausgeblendet werden. Persönliche Vorkommen werden getrennt gespeichert und in die wirksame deposits.ini übernommen. Jeder Abschnitt außer [deposits] ist ein Vorkommen.
group.deposits.plugin = Plugin-Einstellungen
group.deposits.plugin.description = Die drei Teilsysteme im Abschnitt [deposits]. Ist ein Schalter hier aus, gilt das für alle Vorkommen.
deposits.notice = Typnummer, Kartenplatz und das Token in der building.ini eines Vorkommens sind Teil des Spielstands, sobald eine Mine sie verwendet. Ein Vorkommen zu entfernen oder umzunummerieren, das ein Spielstand nutzt, kann diesen Spielstand unbrauchbar machen – erst auf einer Kopie testen.
deposits.list = Vorkommenliste
deposits.add = Vorkommen hinzufügen
deposits.select_help = Wähle links ein Vorkommen oder leg mit + ein neues für eine Ressource aus Resources an.
deposits.name = Vorkommen
deposits.name.help = Der Abschnittsname in der deposits.ini. Er benennt das Vorkommen im Protokoll und im Editor-Pinsel und kann nicht nachträglich geändert werden.
deposits.new_name = Name des Vorkommens
deposits.new_hint = Hier gibst du nur die Grunddaten an. Komponente, Gebäudetyp und Erschöpfung stellst du nach dem Hinzufügen rechts ein.
deposits.code_patch = Anpassung der Spieldatei
deposits.code_patch.description = EIN trägt die eingestellten $TYPE_MINE_-Vorkommenstypen in das Spiel ein, damit Minen sie über building.ini finden. Passen die erwarteten Spieldaten nach einem Update nicht, nimmt das Plugin keine Änderung vor.
deposits.minimap_all = Minimap-Ebenen
deposits.minimap_all.description = EIN zeigt für jedes einzeln aktivierte Plugin-Vorkommen einen Knopf unter den fünf Minimap-Knöpfen des Spiels.\nAUS blendet alle Knöpfe der Plugin-Vorkommen aus.
deposits.editor_all = Pinsel im Terrain-Editor
deposits.editor_all.description = EIN zeigt im Reiter Resources des Geländeeditors für jedes Vorkommen mit Pinselname einen Mal- und Löschpinsel.\nAUS blendet alle Pinsel der Plugin-Vorkommen aus.
deposits.token = Gebäude-Token
deposits.token.description = Token, das eine Mine in building.ini für dieses Vorkommen verwendet, zum Beispiel $TYPE_MINE_COPPER. Trage es wie $TYPE_MINE_GRAVEL ein. Verwende nie zwei Vorkommen-Token in derselben building.ini.
deposits.type = Typnummer
deposits.type.description = Eindeutige Typnummer des Vorkommens. Zwei Vorkommen dürfen nicht dieselbe Nummer verwenden.\n10 bis 127 = erlaubter Bereich\n0 bis 9 = für das Grundspiel reserviert\nDer Dialog schlägt automatisch die nächste freie Nummer vor.
deposits.map = Karte
deposits.map.description = Karte, auf der das Vorkommen gespeichert wird.\nauto = automatisch einen freien Platz auf einer Plugin-Karte wählen; empfohlen\nresourcemap oder resourcemap2 = Karten des Grundspiels verwenden\nresourcemap3 bis resourcemap10 = zusätzliche Plugin-Karten verwenden\nterrain = direkt bemalten Boden verwenden, zum Beispiel für Kies; der Pinsel erscheint unter ROCKS
deposits.component = Platz auf der Karte
deposits.component.description = Jede Karte hat vier Plätze von 0 bis 3. Jeder Platz kann ein Vorkommen enthalten.\nBei auto = Feld leer lassen; das Plugin sucht einen freien Platz\nBei terrain: 2 = Kiesschicht\nBei terrain: 3 = Oasenschicht
deposits.building_type = Gebäudetyp
deposits.building_type.description = Gebäudetyp, der dieses Vorkommen abbauen kann.\n7 = Mine; für fast alle Vorkommen richtig\n92 = Wasserbrunnen\nLeeres Feld = 7
deposits.radius = Suchradius
deposits.radius.description = Wie weit die Mine nach ihrem Vorkommen sucht.\noil, ore, bauxite, gravel, wood, water, watersurface = Suchweite des entsprechenden Spielwerts verwenden\nEine Zahl = diese Suchweite direkt verwenden\nLeeres Feld = ore verwenden\nOhne Suchweite findet die Mine kein Vorkommen.
deposits.icon = Minimap-Symbol
deposits.icon.description = Name der Ressource, deren Symbol auf dem Minimap-Knopf erscheint. Das Plugin verwendet das bereits vom Spiel geladene Symbol. Du brauchst keine eigene Bilddatei.\nRessourcen aus dem Resources-Plugin müssen dort registriert sein.\nLeeres Feld = kein Symbol
deposits.minimap = Minimap-Knopf
deposits.minimap.description = EIN fügt für dieses Vorkommen einen Minimap-Knopf hinzu.
deposits.editor = Pinselname im Editor
deposits.editor.description = Name des Mal- und Löschpinsels im Geländeeditor. Derselbe Name wird für tool_paint_<name>.png und tool_erase_<name>.png unter vfs\media_soviet\editor verwendet.\nLeeres Feld = keinen Pinsel erstellen\nErlaubt: höchstens 31 Zeichen, Buchstaben, Ziffern, _ und -
deposits.deplete = Tonnen je Kartenpunkt
deposits.deplete.description = Diese Einstellung wird vom Plugin depletion gelesen. Sie legt fest, wie viele Tonnen eine Mine aus einem vollen Punkt der Ressourcenkarte holen kann. Ein schwächerer Punkt liefert entsprechend weniger.\nDer Wert überschreibt tonnes_per_texel in plugins\depletion.ini.\n0 = dieses Vorkommen bleibt unendlich\nLeeres Feld = globalen Wert verwenden
deposits.save_warning = Änderungen werden erst beim Speichern in die wirksame deposits.ini übernommen. Typnummern, Kartenplätze und Token von Vorkommen, die ein Spielstand bereits nutzt, dürfen sich nicht ändern – das kann diesen Spielstand unbrauchbar machen.
depletion.tab.general = Allgemein
depletion.tab.mining = Abbau
needs.save_warning = Änderungen landen erst beim Speichern in der wirksamen needs.ini. Jedes Bedürfnis gibt den betroffenen Läden ein Lagerfach, das zum Spielstand gehört – teste das erst auf einer Kopie.
bp.name = Buildings Plus
bp.description = Erstellt neue Gebäude aus einem Spendergebäude und deinen geänderten building.ini-Zeilen. Das Plugin schreibt daraus beim Spielstart vollständige, lokale Workshop-Objekte.
bp.notice = Jedes Gebäude erhält einen eigenen Ordner unter media_soviet\workshop_wip.\nLeere Workshop-ID = ab 9300000000 automatisch die nächste freie Nummer vergeben und in plugins\buildings_plus.ids.ini speichern\nÄnderungen werden erst nach einem vollständigen Spielneustart wirksam. Ein Spielstand mit einem erzeugten Gebäude benötigt dessen Ordner weiterhin.
bp.tab.general = Allgemein
bp.tab.buildings = Gebäude
bp.tab.sml = SML-Gebäude
bp.wip = Von Soviet Mod Loader erzeugte Gebäude
bp.wip.description = Zeigt Gebäude aus Inhaltspaketen, die Soviet Mod Loader unter media_soviet\workshop_wip erzeugt hat. Sie gehören nicht zu Buildings Plus; die Angaben werden nur aus ihren Ordnern gelesen.
bp.wip.empty = Soviet Mod Loader hat hier kein Gebäude erzeugt. Ohne Inhaltspaket, das eines mitbringt, ist das normal.
bp.group = Gebäude
bp.group.notice = Ein Gebäude hier ist eine Kopie eines Spielgebäudes mit anderen Zeilen: gleiches Modell, gleiche Anschlüsse, dein Rezept. Wähle einen Spender derselben Art (Mine für Mine, Fabrik für Fabrik).
bp.list = Gebäude
bp.add = Hinzufügen
bp.select_help = Wähle links ein Gebäude oder füge mit + ein neues hinzu. Wähle zuerst das Spendergebäude. Die Workshop-ID darf leer bleiben.
bp.id = Objektname
bp.id.help = Name des erzeugten Ordners und Gebäudeobjekts. Er erscheint auch im Protokoll.\nErlaubt: Buchstaben, Ziffern, _ und -\nHöchstens 64 Zeichen\nNachträglich nicht änderbar
bp.save_warning = Änderungen werden erst beim Speichern in buildings_plus.ini übernommen und nach einem vollständigen Spielneustart wirksam. Fehlerhafte Gebäudeabschnitte werden übersprungen und im Protokoll genannt.
bp.list.note = Höchstens 256 Gebäude.
bp.new_name = Objektname
bp.new_hint = Leerzeichen werden zu Unterstrichen, Großbuchstaben zu Kleinbuchstaben.
bp.card.folders = Erzeugte Ordner
bp.card.log = Fehlersuche
bp.card.new = Neues Gebäude
bp.links = Anleitungen
bp.link.readme = README (Anleitung)
bp.prune = Ordner aufräumen
bp.prune.description = EIN entfernt beim nächsten Spielstart erzeugte Ordner gelöschter oder ausgeschalteter Gebäude. Das Plugin entfernt nur Ordner mit seinem eigenen Sicherheitsstempel.\nAUS lässt diese Ordner bestehen; das Spiel lädt ihre Gebäude weiter.
bp.always = Immer neu schreiben
bp.always.description = EIN schreibt jeden Gebäudeordner bei jedem Spielstart neu.\nAUS schreibt nur bei Änderungen am Abschnitt, Plugin oder Spender. Empfohlen.
bp.verbose = Ausführliches Protokoll
bp.verbose.description = EIN schreibt jede kopierte Datei und entfernte Spenderzeile in logs\tesmioloader.buildings_plus.log.\nAUS schreibt nur Ergebnisse, Warnungen und Fehler.
bp.repair_owner_ids = Besitzer-ID nachtragen
bp.repair_owner_ids.description = EIN trägt deine Steam-ID in erzeugte Gebäude ohne Besitzer-ID ein. Das gilt auch für Gebäude von Soviet Mod Loader und verhindert Meldungen über fehlende Workshop-Objekte.\nAUS verändert Ordner anderer Generatoren nicht.
bp.enabled = Gebäude aktiv
bp.enabled.description = EIN erzeugt dieses Gebäude beim nächsten Spielstart.\nAUS erzeugt es nicht. Mit eingeschaltetem „Ordner aufräumen“ wird sein vorhandener Ordner beim nächsten Start entfernt.
bp.item_id = Workshop-ID
bp.item_id.description = Workshop-ID und Ordnername unter media_soviet\workshop_wip.\nLeeres Feld = automatisch eine freie ID vergeben\nErlaubt: 9000000000 bis 9999999999\nNicht verwenden: 9100000000 bis 9199999999; dieser Bereich gehört Soviet Mod Loader\nNachträglich möglichst nicht ändern, da Spielstände auf diese ID verweisen.
bp.donor = Spendergebäude
bp.donor.description = Gebäude, das als Vorlage dient. Ein Workshop-Gebäude muss abonniert sein. Mit „Spender wählen…“ kannst du deine Gebäude durchsuchen.\nWähle immer dieselbe Gebäudeart: Mine für Mine, Fabrik für Fabrik, Laden für Laden.
bp.item_name = Name im Spiel
bp.item_name.description = Name des Gebäudes im Spiel.\nNormaler Text = direkt als Name anzeigen\nText mit Punkten = als Übersetzungsschlüssel des Plugins Localization verwenden, zum Beispiel localization.lang.salt_mine
bp.desc = Beschreibung
bp.desc.description = Beschreibung des Workshop-Eintrags. Jede Eingabezeile wird zu einer eigenen Zeile. Verwende keine Anführungszeichen.
bp.line = Zeilen der building.ini
bp.line.description = Trage pro Feld eine Zeile für die building.ini ein, zum Beispiel $PRODUCTION raw_salt 1.0. Mit „Zeile wählen…“ übernimmst du eine Zeile des Spendergebäudes und passt sie an.\nDeine Zeilen ersetzen beim Spender: dasselbe Token, jedes $TYPE_*, jedes $STORAGE* zusammen mit $RESOURCE_VISUALIZATION sowie $PRODUCTION, $CONSUMPTION und $CONSUMPTION_PER_SECOND als gemeinsames Rezept. Alle anderen Zeilen des Spenders bleiben erhalten.\nVerwende für eigene Ressourcen immer $STORAGE_IMPORT_SPECIAL oder $STORAGE_EXPORT_SPECIAL mit dem Ressourcennamen. Sonst zeigt das Lager alle Ressourcen derselben Transportklasse an.
bp.strip = Spenderzeilen entfernen
bp.strip.description = Ein zu entfernendes $TOKEN je Zeile, zum Beispiel $WORKERS_NEEDED. Jede Spenderzeile mit diesem Token wird entfernt und nicht ersetzt.
bp.life = Lebensdauer
bp.life.description = Wie viel das Gebäude aushält, bevor es einstürzt. Der Wert wird als LIFE in renderconfig.ini eingetragen.\nLeeres Feld = 3000; entspricht den meisten Spielgebäuden
bp.card.lines = Zeilen
bp.item_id.empty = das Plugin vergibt beim Spielstart die nächste freie Nummer ab 9300000000.
bp.item_name.empty = der Objektname - nicht empfohlen.
needs_plus.card.log = Fehlersuche
resources_plus.card.log = Fehlersuche
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Geklonte Datensätze protokollieren
resources_plus.custom_report.description = EIN schreibt auch für Ressourcen mit Vorlage die tatsächlich geerbten Werte in das Protokoll. Ressourcen ohne Vorlage werden immer protokolliert.
resources_plus.customs_hook = Zollhäuser auffrischen
resources_plus.customs_hook.description = EIN ergänzt neue Ressourcen in bereits bestehenden Zollhäusern.\nAUS kennen Zollhäuser nur die Ressourcen, die beim Bau vorhanden waren. Betroffene Zollhäuser müssen dann abgerissen und neu gebaut werden.
resources_plus.customs_probe = Zollhaus-Zeilen protokollieren
resources_plus.customs_probe.description = EIN schreibt für jede Ressource, die einem Zollhaus hinzugefügt wird, eine Zeile in tesmioloader.log. Nur für die Fehlersuche; danach wieder ausschalten.
resources_plus.price_hook = Preise aus der INI anwenden
resources_plus.price_hook.description = EIN wendet [base_price] vor und [price] nach der Preisberechnung des Spiels an.\nAUS lässt beide Abschnitte wirkungslos und überlässt die Preise dem Spiel.
resources_plus.price_report = Preistabelle protokollieren
resources_plus.price_report.description = EIN schreibt nach jeder Preisberechnung Preis, Grundpreis und Preisart aller Ressourcen in das ausführliche Protokoll. 0.00 bedeutet, dass kein Gebäude diese Ressource herstellt.
tab.resources_plus.general = Allgemein
resources.heading.basics = Transport und Preisart
resources.heading.cargo = Fracht und Material
resources.heading.fixed = Feste Preise
resources.heading.market = Marktwerte
resources.heading.prices = Preise im Datensatz
