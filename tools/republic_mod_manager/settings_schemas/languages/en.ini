[language]
name = English

[strings]
plugin.resources = Resources
plugin.resources.description = Manage resources, properties and optional price overrides.
plugin.resources_plus = Resources Plus
plugin.resources_plus.description = Own resources with Resources Plus: the same list as the original, in plugins\resources_plus.ini, without the crash on exit.
resources_plus.save_warning = Changes land in plugins\resources_plus.ini when you save. Removing a resource a save already uses can break that save.
plugin.needs_plus = Needs Plus
plugin.needs_plus.description = Own citizen needs with Needs Plus: the same list as the original, in the file needs_plus.ini in the plugins folder, taken over from needs.ini at the first start.
needs_plus.save_warning = Changes land in needs_plus.ini in the plugins folder only when you save. Every need adds a storage slot to the affected shops, and that slot is part of the saved game - test on a copy first.
tab.resources.editor = Resources
group.resource_definitions = Resource definitions
detail.transport = Transport class
detail.transport.description = Which vehicles and storages carry the resource. Choosing a name is enough; the plugin adds the base game's figures for that class.
detail.kind = Price kind
detail.kind.description = 0 raw, 1 manufactured, 2 food/clothing, 3 advanced material, 4 electronics.
detail.record_price = Initial record price
detail.record_price.description = Optional RUB and USD starting values inside the resource record.
detail.record_base_price = Initial record base price
detail.record_base_price.description = Optional RUB and USD base values inside the resource record.
detail.trade_mult = Trade multipliers
detail.trade_mult.description = Sell and buy multipliers, normally 0.95, 1.05.
detail.market_rub = RUB market block
detail.market_usd = USD market block
detail.market.description = Two market figures and an optional coefficient.\n(See the description in the INI)
detail.packed = Packed cargo
detail.packed.description = Automatic, unpacked or packed cargo representation.
detail.family = Material family
detail.family.description = How the material looks when piled on a construction site and, most likely, which waste it becomes. Each family holds one waste resource. Numbers 10 to 19 in the INI are shown by name.
detail.cargo = Cargo geometry
detail.cargo.description = Geometry selection used for cargo visualization.
detail.pinned_base_price = Pinned base price
detail.pinned_base_price.description = Optional RUB and USD value in [base_price]. Empty means no personal entry.
detail.forced_price = Forced finished price
detail.forced_price.description = Optional RUB and USD value in [price]. Empty means the game calculates the price.

; --- Lokale Schemas fuer installierte Upstream-Plugins (seit 0.13.0) ---
daynight.description = One sunrise and one sunset per calendar day. In the base game a change from day to night and back takes 13 calendar days, almost two weeks. With this plugin it fits into one day.
daynight.group.cycle = Day and night
daynight.group.cycle.description = How long a day-night change takes and when night comes.
daynight.group.pace = Pace
daynight.group.pace.description = Two separate controls: one for vehicles, one for everything else. They always apply, whatever is set above.
daynight.group.diagnostics = Troubleshooting
daynight.enabled.label = Plugin enabled
daynight.enabled.description = ON enables the configured day-and-night cycle.
daynight.cycle_days.label = Calendar days per day-night change
daynight.cycle_days.description = Calendar days from one sunrise to the next.\n1 = one sunrise and one sunset every day\n2 to 12 = a correspondingly longer cycle\n13 = the base-game cycle
daynight.day_scale.label = Day length (how much slower the calendar runs)
daynight.day_scale.description = How much longer a calendar day takes than in the base game.\nauto = slow the calendar automatically to match the light cycle; recommended\n1 = do not slow the calendar; day and night then change 13 times faster\n2 to 100 = slow the calendar by this factor\nChoose which parts of the game slow down under “What slows down”.
daynight.slow.label = What slows down
daynight.slow.description = Which parts of the game slow down.\ncalendar = slow only the calendar; recommended\nworld = slow everything, including citizens and vehicles; high values look like slow motion\nnone = do not slow anything\nWith calendar, citizens, vehicles, construction and production keep their normal speed. Daily processes such as pollution, loans and messages keep their usual interval.
daynight.offset.label = When night comes
daynight.offset.description = Moves the night within the calendar day.\n0 = darkness begins shortly after the middle of the day\n0.5 = darkness begins when the date changes\nWith any value other than 0, a 13-day cycle no longer exactly matches the base game.
daynight.fade.label = Scale the lighting fade
daynight.fade.description = ON shortens the transitions between morning, day, evening and night to match the configured cycle.\nOFF uses the slow base-game transitions. With short cycles, they may overlap and make the lighting look washed out.
daynight.vehicle_scale.label = Vehicle speed
daynight.vehicle_scale.description = Speed of trucks, trains, ships and aircraft. Works independently of the other settings.\n1 = base-game speed\n2 = half speed\n0.5 = double speed\nHigher value = slower vehicles
daynight.sim_scale.label = Speed of everything else
daynight.sim_scale.description = Speed of citizens, construction, production, wear and animations.\n1 = base-game speed\n2 = half speed\n0.5 = double speed\nHigher value = slower simulation
daynight.probe.label = Write day lengths to the log
daynight.probe.description = ON writes the real duration of every calendar day and light transition to tesmioloader.log. Use only for troubleshooting and checks after a game update.
walking.description = How far citizens walk and how far car owners drive between home, work and parking.
walking.group.distances = Distances
walking.group.distances.description = Measured along roads and footpaths, not as the crow flies. A building 400 m away across the river can mean a 1200 m walk.
walking.group.diagnostics = Troubleshooting
walking.enabled.label = Plugin enabled
walking.enabled.description = ON enables the configured walking and driving distances.
walking.distance.label = Walking distance (m)
walking.distance.description = The longest route a citizen will walk. The base game uses 480 m.\nHigher value = more buildings are within walking distance and construction creates more connections\n0 = no limit; construction may then take several seconds in a large city\n20000 = highest accepted value
walking.car_distance.label = Driving distance for car owners (m)
walking.car_distance.description = The longest permitted drive between home, work and parking. The base game uses 2500 m.\nHigher value = car owners drive farther\nSet this above the walking distance. At equal values, a car provides no distance advantage.
walking.regen_on_load.label = Rebuild connections when a save is loaded
walking.regen_on_load.description = Walking and parking connections are stored in the saved game.\nON rebuilds every connection when the save is loaded, so the configured distances also affect existing cities.\nOFF applies the configured distances only to newly constructed buildings.
walking.probe.label = Write check values to the log
walking.probe.description = ON writes the values found in the game before the plugin changes them to tesmioloader.log. Use only for troubleshooting and checks after a game update.
accumulator.description = Batteries for your power grid. A building with a large power store charges while power is left over and gives it back when power is short.
accumulator.group.battery = Battery
accumulator.group.battery.description = Which buildings count as a battery and how fast they fill and empty.
accumulator.group.window = Building window
accumulator.group.grid = Power grid
accumulator.group.diagnostics = Troubleshooting
accumulator.enabled.label = Plugin enabled
accumulator.enabled.description = ON enables charging and discharging for battery buildings.\nOFF stops discharging. The buildings remain and can still fill up.
accumulator.building_types.label = Building types
accumulator.building_types.description = Building types that may work as batteries. Separate several numbers with commas.\n19 = transformer\n18 = substation\nDo not use 17: a power plant cannot take in power and would never charge.
accumulator.min_capacity.label = Minimum storage to count as a battery
accumulator.min_capacity.description = Minimum storage capacity for a building to count as a battery. This excludes the small stores of normal substations.\nHigher value = fewer buildings count as batteries\nLower value = more buildings count as batteries\nThe included “Stationary Accumulator” has 5000.
accumulator.charge_rate.label = Charging speed (power per second)
accumulator.charge_rate.description = Maximum power a battery takes in per second. The limit prevents an empty battery from taking the power away from an entire city.\nHigher value = faster charging and a heavier load on the grid\nLower value = slower charging and a lighter load\nFor comparison, a coal power plant supplies 70 and a wind turbine 15.
accumulator.discharge_rate.label = Discharging speed (power per second)
accumulator.discharge_rate.description = Maximum power a battery supplies per second. It supplies power only when the grid is short.\nHigher value = cover larger power shortages\nLower value = stored energy lasts longer\nExample: at 60, a full battery with 5000 capacity replaces a power plant for a little over 80 seconds.
accumulator.panel.label = Charge row in the battery window
accumulator.panel.description = ON adds the charge level to the battery window, for example “Charge: 4210.5 / 5000 (84.2 %)”.
accumulator.panel_caption.label = Caption of that row
accumulator.panel_caption.description = The word in front of the charge level. Letters only, no accents and no special characters, or the game shows garbage.
accumulator.gauges.label = Compute the window's gauges from the battery
accumulator.gauges.description = ON replaces the incorrect game display with the actual flow into and out of the battery.\nOFF uses the normal game display. It may show 0 power and “without power supply” while the battery is charging.
accumulator.spread_voltage.label = Experiment: pass voltage on to neighbours (leave off)
accumulator.spread_voltage.description = ON has no effect. This old function has been replaced technically. Leave it OFF.
accumulator.trace.label = Log the neighbours of the first battery
accumulator.trace.description = ON writes how much power the buildings next to the first battery receive to the log. Troubleshooting only; may cost performance.
accumulator.log_seconds.label = Seconds between battery log lines
accumulator.log_seconds.description = Interval between battery status messages in tesmioloader.log. Each message includes charge, inflow and outflow.\n0 = no status messages\nHigher value = log less often
accumulator.probe.label = Seconds between building lists in the log
accumulator.probe.description = Interval between lists of all buildings with power storage in tesmioloader.log. Use only when a battery is not recognised or after a game update.\n0 = do not write these lists\nHigher value = log less often
cities.description = Size and shape of every city. In the base game every city is a circle with a 1000 m radius. With this plugin you set the radius for each city on its own, optionally as a square, right in the city window. The values are stored in the saved game.
cities.group.cities = Cities
cities.group.slider = Radius slider
cities.group.slider.description = How far the slider in the city window reaches and how much one click on + or - changes.
cities.group.layout = Layout in the city window
cities.group.layout.description = Where the two new rows sit in the city window. The numbers are positions in the game window's own unit; the window is about 500 wide.
cities.group.overlay = Dot grid on the ground
cities.group.diagnostics = Troubleshooting
cities.enabled.label = Plugin enabled
cities.enabled.description = ON enables custom city sizes and shapes.
cities.window.label = Radius slider and shape checkbox in the city window
cities.window.description = ON shows the radius slider and the square-shape box in the city window.\nOFF hides both; the set values stay, but you can no longer change them.
cities.adopt.label = Give orphaned buildings a city of their own
cities.adopt.description = When you shrink a city, buildings can end up outside and belong to no city any more.\nON founds a new city for them with a random name and today's date, the way the game does it itself.\nOFF leaves them without a city; how the game behaves then is untested.
cities.radius.label = Default radius (m)
cities.radius.description = Default radius for cities you have not configured individually. The value applies on every map.\n1000 = base-game radius\nHigher value = larger cities\nLower value = smaller cities
cities.square.label = Default shape square
cities.square.description = ON makes cities that have not been configured individually square.\nOFF uses a circle as in the base game.
cities.radius_min.label = Smallest radius on the slider (m)
cities.radius_min.description = The value at the far left of the slider.
cities.radius_max.label = Largest radius on the slider (m)
cities.radius_max.description = The value at the far right of the slider. The slider has 100 steps; with 200 to 5000 one step is 48 m.
cities.step.label = Percent per button click
cities.step.description = Percentage of the slider range changed by one click on + or -. This does not apply while dragging the slider.\nHigher value = larger change per click\nLower value = finer change per click
cities.label_x.label = Label position
cities.label_x.description = Distance of the label from the left edge of the window.
cities.widget_x.label = Widget position
cities.widget_x.description = Distance of the slider and the box from the left edge of the window. The slider needs about 225.
cities.checkbox_dy.label = Move the box row up or down
cities.checkbox_dy.description = Moves the checkbox up or down so it does not overlap the slider.\nHigher value = checkbox farther down\nLower value = checkbox farther up
cities.overlay.label = Overlay follows radius and shape
cities.overlay.description = While a city window is open the game shows a blue dot grid on the ground, but only ever for a 1000 m circle.\nON fits the grid to your radius and shape.\nOFF leaves it as in the base game.
cities.overlay_step.label = Overlay grid spacing (m)
cities.overlay_step.description = Distance between the dots of the city boundary display.\n0 = automatically use one twentieth of the radius, at least 50 m\nLower value = denser display and higher performance cost
cities.probe.label = Write cities to the log
cities.probe.description = ON writes the radius, shape and building count of every city to tesmioloader.log after loading. More messages are written while a city window is open. Troubleshooting only; the log can grow quickly.
depletion.description = Deposits run out. A working mine visibly mines the deposit off the map, and the less is left, the less it produces. The mining is stored in the saved game; if you switch the plugin off later, what was mined does not come back. Test it on a copy of your saved game first.
depletion.group.depletion = Mining
depletion.group.window = Mine window
depletion.group.diagnostics = Troubleshooting
depletion.enabled.label = Plugin enabled
depletion.enabled.description = ON lets the selected deposits run out as they are mined.\nOFF stops further depletion. Resources already removed are not restored.
depletion.tonnes_per_texel.label = Tonnes per map point
depletion.tonnes_per_texel.description = Tonnes a mine can extract from a completely full point of the resource map. Weaker points yield proportionally less.\nHigher value = deposits last longer\nLower value = deposits run out sooner\nFor comparison, a mine with a 210 m search radius covers several thousand map points.
depletion.vanilla.label = Base-game deposits that run out
depletion.vanilla.description = Base-game deposits that may run out. Separate several values with commas.\noil, iron, coal, uranium, bauxite, gravel = only the named deposits\nall = every deposit\nnone = no base-game deposit\nname:value = custom tonnes per map point, for example iron:3000\nDeposits from deposits.ini are always included.\ngravel permanently wears away the visible ground texture and needs a much higher value because of its small search area. Omit gravel to keep it as in the base game.
depletion.flush_seconds.label = Seconds until the mining is saved
depletion.flush_seconds.description = Seconds between updates of the resource map. Output and quality change immediately; only the minimap and saved game follow at this interval.\nLower value = more frequent updates and higher performance cost\nDo not update more than four times per second.
depletion.panel.label = Remaining-deposit row in the mine window
depletion.panel.description = ON shows the remaining stock in the mine window and makes the window slightly taller, for example “Deposit remaining: 251.4 kt / 259.3 kt (96.9 %)”.
depletion.panel_caption.label = Caption of that row
depletion.panel_caption.description = The word in front of the remainder. Letters only, no accents and no special characters, or the game shows garbage.
depletion.log_seconds.label = Interval of the progress lines (seconds)
depletion.log_seconds.description = Seconds between mine status messages in tesmioloader.log. Each message includes the remaining amount, total amount and quality.\n0 = no status messages\nHigher value = log less often\nWatch several game days to find a suitable tonnes-per-map-point value.
easystart.description = The citizens' needs arrive bit by bit over the years. A need that is not yet unlocked does not count for happiness and health; the citizens still go there and shop, only the consequences stay away until its year.
easystart.group.general = What is gated
easystart.group.unlock = Unlock years
easystart.group.unlock.description = Year in which the requirement starts applying on 1 January. The schedule is designed for a republic founded in 1920. With a start in 1960, the preset years are already in the past.\noff = do not delay it; base-game behaviour\nalways = apply it from the first game day\nA year = unlock it in that year
easystart.group.diagnostics = Troubleshooting
easystart.enabled.label = Plugin enabled
easystart.enabled.description = ON unlocks needs and utility requirements according to the configured schedule.
easystart.demands.label = Gate the nine citizen demands
easystart.demands.description = ON holds back food, meat, clothes, electronics, alcohol, religion, culture, sport and health until their configured unlock years.
easystart.utilities.label = Gate the three building utilities
easystart.utilities.description = ON holds back electricity, water and heating requirements until their configured unlock years.
easystart.warnings.label = Gate the building-window warnings
easystart.warnings.description = ON hides related warnings until the unlock year, for example “building without power supply”.
easystart.pin_status.label = Hold the happiness of locked needs
easystart.pin_status.description = ON keeps the satisfaction of a locked need at the value below.\nOFF lets satisfaction continue to fall; it may already be very low when the need unlocks.
easystart.locked_status.label = Happiness while locked
easystart.locked_status.description = Satisfaction while a need is locked. For food, the value is satiety.\n1.0 = fully satisfied or fed\n0.5 = medium value with a noticeable improvement after unlocking
easystart.clear_unsatisfied.label = Drop locked needs from the unsatisfied list
easystart.clear_unsatisfied.description = ON prevents locked needs from producing the “N citizens could not get X” message.
easystart.probe.label = Write unlocks to the log
easystart.probe.description = ON writes the needs that remain locked at every change of year to tesmioloader.log. It also records the first affected citizen once. Troubleshooting only.
easystart.food.label = Food
easystart.religion.label = Religion
easystart.meat.label = Meat
easystart.clothes.label = Clothes
easystart.alcohol.label = Alcohol
easystart.sport.label = Sport
easystart.culture.label = Culture
easystart.health.label = Health
easystart.electricity.label = Electricity
easystart.water.label = Water (covers sewage)
easystart.heating.label = Heating
easystart.electronics.label = Electronics
easystart.school.label = School
easystart.school.description = Before this year children learn without a school, as in the game's "Simple" education setting, and the message "N children cannot go to school" stays away.
easystart.kindergarten.label = Kindergarten
easystart.kindergarten.description = Before this year no parent has to stay home for a child under six, and the message "N workers cannot work because all kindergartens …" stays away.

; workshop_bridge (seit 0.14.0)
workshop_bridge.description = Loads the hook DLLs of your subscribed Workshop packages straight into TesmioLoader, no Soviet Mod Loader and no copying needed. Stays idle while Soviet Mod Loader is on and never loads a package that also sits in plugins\.
workshop_bridge.group.bridge = Bridge
workshop_bridge.group.log = Troubleshooting
workshop_bridge.prune.label = Tidy the bridge list
workshop_bridge.prune.description = Removes old entries from the package list whose package is no longer in your plugin list. Entries of existing packages stay, switched-off ones too.
workshop_bridge.prune.button = Tidy up now
workshop_bridge.notice = Which packages load is not set here: switch "Plugin active" on or off at each Workshop package. The bridge keeps that list in user_config\workshop_bridge.ini.
workshop_bridge.enabled.label = Bridge active
workshop_bridge.enabled.description = ON loads approved Workshop plugins directly into TesmioLoader.\nOFF loads no package through the bridge. Soviet Mod Loader or local copies under plugins\ may still load them.
workshop_bridge.policy.label = Packages not on the list
workshop_bridge.policy.description = Rule for packages without their own entry in the package list.\nlist = load only explicitly enabled packages\nall = load every package with hooks except explicitly disabled ones
workshop_bridge.workshop_root.label = Workshop folder
workshop_bridge.workshop_root.description = Folder containing one subfolder per Workshop package.\nauto = find steamapps\workshop\content\784150 in the Steam library of the game automatically\nAnother value = use this absolute folder path
workshop_bridge.log_verbose.label = Log every skipped package
workshop_bridge.log_verbose.description = ON writes one line to tesmioloader.log for every package that was checked but not loaded. Use only when troubleshooting a missing package.
plugin.needs = Needs
plugin.needs.description = Manage the extra citizen needs and the plugin switches without editing the upstream file.
tab.needs.editor = Needs
group.needs = Citizen needs
group.needs.plugin = Plugin settings
group.needs.plugin.description = Switches that apply to all needs.
needs.list = Needs list
needs.add = Add need
needs.select_help = Select a need on the left or use + to add a resource registered by Resources.
needs.resource = Resource
needs.resource.help = The resource the citizens are to want. It has to be registered in the list of the Resources plugin.
needs.donor = Donor demand
needs.donor.description = Existing need used as the template.\nfood or meat = for food shops\nclothes or eletronics = for department stores\nalcohol = for alcohol shops\neletronics is the spelling used by the game.
needs.factor = Amount factor
needs.factor.description = Amount of goods relative to the donor need.\n1.0 = same amount as the donor\nHigher value = citizens need more\nLower value = citizens need less
needs.category = Shop category
needs.category.description = Shops that stock the goods.\nauto = the same shops as the donor need\nnone = no automatic shelf; a building must provide the goods itself\nbasic = basic shops only\nmedium = medium shops only\nadvanced = large shops only\nmediumadvanced = medium and large shops only\nhotel = hotels only\nA number = write this shop value directly; only for users familiar with the game files
needs.chance = Chance
needs.chance.description = Probability from 0 to 1 that a citizen receives this need. Below 1, it is distributed independently of the donor.\n0 = no citizen receives it\n1 = every suitable citizen receives it
needs.unhappy = Unhappiness
needs.unhappy.description = Satisfaction lost when a citizen cannot get the goods.\n0 = no loss; the need is shown only\n0.005 to 0.02 = typical range for a comfort good\nAllowed range: 0 to 1
needs.enabled = Plugin enabled
needs.enabled.description = ON enables the plugin.\nOFF disables it completely at the next game start.
needs.demand = Add demands
needs.demand.description = ON gives citizens the new need.\nOFF does not distribute the need, but may still add the goods to shops.
needs.storage = Stock shops
needs.storage.description = ON adds the goods to the selected shops.\nOFF adds no storage slots; citizens can then find the goods only in buildings that provide them themselves.
needs.max_demands = Demands per citizen
needs.max_demands.description = Maximum number of additional needs a citizen may have at the same time.\n1 = at most one additional need\n7 = highest permitted number
needs.when_full = When the citizen is full
needs.when_full.description = What happens when a citizen already has the maximum number of additional needs.\nskip = wait until a slot is free\nreplace = replace the donor need this time
needs.probe = Detailed log
needs.probe.description = ON writes citizen need lists and information about every shop to the detailed plugin log.\nOFF writes warnings only. Enable it temporarily when checking new shops.
needs.log_seconds = Progress line interval (seconds)
needs.log_seconds.description = Seconds between messages reporting how many needs have been assigned.\n0 = disable these messages\nHigher value = log less often
tab.needs.general = General
plugin.deposits = Deposits
plugin.deposits.description = Manage the deposit types the base game does not have, and the plugin switches, without editing the upstream file.
tab.deposits.general = General
tab.deposits.editor = Deposits
group.deposits = Deposits
group.deposits.description = Original deposits are protected and can be hidden; personal deposits are stored separately and merged into the effective deposits.ini. Every section except [deposits] is one deposit.
group.deposits.plugin = Plugin settings
group.deposits.plugin.description = The three subsystems in the [deposits] section. Each one is off for every deposit when its switch here is off.
deposits.notice = A deposit's type number, its map channel and the token in building.ini are part of a saved game once a mine uses them. Removing or renumbering a deposit that a saved game uses can make that save unusable; test on a copy first.
deposits.list = Deposit list
deposits.add = Add deposit
deposits.select_help = Select a deposit on the left or use + to add one for a resource registered by Resources.
deposits.name = Deposit
deposits.name.help = The section name in deposits.ini. It names the deposit in the log and in the editor brush; it cannot be renamed later.
deposits.new_name = Deposit name
deposits.new_hint = Only the standard settings are asked for here. Everything else (component, building type, depletion) is on the right in the settings after adding.
deposits.code_patch = Code patch
deposits.code_patch.description = ON enters the configured $TYPE_MINE_ deposit types into the game so mines can find them through building.ini. If the expected game data no longer matches after an update, the plugin changes nothing.
deposits.minimap_all = Minimap layers
deposits.minimap_all.description = ON shows a button below the five game minimap buttons for every individually enabled plugin deposit.\nOFF hides all plugin-deposit buttons.
deposits.editor_all = Terrain editor brushes
deposits.editor_all.description = ON shows a paint and erase brush in the Resources tab of the terrain editor for every deposit with a brush name.\nOFF hides all plugin-deposit brushes.
deposits.token = Building token
deposits.token.description = Token used by a mine in building.ini for this deposit, for example $TYPE_MINE_COPPER. Enter it like $TYPE_MINE_GRAVEL. Never use two deposit tokens in the same building.ini.
deposits.type = Type number
deposits.type.description = Unique type number of the deposit. Two deposits must not use the same number.\n10 to 127 = allowed range\n0 to 9 = reserved for the base game\nThe dialog proposes the next free number automatically.
deposits.map = Map
deposits.map.description = Map on which the deposit is stored.\nauto = choose a free slot on a plugin map automatically; recommended\nresourcemap or resourcemap2 = use base-game maps\nresourcemap3 to resourcemap10 = use additional plugin maps\nterrain = use painted ground directly, for example for gravel; its brush appears under ROCKS
deposits.component = Component
deposits.component.description = Every map has four slots from 0 to 3. Each slot can contain one deposit.\nWith auto = leave the field empty; the plugin chooses a free slot\nWith terrain: 2 = gravel layer\nWith terrain: 3 = oasis layer
deposits.building_type = Building type
deposits.building_type.description = Building type that can extract this deposit.\n7 = mine; correct for almost every deposit\n92 = water well\nEmpty field = 7
deposits.radius = Search radius
deposits.radius.description = How far a mine searches for its deposit.\noil, ore, bauxite, gravel, wood, water, watersurface = use the corresponding game constant\nA number = use this distance directly\nEmpty field = use ore\nWithout a radius, the mine finds no deposit.
deposits.icon = Minimap icon
deposits.icon.description = Resource whose icon appears on the minimap button. The plugin uses the icon already loaded by the game; no separate image is needed.\nResources from the Resources plugin must be registered there.\nEmpty field = no icon
deposits.minimap = Minimap button
deposits.minimap.description = ON adds a minimap button and overlay layer for this deposit.
deposits.editor = Editor brush name
deposits.editor.description = Name of the paint and erase brushes in the terrain editor. The same name is used for tool_paint_<name>.png and tool_erase_<name>.png under vfs\media_soviet\editor.\nEmpty field = create no brush\nAllowed: up to 31 letters, digits, _ and -
deposits.deplete = Depletion per texel
deposits.deplete.description = This setting is read by the Depletion plugin. It sets the tonnes a mine can extract from a completely full point of the resource map. Weaker points yield proportionally less.\nThe value overrides tonnes_per_texel in plugins\depletion.ini.\n0 = this deposit remains infinite\nEmpty field = use the global value
deposits.save_warning = Changes are written to the effective deposits.ini only when saved. Type numbers, map channels and tokens of deposits a saved game already uses must not change; test on a copy first.
depletion.tab.general = General
depletion.tab.mining = Mining
needs.save_warning = Changes land in the effective needs.ini only when you save. Every need adds a storage slot to the affected shops, and that slot is part of the saved game - test on a copy first.
bp.name = Buildings Plus
bp.description = New buildings from a declaration: a donor building of the game plus the building.ini lines that differ. Written as complete Workshop items at every game start.
bp.notice = Every building becomes a folder under media_soviet\workshop_wip with its own Workshop id. Leave the id empty and the plugin assigns the next free number from 9300000000 at game start and keeps it in plugins\buildings_plus.ids.ini. The game reads the folder like an unpublished Workshop item. Changes need a full restart. A saved game that contains such a building needs the folder when loading.
bp.tab.general = General
bp.tab.buildings = Buildings
bp.tab.sml = SML buildings
bp.wip = Buildings generated by Soviet Mod Loader
bp.wip.description = Soviet Mod Loader generates the buildings of a content package itself, into media_soviet\workshop_wip. They do not belong to Buildings Plus - what you see here is read from the folders.
bp.wip.empty = Soviet Mod Loader has not generated a building here. That is normal without a content package that brings one.
bp.group = Buildings
bp.group.notice = A building here is a copy of a game building with other lines: same model, same connections, your recipe. Pick a donor of the same kind (mine for mine, factory for factory).
bp.list = Buildings
bp.add = Add
bp.select_help = Select a building on the left or use + to add one. The donor is asked first, the Workshop id may stay empty; name and lines follow on the right.
bp.id = Object name
bp.id.help = Names the folder and the object of the generated building, and shows up in the log. Letters, digits, _ and - only, at most 64 characters; it cannot be changed later.
bp.save_warning = Changes are written to the effective buildings_plus.ini only when saved and take effect after a complete game restart. The plugin then writes the folder under media_soviet\workshop_wip; a section with an error is skipped and named in the log.
bp.list.note = At most 256 buildings.
bp.new_name = Object name
bp.new_hint = Spaces turn into underscores, capitals into lower case.
bp.card.folders = Generated folders
bp.card.log = Troubleshooting
bp.card.new = New building
bp.links = Guides
bp.link.readme = README (guide)
bp.prune = Clean up folders
bp.prune.description = ON removes the generated folder of a building you deleted or switched off at the next game start (only folders this plugin wrote).\nOFF leaves such folders in place; the game keeps loading those buildings.
bp.always = Always rewrite
bp.always.description = ON writes every building folder at every game start.\nOFF writes a folder only when its section, the plugin or a donor file changed. Keep it OFF.
bp.verbose = Detailed log
bp.verbose.description = ON writes every copied file and every removed donor line to logs\tesmioloader.buildings_plus.log.\nOFF writes results, warnings and errors only.
bp.repair_owner_ids = Fill in the owner id
bp.repair_owner_ids.description = ON fills your Steam id into generated buildings that carry none, the ones Soviet Mod Loader makes included. Without it the game asks about missing Workshop items every time you load a saved game that uses such a building.\nOFF leaves folders of other generators alone.
bp.enabled = Building enabled
bp.enabled.description = ON generates this building at the next game start.\nOFF does not generate it. With “Clean up folders” enabled, its existing folder is removed at the next start.
bp.item_id = Workshop id
bp.item_id.description = Own number possible: 9000000000 to 9999999999, except 9100000000 to 9199999999 (those belong to Soviet Mod Loader)\nIt names the folder under workshop_wip in the game folder and should not be changed afterwards.
bp.donor = Donor building
bp.donor.description = The building the copy starts from - a Workshop building has to be subscribed.\nUse "Choose donor..." to browse what you have. Match the kind: a mine for a mine, a factory for a factory, a shop for a shop.
bp.item_name = Name in the game
bp.item_name.description = The name shown in the game.\nA value with dots counts as a translation key and is resolved through the Localization plugin, for example: localization.lang.salt_mine
bp.desc = Description
bp.desc.description = The description of the Workshop entry, one line per row. No quotes.
bp.line = building.ini lines
bp.line.description = One building.ini line per row, for example $PRODUCTION raw_salt 1.0. Use "Choose line…" to take a line out of the donor building and adjust it. Your lines go in front of the donor's and replace: the same token; every $TYPE_*; every $STORAGE* together with $RESOURCE_VISUALIZATION; $PRODUCTION, $CONSUMPTION and $CONSUMPTION_PER_SECOND as one recipe. Everything else of the donor stays.\nFor your own resources always use $STORAGE_IMPORT_SPECIAL or $STORAGE_EXPORT_SPECIAL with the resource named, otherwise the storage lists every resource of the transport class.
bp.strip = Remove donor lines
bp.strip.description = One $TOKEN per row, for example $WORKERS_NEEDED. Every donor line with that token is dropped without replacement.
bp.life = Life
bp.life.description = Empty = 3000\nLIFE in renderconfig.ini: how much the building can take before it collapses. Like most game buildings.
bp.card.lines = Lines
bp.item_id.empty = the plugin assigns the next free number from 9300000000 at game start.
bp.item_name.empty = the object name - not recommended.
needs_plus.card.log = Troubleshooting
resources_plus.card.log = Troubleshooting
resources_plus.card.plugin = Plugin
resources_plus.custom_report = Log cloned records
resources_plus.custom_report.description = ON writes for every resource with a template what the clone really inherited (transport class, factors, flags). Resources without a template are always listed.\nOFF lists only those without a template.
resources_plus.customs_hook = Refresh customs houses
resources_plus.customs_hook.description = ON adds the new resources to the trade list of customs houses that already exist.\nOFF is the base game: a customs house trades only what it knew when it was built - then only demolishing and rebuilding helps.
resources_plus.customs_probe = Log customs house lines
resources_plus.customs_probe.description = ON writes one line per resource that gets added to a customs house into tesmioloader.log. Switch it OFF once your customs houses show what you expect.
resources_plus.price_hook = Apply prices from the INI
resources_plus.price_hook.description = ON lets [base_price] and [price] work: base prices are set before the game's price pass, fixed prices after it.\nOFF leaves the prices to the game.
resources_plus.price_report = Log the price table
resources_plus.price_report.description = ON writes every resource with price, base price and price kind to the detailed log after each price pass of the game. A price of 0.00 means no building produces it.\nOFF writes nothing.
