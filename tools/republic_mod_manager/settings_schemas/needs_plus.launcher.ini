; Republic Mod Manager local editor schema for Needs Plus (needs_plus.dll), the fork of the Needs plugin.
; This file describes the UI only. It never replaces needs_plus.dll or its INI.
; Format: needs_plus.ini [list] <resource> = <donor>[, <factor>[, <category>[, <chance>[, <unhappiness>]]]]

[launcher]
layout_version = 1
editor_type = keyed_list
id = tesmio.needs_plus.editor
name = Needs Plus
name_key = plugin.needs_plus
version = 0.1.1
description = Own citizen needs with Needs Plus: the same list as the original, in the file needs_plus.ini in the plugins folder, taken over from needs.ini at the first start.
replaced_by_sml = needs
description_key = plugin.needs_plus.description
icon = builtin:gear
language_directory = languages
default_tab = needs

[editor]
plugin = needs_plus
config = needs_plus.ini
list_section = list
maximum_items = 16

[activity]
section = needs
key = enabled
values = 1

; New entries may only name resources the Resources plugin registers.
[source]
plugin = resources
section = list
ready_section = resources
ready_key = hook
ready_value = 2

[tab:general]
label = General
label_key = tab.needs.general
order = 10

[tab:needs]
label = Needs
label_key = tab.needs.editor
order = 20

[group:needs]
tab = needs
label = Citizen needs
label_key = group.needs

[list]
label = Needs list
label_key = needs.list
add_label = Add need
add_label_key = needs.add
select_help = Select a need on the left or use + to add a resource registered by Resources.
select_help_key = needs.select_help
id_label = Resource
id_label_key = needs.resource
id_help = The resource the citizens are to want. It has to be registered in the list of the Resources plugin.
id_help_key = needs.resource.help
save_warning = Changes land in needs_plus.ini in the plugins folder only when you save. Every need adds a storage slot to the affected shops, and that slot is part of the saved game - test on a copy first.
save_warning_key = needs_plus.save_warning

[global]
tab = general
label = Plugin settings
label_key = group.needs.plugin
order = 10

[card:log]
tab = general
label = Troubleshooting
label_key = needs_plus.card.log
order = 20

; -----------------------------------------------------------------------------
; Columns of a [list] line

[column:donor]
type = choice
choices = food|meat|clothes|eletronics|alcohol
required = 1
label = Donor demand
label_key = needs.donor
description = Existing citizen demand the new one is cloned from. food or meat for a grocery good, clothes or eletronics for a department-store good (the game's own spelling).
description_key = needs.donor.description
order = 10

[column:factor]
type = decimal
minimum = 0
maximum = 100
default = 1.0
label = Amount factor
label_key = needs.factor
description = How much of it against the donor demand. 1.0 means as much as the donor.
description_key = needs.factor.description
order = 20

[column:category]
type = choice
choices = auto|none|basic|medium|advanced|mediumadvanced|hotel
allow_other = 1
default = auto
label = Shop category
label_key = needs.category
description = Which shops stock the goods.\nauto = like the donor demand\nnone = no shelf, a building has to provide it itself\nbasic, medium, advanced, mediumadvanced, hotel = only this shop size\nA number is written directly as the shop value (only for those who know the game files).
description_key = needs.category.description
order = 30

[column:chance]
type = decimal
minimum = 0
maximum = 1
default = 1.0
label = Chance
label_key = needs.chance
description = 0..1, how often a citizen takes the need up at all. Below 1 makes the need independent of the donor.
description_key = needs.chance.description
order = 40

[column:unhappy]
type = decimal
minimum = 0
maximum = 1
default = 0
label = Unhappiness
label_key = needs.unhappy
description = How much happiness a citizen loses every time they do not get the goods, 0 to 1.\n0 = the need is only shown.\nFor a comfort good about 0.005 to 0.02.
description_key = needs.unhappy.description
order = 50

; -----------------------------------------------------------------------------
; [needs] plugin switches

[detail:enabled]
scope = global
section = needs
key = enabled
type = boolean
default = 1
label = Plugin enabled
label_key = needs.enabled
description = ON lets the plugin work.\nOFF switches it off completely at the next game start.
description_key = needs.enabled.description
order = 10

[detail:demand]
scope = global
section = needs
key = demand
type = boolean
default = 1
label = Add demands
label_key = needs.demand
description = ON gives the citizens the new need.\nOFF leaves the citizens alone and only stocks the shops.
description_key = needs.demand.description
order = 20

[detail:storage]
scope = global
section = needs
key = storage
type = boolean
default = 1
label = Stock shops
label_key = needs.storage
description = ON puts the goods into every shop that also stocks the donor.\nOFF means: the citizens want the goods but never find them.
description_key = needs.storage.description
order = 30

[detail:max_demands]
scope = global
section = needs
key = max_demands
type = integer
minimum = 1
maximum = 7
default = 7
label = Demands per citizen
label_key = needs.max_demands
description = How many demands a citizen may carry at once. 7 is a hard ceiling.
description_key = needs.max_demands.description
order = 40

[detail:when_full]
scope = global
section = needs
key = when_full
type = choice
choices = skip|replace
default = skip
label = When the citizen is full
label_key = needs.when_full
description = skip = waits until the citizen has room again\nreplace = takes the place of the donor demand this time
description_key = needs.when_full.description
order = 50

[detail:probe]
scope = global
section = needs
key = probe
card = log
type = boolean
label = Detailed log
label_key = needs.probe
description = ON writes the citizens' demand lists and one line per shop to the plugin's log. Keep it ON until the shops are stocked.\nOFF writes warnings only.
description_key = needs.probe.description
order = 10

[detail:log_seconds]
scope = global
section = needs
key = log_seconds
card = log
type = integer
minimum = 0
maximum = 86400
label = Progress line interval (seconds)
label_key = needs.log_seconds
description = This many seconds pass between two log lines that report how many needs have been handed out.\n0 turns these lines off.
description_key = needs.log_seconds.description
order = 20
