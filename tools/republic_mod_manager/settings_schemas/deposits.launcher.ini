; Republic Mod Manager local editor schema for the existing Deposits plugin.
; This file describes the UI only. It never replaces deposits.dll or its original INI.
; Format: deposits.ini has [deposits] (the plugin's switches) and one section per
; deposit whose keys are the deposit's settings.

[launcher]
layout_version = 1
editor_type = keyed_sections
id = tesmio.deposits.editor
name = Deposits
name_key = plugin.deposits
version = 1.0
description = Manage the deposit types the base game does not have, and the plugin switches, without editing the upstream file.
description_key = plugin.deposits.description
icon = builtin:gear
language_directory = languages
default_tab = deposits

[editor]
plugin = deposits
config = deposits.ini
list_section = list
reserved_sections = deposits
maximum_items = 118

; New deposits pick their resource (icon) from the Resources plugin's list.
[source]
plugin = resources
section = list
ready_section = resources
ready_key = hook
ready_value = 2

[tab:general]
label = General
label_key = tab.deposits.general
order = 10

[tab:deposits]
label = Deposits
label_key = tab.deposits.editor
order = 20

[group:deposits]
tab = deposits
label = Deposits
label_key = group.deposits
description = Original deposits are protected and can be hidden; personal deposits are stored separately and merged into the effective deposits.ini. Every section except [deposits] is one deposit.
description_key = group.deposits.description

[list]
label = Deposit list
label_key = deposits.list
add_label = Add deposit
add_label_key = deposits.add
select_help = Pick a deposit on the left or add a new one with + for a resource from Resources.
select_help_key = deposits.select_help
id_label = Deposit
id_label_key = deposits.name
id_help = The section name in deposits.ini. It names the deposit in the log and in the editor brush; it cannot be renamed later.
id_help_key = deposits.name.help
save_warning = Changes reach the effective deposits.ini only when you save. Type numbers, map slots and tokens of deposits that a save game already uses must not change – that can break the save game.
save_warning_key = deposits.save_warning
summary = type|map

[new]
name_label = Deposit name
name_label_key = deposits.new_name
token_key = token
token_template = $TYPE_MINE_{NAME}
hint = Only the basics are asked here. Component, building type and depletion are set on the right after adding.
hint_key = deposits.new_hint

[global]
tab = general
label = Plugin settings
label_key = group.deposits.plugin
description = The three subsystems in the [deposits] section. Each one is off for every deposit when its switch here is off.
description_key = group.deposits.plugin.description
notice = Type number, map slot and the token in a deposit's building.ini become part of the save game as soon as a mine uses them. Removing or renumbering a deposit a save game uses can break that save game – test on a copy first.
notice_key = deposits.notice

; -----------------------------------------------------------------------------
; [deposits] plugin switches

[detail:code_patch]
scope = global
section = deposits
key = code_patch
type = boolean
label = Game file adjustment
label_key = deposits.code_patch
description = Enters the listed $TYPE_MINE_ deposit types into the game so mines can find and use them through the building.ini. If the game data does not match what is expected, the plugin changes nothing.
description_key = deposits.code_patch.description
order = 10

[detail:minimap_all]
scope = global
section = deposits
key = minimap
type = boolean
label = Minimap layers
label_key = deposits.minimap_all
description = ON adds a button below the game's five minimap buttons for every deposit that has its minimap button switched on.\nOFF shows no buttons for plugin deposits, even if they are switched on individually.
description_key = deposits.minimap_all.description
order = 20

[detail:editor_all]
scope = global
section = deposits
key = editor
type = boolean
label = Terrain editor brushes
label_key = deposits.editor_all
description = ON adds a paint and erase pair in the Resources tab of the terrain editor for every deposit that has a brush name.\nOFF shows no brushes for plugin deposits, even if they have a name individually.
description_key = deposits.editor_all.description
order = 30

; -----------------------------------------------------------------------------
; Keys of one deposit section

[detail:token]
scope = item
key = token
type = text
maximum_length = 64
dialog = 1
label = Building token
label_key = deposits.token
description = The token used in building.ini for this deposit, for example $TYPE_MINE_COPPER. It is entered there like $TYPE_MINE_GRAVEL. Never use two tokens in the same building.ini.
description_key = deposits.token.description
order = 10

[detail:type]
scope = item
key = type
type = integer
minimum = 10
maximum = 127
unique = 1
auto_increment = 1
dialog = 1
label = Type number
label_key = deposits.type
description = The deposit type number the game uses to identify the deposit. Required, 10 to 127; the numbers 0 to 9 are reserved for the base game. Two deposits must not use the same number. The dialog proposes the next free number automatically.
description_key = deposits.type.description
order = 20

[detail:map]
scope = item
key = map
type = choice
choices = auto|resourcemap|resourcemap2|resourcemap3|resourcemap4|resourcemap5|resourcemap6|resourcemap7|resourcemap8|resourcemap9|resourcemap10|terrain
default = auto
dialog = 1
label = Map
label_key = deposits.map
description = Sets where the deposit is stored: auto is normally right and uses the plugin's own maps; resourcemap and resourcemap2 belong to the base game. terrain is only for resources like gravel that are mined straight from painted ground; their brush appears under ROCKS.
description_key = deposits.map.description
order = 30

[detail:component]
scope = item
key = component
type = choice
choices = 0|1|2|3
label = Slot on the map
label_key = deposits.component
description = Every map has four slots, 0 to 3, and each slot carries one deposit. Leave empty with auto, the plugin picks a free slot itself. With terrain: 2 is the gravel layer, 3 the oasis layer.
description_key = deposits.component.description
order = 40

[detail:building_type]
scope = item
key = building_type
type = choice
choices = 7|92
allow_other = 1
label = Building type
label_key = deposits.building_type
description = 7 is a mine, which is almost certainly what you want; water wells are 92. Empty means 7.
description_key = deposits.building_type.description
order = 50

[detail:radius]
scope = item
key = radius
type = choice
choices = ore|oil|bauxite|gravel|wood|water|watersurface
allow_other = 1
default = ore
dialog = 1
label = Search radius
label_key = deposits.radius
description = How far the mine searches for its deposit. A game constant (oil, ore, bauxite, gravel, wood, water, watersurface) takes that value; a number applies directly; an empty field means ore; without a radius the mine finds nothing.
description_key = deposits.radius.description
order = 60

[detail:icon]
scope = item
key = icon
type = choice
choices_source = registry
allow_other = 1
dialog = 1
label = Minimap icon
label_key = deposits.icon
description = Name of the resource whose icon appears on the minimap button. The plugin uses the icon the game has already loaded for that resource; no image file of your own is needed; resources from the Resources plugin must be registered there; an empty field means no icon.
description_key = deposits.icon.description
order = 70

[detail:minimap]
scope = item
key = minimap
type = boolean
default = 1
dialog = 1
label = Minimap button
label_key = deposits.minimap
description = ON adds a minimap button for this deposit.
description_key = deposits.minimap.description
order = 80

[detail:editor]
scope = item
key = editor
type = text
maximum_length = 31
default = {name}
dialog = 1
label = Editor brush name
label_key = deposits.editor
description = Give the brush pair in the terrain editor a name. It is also the name of the two picture files: tool_paint_<name>.png and tool_erase_<name>.png under vfs\media_soviet\editor.\nAt most 31 characters, letters, digits, _ and -. Empty creates no brush.
description_key = deposits.editor.description
order = 90

[detail:deplete]
scope = item
key = deplete
type = decimal
minimum = 0
maximum = 1000000000
label = Tonnes per map point
label_key = deposits.deplete
description = Read by the Depletion plugin, not by this one. Sets how many tonnes a mine can take out of one point of the resource map before it is empty; a full point yields this value, a weaker one less. Overrides tonnes_per_texel in plugins\depletion.ini; 0 exempts the deposit and leaves it infinite; empty takes the global value.
description_key = deposits.deplete.description
order = 100
