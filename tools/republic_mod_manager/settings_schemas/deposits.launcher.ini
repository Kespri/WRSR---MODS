; Republic Mod Manager local editor schema for the existing Deposits plugin.
; This file describes the UI only. It never replaces deposits.dll or its original INI.
; Format: deposits.ini has [deposits] (the plugin's switches) and one section per
; deposit whose keys are the deposit's settings.

[launcher]
layout_version = 1
editor_type = keyed_sections
id = tesmio.deposits.editor
name = Deposits
name_key = plugin.deposits
version = 1.0
description = Manage the deposit types the base game does not have, and the plugin switches, without editing the upstream file.
description_key = plugin.deposits.description
icon = builtin:gear
language_directory = languages
default_tab = deposits

[editor]
plugin = deposits
config = deposits.ini
list_section = list
reserved_sections = deposits
maximum_items = 118

; New deposits pick their resource (icon) from the Resources plugin's list.
[source]
plugin = resources
section = list
ready_section = resources
ready_key = hook
ready_value = 2

[tab:general]
label = General
label_key = tab.deposits.general
order = 10

[tab:deposits]
label = Deposits
label_key = tab.deposits.editor
order = 20

[group:deposits]
tab = deposits
label = Deposits
label_key = group.deposits
description = Original deposits are protected and can be hidden; personal deposits are stored separately and merged into the effective deposits.ini. Every section except [deposits] is one deposit.
description_key = group.deposits.description

[list]
label = Deposit list
label_key = deposits.list
add_label = Add deposit
add_label_key = deposits.add
select_help = Select a deposit on the left or use + to add one for a resource registered by Resources.
select_help_key = deposits.select_help
id_label = Deposit
id_label_key = deposits.name
id_help = The section name in deposits.ini. It names the deposit in the log and in the editor brush; it cannot be renamed later.
id_help_key = deposits.name.help
save_warning = Changes are written to the effective deposits.ini only when saved. Type numbers, map channels and tokens of deposits a saved game already uses must not change; test on a copy first.
save_warning_key = deposits.save_warning
summary = type|map

[new]
name_label = Deposit name
name_label_key = deposits.new_name
token_key = token
token_template = $TYPE_MINE_{NAME}
hint = Only the standard settings are asked for here. Everything else (component, building type, depletion) is on the right in the settings after adding.
hint_key = deposits.new_hint

[global]
tab = general
label = Plugin settings
label_key = group.deposits.plugin
description = The three subsystems in the [deposits] section. Each one is off for every deposit when its switch here is off.
description_key = group.deposits.plugin.description
notice = A deposit's type number, its map channel and the token in building.ini are part of a saved game once a mine uses them. Removing or renumbering a deposit that a saved game uses can make that save unusable; test on a copy first.
notice_key = deposits.notice

; -----------------------------------------------------------------------------
; [deposits] plugin switches

[detail:code_patch]
scope = global
section = deposits
key = code_patch
type = boolean
label = Code patch
label_key = deposits.code_patch
description = ON enters the configured $TYPE_MINE_ deposit types into the game so mines can find them through building.ini. If the expected game data no longer matches after an update, the plugin changes nothing.
description_key = deposits.code_patch.description
order = 10

[detail:minimap_all]
scope = global
section = deposits
key = minimap
type = boolean
label = Minimap layers
label_key = deposits.minimap_all
description = ON shows a button below the five game minimap buttons for every individually enabled plugin deposit.\nOFF hides all plugin-deposit buttons.
description_key = deposits.minimap_all.description
order = 20

[detail:editor_all]
scope = global
section = deposits
key = editor
type = boolean
label = Terrain editor brushes
label_key = deposits.editor_all
description = ON shows a paint and erase brush in the Resources tab of the terrain editor for every deposit with a brush name.\nOFF hides all plugin-deposit brushes.
description_key = deposits.editor_all.description
order = 30

; -----------------------------------------------------------------------------
; Keys of one deposit section

[detail:token]
scope = item
key = token
type = text
maximum_length = 64
dialog = 1
label = Building token
label_key = deposits.token
description = Token used by a mine in building.ini for this deposit, for example $TYPE_MINE_COPPER. Enter it like $TYPE_MINE_GRAVEL. Never use two deposit tokens in the same building.ini.
description_key = deposits.token.description
order = 10

[detail:type]
scope = item
key = type
type = integer
minimum = 10
maximum = 127
unique = 1
auto_increment = 1
dialog = 1
label = Type number
label_key = deposits.type
description = Unique type number of the deposit. Two deposits must not use the same number.\n10 to 127 = allowed range\n0 to 9 = reserved for the base game\nThe dialog proposes the next free number automatically.
description_key = deposits.type.description
order = 20

[detail:map]
scope = item
key = map
type = choice
choices = auto|resourcemap|resourcemap2|resourcemap3|resourcemap4|resourcemap5|resourcemap6|resourcemap7|resourcemap8|resourcemap9|resourcemap10|terrain
default = auto
dialog = 1
label = Map
label_key = deposits.map
description = Map on which the deposit is stored.\nauto = choose a free slot on a plugin map automatically; recommended\nresourcemap or resourcemap2 = use base-game maps\nresourcemap3 to resourcemap10 = use additional plugin maps\nterrain = use painted ground directly, for example for gravel; its brush appears under ROCKS
description_key = deposits.map.description
order = 30

[detail:component]
scope = item
key = component
type = choice
choices = 0|1|2|3
label = Component
label_key = deposits.component
description = Every map has four slots from 0 to 3. Each slot can contain one deposit.\nWith auto = leave the field empty; the plugin chooses a free slot\nWith terrain: 2 = gravel layer\nWith terrain: 3 = oasis layer
description_key = deposits.component.description
order = 40

[detail:building_type]
scope = item
key = building_type
type = choice
choices = 7|92
allow_other = 1
label = Building type
label_key = deposits.building_type
description = Building type that can extract this deposit.\n7 = mine; correct for almost every deposit\n92 = water well\nEmpty field = 7
description_key = deposits.building_type.description
order = 50

[detail:radius]
scope = item
key = radius
type = choice
choices = ore|oil|bauxite|gravel|wood|water|watersurface
allow_other = 1
default = ore
dialog = 1
label = Search radius
label_key = deposits.radius
description = How far a mine searches for its deposit.\noil, ore, bauxite, gravel, wood, water, watersurface = use the corresponding game constant\nA number = use this distance directly\nEmpty field = use ore\nWithout a radius, the mine finds no deposit.
description_key = deposits.radius.description
order = 60

[detail:icon]
scope = item
key = icon
type = choice
choices_source = registry
allow_other = 1
dialog = 1
label = Minimap icon
label_key = deposits.icon
description = Resource whose icon appears on the minimap button. The plugin uses the icon already loaded by the game; no separate image is needed.\nResources from the Resources plugin must be registered there.\nEmpty field = no icon
description_key = deposits.icon.description
order = 70

[detail:minimap]
scope = item
key = minimap
type = boolean
default = 1
dialog = 1
label = Minimap button
label_key = deposits.minimap
description = ON adds a minimap button and overlay layer for this deposit.
description_key = deposits.minimap.description
order = 80

[detail:editor]
scope = item
key = editor
type = text
maximum_length = 31
default = {name}
dialog = 1
label = Editor brush name
label_key = deposits.editor
description = Name of the paint and erase brushes in the terrain editor. The same name is used for tool_paint_<name>.png and tool_erase_<name>.png under vfs\media_soviet\editor.\nEmpty field = create no brush\nAllowed: up to 31 letters, digits, _ and -
description_key = deposits.editor.description
order = 90

[detail:deplete]
scope = item
key = deplete
type = decimal
minimum = 0
maximum = 1000000000
label = Depletion per texel
label_key = deposits.deplete
description = This setting is read by the Depletion plugin. It sets the tonnes a mine can extract from a completely full point of the resource map. Weaker points yield proportionally less.\nThe value overrides tonnes_per_texel in plugins\depletion.ini.\n0 = this deposit remains infinite\nEmpty field = use the global value
description_key = deposits.deplete.description
order = 100
