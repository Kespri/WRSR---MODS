; Republic Mod Manager local editor schema for Resources Plus (resources_plus.dll), the fork of the Resources plugin.
; This file describes the UI only. It never replaces resources_plus.dll or its INI.

[launcher]
layout_version = 1
editor_type = keyed_resources
id = tesmio.resources_plus.editor
name = Resources Plus
name_key = plugin.resources_plus
version = 0.1.2
description = Own resources with Resources Plus: the same list as the original, in plugins\resources_plus.ini, without the crash on exit.
replaced_by_sml = resources
description_key = plugin.resources_plus.description
icon = builtin:gear
language_directory = languages
default_tab = resources

[editor]
plugin = resources_plus
config = resources_plus.ini
list_section = list
item_section_prefix = custom:
maximum_items = 256

[list]
; The keyed_resources editor warns before every save; the plain resources text names resources.ini.
save_warning = Changes land in plugins\resources_plus.ini when you save. Removing a resource a save already uses can break that save.
save_warning_key = resources_plus.save_warning

[activity]
section = resources
key = hook
values = 2|1

[tab:general]
label = General
label_key = tab.resources_plus.general
order = 10

[tab:resources]
label = Resources
label_key = tab.resources.editor
order = 20

[group:resources]
tab = resources
label = Resource definitions
label_key = group.resource_definitions

; -----------------------------------------------------------------------------
; Optional [custom:<resource>] record overrides

[detail:transport]
scope = custom
key = transport
type = choice
choices = covered|open|gravel|oil|cement|cooler|livestock|passanger|concrete|eletric|vehicles|general|nuclear1|nuclear2|heating|water|sewage|waste
; A value from the INI may carry factors behind the name ("oil, 1, 5, 5, 0");
; only the name is chosen here, the plugin fills in the class figures itself.
choice_prefix = 1
label = Transport class
label_key = detail.transport
description = Which vehicles and storages carry the resource. Choosing a name is enough; the plugin adds the base game's figures for that class.
description_key = detail.transport.description
heading = Transport and price kind
heading_key = resources.heading.basics
order = 10

[detail:kind]
scope = custom
key = kind
type = integer
minimum = 0
maximum = 4
label = Price kind
label_key = detail.kind
description = 0 raw, 1 manufactured, 2 food/clothing, 3 advanced material, 4 electronics.
description_key = detail.kind.description
order = 20

[detail:record_price]
scope = custom
key = price
type = pair
minimum = 0
maximum = 1000000000
label = Initial record price
label_key = detail.record_price
description = Optional RUB and USD starting values inside the resource record.
description_key = detail.record_price.description
heading = Prices in the record
heading_key = resources.heading.prices
order = 30

[detail:record_base_price]
scope = custom
key = base_price
type = pair
minimum = 0
maximum = 1000000000
label = Initial record base price
label_key = detail.record_base_price
description = Optional RUB and USD base values inside the resource record.
description_key = detail.record_base_price.description
order = 40

[detail:trade_mult]
scope = custom
key = trade_mult
type = pair
minimum = 0
maximum = 100
label = Trade multipliers
label_key = detail.trade_mult
description = Sell and buy multipliers, normally 0.95, 1.05.
description_key = detail.trade_mult.description
order = 50

[detail:market_rub]
scope = custom
key = market_rub
type = triple
minimum = 0
maximum = 1000000000
label = RUB market block
label_key = detail.market_rub
description = Two market figures and an optional coefficient.\n(See the description in the INI)
description_key = detail.market.description
heading = Market values
heading_key = resources.heading.market
order = 60

[detail:market_usd]
scope = custom
key = market_usd
type = triple
minimum = 0
maximum = 1000000000
label = USD market block
label_key = detail.market_usd
description = Two market figures and an optional coefficient.\n(See the description in the INI)
description_key = detail.market.description
order = 70

[detail:packed]
scope = custom
key = packed
type = choice
choices = auto|0|1
label = Packed cargo
label_key = detail.packed
description = Automatic, unpacked or packed cargo representation.
description_key = detail.packed.description
heading = Cargo and material
heading_key = resources.heading.cargo
order = 80

[detail:family]
scope = custom
key = family
type = choice
choices = none|gravel|steel|aluminium|plastic|bio|food|burnable|toxic|other|ash
label = Material family
label_key = detail.family
description = How the material looks when piled on a construction site and, most likely, which waste it becomes. Each family holds one waste resource. Numbers 10 to 19 in the INI are shown by name.
description_key = detail.family.description
order = 90

[detail:cargo]
scope = custom
key = cargo
type = choice
choices = auto|none|bulk|open
label = Cargo geometry
label_key = detail.cargo
description = Geometry selection used for cargo visualization.
description_key = detail.cargo.description
order = 100

; -----------------------------------------------------------------------------
; Optional keyed price sections

[detail:pinned_base_price]
scope = keyed
section = base_price
key = value
type = pair
minimum = 0
maximum = 1000000000
label = Pinned base price
label_key = detail.pinned_base_price
description = Optional [base_price] RUB and USD value. Empty means no personal entry.
description_key = detail.pinned_base_price.description
heading = Fixed prices
heading_key = resources.heading.fixed
order = 200

[detail:forced_price]
scope = keyed
section = price
key = value
type = pair
minimum = 0
maximum = 1000000000
label = Forced finished price
label_key = detail.forced_price
description = Optional [price] RUB and USD value. Empty means the game calculates the price.
description_key = detail.forced_price.description
order = 210

; -----------------------------------------------------------------------------
; Plugin-wide switches of [resources] and [customs], on the General tab

[global]
tab = general
label = Plugin
label_key = resources_plus.card.plugin
order = 10

[card:log]
tab = general
label = Troubleshooting
label_key = resources_plus.card.log
order = 20

[detail:price_hook]
scope = global
section = resources
key = price_hook
type = boolean
default = 1
label = Apply prices from the INI
label_key = resources_plus.price_hook
description = ON lets [base_price] and [price] work: base prices are set before the game's price pass, fixed prices after it.\nOFF leaves the prices to the game.
description_key = resources_plus.price_hook.description
order = 10

[detail:customs_hook]
scope = global
section = customs
key = hook
type = boolean
default = 1
label = Refresh customs houses
label_key = resources_plus.customs_hook
description = ON adds the new resources to the trade list of customs houses that already exist.\nOFF is the base game: a customs house trades only what it knew when it was built - then only demolishing and rebuilding helps.
description_key = resources_plus.customs_hook.description
order = 20

[detail:price_report]
scope = global
section = resources
key = price_report
type = boolean
default = 1
card = log
label = Log the price table
label_key = resources_plus.price_report
description = ON writes every resource with price, base price and price kind to the detailed log after each price pass of the game. A price of 0.00 means no building produces it.\nOFF writes nothing.
description_key = resources_plus.price_report.description
order = 10

[detail:custom_report]
scope = global
section = resources
key = custom_report
type = boolean
card = log
label = Log cloned records
label_key = resources_plus.custom_report
description = ON writes for every resource with a template what the clone really inherited (transport class, factors, flags). Resources without a template are always listed.\nOFF lists only those without a template.
description_key = resources_plus.custom_report.description
order = 20

[detail:customs_probe]
scope = global
section = customs
key = probe
type = boolean
card = log
label = Log customs house lines
label_key = resources_plus.customs_probe
description = ON writes one line per resource that gets added to a customs house into tesmioloader.log. Switch it OFF once your customs houses show what you expect.
description_key = resources_plus.customs_probe.description
order = 30
