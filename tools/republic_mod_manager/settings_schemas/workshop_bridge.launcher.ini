; Local launcher schema for the installed plugin "workshop_bridge" (my_plugins).
; Describes plugins\workshop_bridge.ini. The [packages] list is not a field:
; Republic Mod Manager writes it through each package's "Plugin active" switch and
; keeps it across saves of these settings. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.workshop_bridge
name = Workshop Bridge
config = workshop_bridge.ini
enabled_field = bridge/enabled
description = Loads the hook DLLs of your subscribed Workshop packages straight into TesmioLoader, no Soviet Mod Loader and no copying needed. Stays idle while Soviet Mod Loader is on and never loads a package that also sits in plugins\.
description_key = workshop_bridge.description
notice = Which packages load is not set here: switch "Plugin active" on or off at each Workshop package. The bridge keeps that list in user_config\workshop_bridge.ini.
notice_key = workshop_bridge.notice
notice_style = info
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:bridge]
tab = settings
label = Bridge
label_key = workshop_bridge.group.bridge
order = 10

[group:log]
tab = settings
label = Troubleshooting
label_key = workshop_bridge.group.log
order = 20

; A row with one button (0.4.53): drops [packages] entries whose package is no longer in the manager's list.
[action:prune]
group = bridge
label = Tidy the bridge list
label_key = workshop_bridge.prune.label
description = Removes old entries from the package list whose package is no longer in your plugin list. Entries of existing packages stay, switched-off ones too.
description_key = workshop_bridge.prune.description
button = Tidy up now
button_key = workshop_bridge.prune.button
command = bridge_prune
order = 35

[field:enabled]
section = bridge
key = enabled
label = Bridge active
label_key = workshop_bridge.enabled.label
description = OFF leaves every Workshop package unloaded unless Soviet Mod Loader or a local copy in plugins\ takes over.
description_key = workshop_bridge.enabled.description
type = boolean
group = bridge
order = 10

[field:policy]
section = bridge
key = policy
label = Packages not on the list
label_key = workshop_bridge.policy.label
description = list: only packages you switched on load. all: every subscribed package with hooks loads unless you switched it off.
description_key = workshop_bridge.policy.description
type = choice
choices = list|all
group = bridge
order = 20

[field:workshop_root]
section = bridge
key = workshop_root
label = Workshop folder
label_key = workshop_bridge.workshop_root.label
description = auto finds steamapps\workshop\content\784150 in the game's own Steam library. Otherwise an absolute path with one subfolder per package.
description_key = workshop_bridge.workshop_root.description
type = text
group = bridge
order = 30

[field:log_verbose]
section = bridge
key = log_verbose
label = Log every skipped package
label_key = workshop_bridge.log_verbose.label
description = ON writes one line to tesmioloader.log for every package the bridge looked at and did not load. Handy when a package stays missing.
description_key = workshop_bridge.log_verbose.description
type = boolean
group = log
order = 10
