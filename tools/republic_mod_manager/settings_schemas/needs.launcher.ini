; Republic Mod Manager local editor schema for the existing Needs plugin.
; This file describes the UI only. It never replaces needs.dll or its original INI.
; Format: needs.ini [list] <resource> = <donor>[, <factor>[, <category>[, <chance>[, <unhappiness>]]]]

[launcher]
layout_version = 1
editor_type = keyed_list
id = tesmio.needs.editor
name = Needs
name_key = plugin.needs
version = 1.0
description = Manage the extra citizen needs and the plugin switches without editing the upstream file.
description_key = plugin.needs.description
icon = builtin:gear
language_directory = languages
default_tab = needs

[editor]
plugin = needs
config = needs.ini
list_section = list
maximum_items = 8

[activity]
section = needs
key = enabled
values = 1

; New entries may only name resources the Resources plugin registers.
[source]
plugin = resources
section = list
ready_section = resources
ready_key = hook
ready_value = 2

[tab:general]
label = General
label_key = tab.needs.general
order = 10

[tab:needs]
label = Needs
label_key = tab.needs.editor
order = 20

[group:needs]
tab = needs
label = Citizen needs
label_key = group.needs

[list]
label = Needs list
label_key = needs.list
add_label = Add need
add_label_key = needs.add
select_help = Select a need on the left or use + to add a resource registered by Resources.
select_help_key = needs.select_help
id_label = Resource
id_label_key = needs.resource
id_help = The resource the citizens are to want. It has to be registered in the list of the Resources plugin.
id_help_key = needs.resource.help
save_warning = Changes land in the effective needs.ini only when you save. Every need adds a storage slot to the affected shops, and that slot is part of the saved game - test on a copy first.
save_warning_key = needs.save_warning

[global]
tab = general
label = Plugin settings
label_key = group.needs.plugin

; -----------------------------------------------------------------------------
; Columns of a [list] line

[column:donor]
type = choice
choices = food|meat|clothes|eletronics|alcohol
required = 1
label = Donor demand
label_key = needs.donor
description = Existing need used as the template.\nfood or meat = for food shops\nclothes or eletronics = for department stores\nalcohol = for alcohol shops\neletronics is the spelling used by the game.
description_key = needs.donor.description
order = 10

[column:factor]
type = decimal
minimum = 0
maximum = 100
default = 1.0
label = Amount factor
label_key = needs.factor
description = Amount of goods relative to the donor need.\n1.0 = same amount as the donor\nHigher value = citizens need more\nLower value = citizens need less
description_key = needs.factor.description
order = 20

[column:category]
type = choice
choices = auto|none|basic|medium|advanced|mediumadvanced|hotel
allow_other = 1
default = auto
label = Shop category
label_key = needs.category
description = Shops that stock the goods.\nauto = the same shops as the donor need\nnone = no automatic shelf; a building must provide the goods itself\nbasic = basic shops only\nmedium = medium shops only\nadvanced = large shops only\nmediumadvanced = medium and large shops only\nhotel = hotels only\nA number = write this shop value directly; only for users familiar with the game files
description_key = needs.category.description
order = 30

[column:chance]
type = decimal
minimum = 0
maximum = 1
default = 1.0
label = Chance
label_key = needs.chance
description = Probability from 0 to 1 that a citizen receives this need. Below 1, it is distributed independently of the donor.\n0 = no citizen receives it\n1 = every suitable citizen receives it
description_key = needs.chance.description
order = 40

[column:unhappy]
type = decimal
minimum = 0
maximum = 1
default = 0
label = Unhappiness
label_key = needs.unhappy
description = Satisfaction lost when a citizen cannot get the goods.\n0 = no loss; the need is shown only\n0.005 to 0.02 = typical range for a comfort good\nAllowed range: 0 to 1
description_key = needs.unhappy.description
order = 50

; -----------------------------------------------------------------------------
; [needs] plugin switches

[detail:enabled]
scope = global
section = needs
key = enabled
type = boolean
default = 1
label = Plugin enabled
label_key = needs.enabled
description = ON enables the plugin.\nOFF disables it completely at the next game start.
description_key = needs.enabled.description
order = 10

[detail:demand]
scope = global
section = needs
key = demand
type = boolean
default = 1
label = Add demands
label_key = needs.demand
description = ON gives citizens the new need.\nOFF does not distribute the need, but may still add the goods to shops.
description_key = needs.demand.description
order = 20

[detail:storage]
scope = global
section = needs
key = storage
type = boolean
default = 1
label = Stock shops
label_key = needs.storage
description = ON adds the goods to the selected shops.\nOFF adds no storage slots; citizens can then find the goods only in buildings that provide them themselves.
description_key = needs.storage.description
order = 30

[detail:max_demands]
scope = global
section = needs
key = max_demands
type = integer
minimum = 1
maximum = 7
label = Demands per citizen
label_key = needs.max_demands
description = Maximum number of additional needs a citizen may have at the same time.\n1 = at most one additional need\n7 = highest permitted number
description_key = needs.max_demands.description
order = 40

[detail:when_full]
scope = global
section = needs
key = when_full
type = choice
choices = skip|replace
label = When the citizen is full
label_key = needs.when_full
description = What happens when a citizen already has the maximum number of additional needs.\nskip = wait until a slot is free\nreplace = replace the donor need this time
description_key = needs.when_full.description
order = 50

[detail:probe]
scope = global
section = needs
key = probe
type = boolean
label = Detailed log
label_key = needs.probe
description = ON writes citizen need lists and information about every shop to the detailed plugin log.\nOFF writes warnings only. Enable it temporarily when checking new shops.
description_key = needs.probe.description
order = 60

[detail:log_seconds]
scope = global
section = needs
key = log_seconds
type = integer
minimum = 0
maximum = 86400
label = Progress line interval (seconds)
label_key = needs.log_seconds
description = Seconds between messages reporting how many needs have been assigned.\n0 = disable these messages\nHigher value = log less often
description_key = needs.log_seconds.description
order = 70
