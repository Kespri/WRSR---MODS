; Local launcher schema for the installed TesmioLoader plugin "cities".
; Describes plugins\cities.ini; the plugin itself is untouched. English
; fallback here, German in languages\de.ini. UTF-8 without BOM.

[launcher]
layout_version = 1
visible = 1
id = local.cities
name = City Radius
config = cities.ini
enabled_field = cities/enabled
description = Size and shape of every city. In the base game every city is a circle with a 1000 m radius. With this plugin you set the radius for each city on its own, optionally as a square, right in the city window. The values are stored in the saved game.
description_key = cities.description
language_directory = languages
icon = builtin:gear
default_tab = settings
maximum_value_length = 4096

[group:cities]
tab = settings
label = Cities
label_key = cities.group.cities
order = 10

[group:slider]
tab = settings
label = Radius slider
label_key = cities.group.slider
description = How far the slider in the city window reaches and how much one click on + or - changes.
description_key = cities.group.slider.description
order = 20

[group:layout]
tab = settings
label = Layout in the city window
label_key = cities.group.layout
description = Where the two new rows sit in the city window. The numbers are positions in the game window's own unit; the window is about 500 wide.
description_key = cities.group.layout.description
order = 30

[group:overlay]
tab = settings
label = Dot grid on the ground
label_key = cities.group.overlay
order = 40

[group:diagnostics]
tab = settings
label = Troubleshooting
label_key = cities.group.diagnostics
order = 50

[field:enabled]
section = cities
key = enabled
label = Plugin enabled
label_key = cities.enabled.label
description = OFF leaves the game exactly as it is without the plugin.
description_key = cities.enabled.description
type = boolean
group = cities
order = 10

[field:window]
section = cities
key = window
label = Radius slider and shape checkbox in the city window
label_key = cities.window.label
description = ON shows the radius slider and the square-shape box in the city window.\nOFF hides both; the set values stay, but you can no longer change them.
description_key = cities.window.description
type = boolean
group = cities
order = 20

[field:adopt]
section = cities
key = adopt
label = Give orphaned buildings a city of their own
label_key = cities.adopt.label
description = When you shrink a city, buildings can end up outside and belong to no city any more.\nON founds a new city for them with a random name and today's date, the way the game does it itself.\nOFF leaves them without a city; how the game behaves then is untested.
description_key = cities.adopt.description
type = boolean
group = cities
order = 30

[field:radius]
section = cities
key = radius
label = Default radius (m)
label_key = cities.radius.label
description = Radius for every city you have never set individually. 1000 is the base game. Another value changes all those cities on all maps at once.
description_key = cities.radius.description
type = integer
minimum = 100
maximum = 10000
step = 50
group = cities
order = 40

[field:square]
section = cities
key = square
label = Default shape square
label_key = cities.square.label
description = ON makes every city you have never set individually square.\nOFF = circle as in the base game.
description_key = cities.square.description
type = boolean
group = cities
order = 50

[field:radius_min]
section = cities
key = radius_min
label = Smallest radius on the slider (m)
label_key = cities.radius_min.label
description = The value at the far left of the slider.
description_key = cities.radius_min.description
type = integer
minimum = 50
maximum = 10000
step = 50
group = slider
order = 10

[field:radius_max]
section = cities
key = radius_max
label = Largest radius on the slider (m)
label_key = cities.radius_max.label
description = The value at the far right of the slider. The slider has 100 steps; with 200 to 5000 one step is 48 m.
description_key = cities.radius_max.description
type = integer
minimum = 100
maximum = 20000
step = 50
group = slider
order = 20

[field:step]
section = cities
key = step
label = Percent per button click
label_key = cities.step.label
description = How many percent of the slider range one click on + or - changes. Dragging the slider ignores this.
description_key = cities.step.description
type = integer
minimum = 1
maximum = 50
step = 1
group = slider
order = 30

[field:label_x]
section = cities
key = label_x
label = Label position
label_key = cities.label_x.label
description = Distance of the label from the left edge of the window.
description_key = cities.label_x.description
type = integer
minimum = 0
maximum = 500
step = 5
group = layout
order = 10

[field:widget_x]
section = cities
key = widget_x
label = Widget position
label_key = cities.widget_x.label
description = Distance of the slider and the box from the left edge of the window. The slider needs about 225.
description_key = cities.widget_x.description
type = integer
minimum = 0
maximum = 500
step = 5
group = layout
order = 20

[field:checkbox_dy]
section = cities
key = checkbox_dy
label = Move the box row up or down
label_key = cities.checkbox_dy.label
description = The game draws boxes a little higher than stated; this value makes up for it so the box does not sit on the slider. Higher = row further down, lower = further up.
description_key = cities.checkbox_dy.description
type = integer
minimum = -100
maximum = 100
step = 1
group = layout
order = 30

[field:overlay]
section = cities
key = overlay
label = Overlay follows radius and shape
label_key = cities.overlay.label
description = While a city window is open the game shows a blue dot grid on the ground, but only ever for a 1000 m circle.\nON fits the grid to your radius and shape.\nOFF leaves it as in the base game.
description_key = cities.overlay.description
type = boolean
group = overlay
order = 10

[field:overlay_step]
section = cities
key = overlay_step
label = Overlay grid spacing (m)
label_key = cities.overlay_step.label
description = Distance between the dots. 0 picks a twentieth of the radius automatically, at least 50 m as in the base game. Too small a distance with a large radius costs a lot of performance, because the game checks every dot on its own.
description_key = cities.overlay_step.description
type = integer
minimum = 0
maximum = 1000
step = 10
group = overlay
order = 20

[field:probe]
section = cities
key = probe
label = Write cities to the log
label_key = cities.probe.label
description = ON writes all cities with radius, shape and building count to tesmioloader.log after every load, plus ongoing lines while a city window is open. Only for troubleshooting, the log gets big.
description_key = cities.probe.description
type = boolean
group = diagnostics
order = 10
