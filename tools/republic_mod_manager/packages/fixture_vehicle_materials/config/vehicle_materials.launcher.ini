; ----------------------------------------------------------------------------
; Dynamic material collection
; The + dialog reads selectable names from build\plugins\resources.ini.
; Adding an item creates resourceN and one coefficient in every target section.
; Removing an item deletes all associated entries and closes numbering gaps.
; ----------------------------------------------------------------------------
[collection:materials]
source = local-plugin:resources/list
source_ready_section = resources
source_ready_key = hook
source_ready_value = 2

resource_group = resources
matrix_group = vehicles

count_section = resources
count_key = count
item_prefix = resource
item_label = Material
item_label_key = material_number
item_description_key = registered_resource_help

target_sections = road|rail|ship|airplane
target_labels = Strassenfahrzeuge|Schienenfahrzeuge|Schiffe|Flugzeuge
target_label_keys = row.road|row.rail|row.ship|row.airplane
target_icons = builtin:truck|builtin:rail|builtin:ship|builtin:plane

unit = Koeffizient
unit_key = unit.coefficient
coefficient_description_key = coefficient.description

; Shown only while the dynamic material collection is empty.
empty_notice = No materials have been configured yet. First add a material with + on the Resources tab.
empty_notice_key = vehicles.empty_notice
empty_notice_style = warning

type = decimal
minimum = 0
maximum = 1000000
step = 0.001
default = 0
maximum_items = 32

ownership = user
allow_remove_defaults = 1

; The shipped configuration starts disabled and empty. Once enabled, at least
; one vehicle class must therefore use a positive coefficient.
require_positive_when_enabled = 1

; Guides of the package, one button per UI language (Republic Mod Manager 0.22.4 and later).
[links]
tab = general
root = ..

[link:readme]
file = README_DE.md
language = de
label = README
label_key = link.readme
order = 10

[link:readme_en]
file = README_EN.md
language = en
label = README
label_key = link.readme
order = 20
