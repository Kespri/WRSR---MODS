; ============================================================================
;  Vehicle Materials - Tesmio Settings presentation schema
; ============================================================================
;  This file controls only how the plugin is presented in Tesmio Settings.
;  Plugin behavior and default values remain in hooks\vehicle_materials.ini.
;
;  Maintenance order:
;    1. Launcher metadata
;    2. Tabs
;    3. Visual groups
;    4. General fields
;    5. Resource counter
;    6. Advanced vehicle-type mapping
;    7. Dynamic material collection and vehicle matrix
;
;  Technical identifiers such as section names, keys, tab IDs and group IDs
;  must not be translated. Human-readable fallback text may be translated via
;  config\languages\<language>.ini using the corresponding *_key entries.
; ============================================================================


; ----------------------------------------------------------------------------
; Launcher metadata
; ----------------------------------------------------------------------------
[launcher]
layout_version = 1
visible = 1
id = tesmio.vehicle_materials
name = Vehicle Materials
config = vehicle_materials.ini

description = Zusaetzliche Materialien fuer die Fahrzeugproduktion
description_key = plugin.description
icon = builtin:truck

enabled_field = general/enabled
default_tab = resources
language_directory = config\languages
maximum_value_length = 63


; ----------------------------------------------------------------------------
; Navigation tabs
; The number and order of tabs are controlled entirely by these sections.
; ----------------------------------------------------------------------------
[tab:general]
label = Allgemein
label_key = tab.general
order = 10

[tab:resources]
label = Ressourcen
label_key = tab.resources
order = 20

[tab:vehicles]
label = Fahrzeugklassen
label_key = tab.vehicles
order = 30

[tab:mapping]
label = Erweiterte Zuordnung
label_key = tab.mapping
order = 40


; ----------------------------------------------------------------------------
; Content groups
; "fields" displays normal setting rows. "matrix" creates the vehicle table.
; ----------------------------------------------------------------------------
[group:general]
tab = general
layout = fields
label = Allgemein und Diagnose
label_key = group.general
description = Grundfunktion und Diagnoseprotokoll des Plugins.
description_key = general.description
order = 10

[group:resources]
tab = resources
layout = fields
label = Materialien
label_key = group.resources
description = Materialien werden aus der Ressourcenliste des Resources-Plugins ausgewaehlt.
description_key = resources.description
order = 10

[group:vehicles]
tab = vehicles
layout = matrix
label = Materialverbrauch nach Fahrzeugklasse
label_key = group.vehicles
description = Fuer jedes Material kann je Fahrzeugklasse ein eigener Koeffizient festgelegt werden.
description_key = vehicles.description
notice = Koeffizienten von 0 bis 1.000.000. Ein Wert von 0 deaktiviert das Material fuer diese Fahrzeugklasse. Originale Produktionsmaterialien bleiben unveraendert.
notice_key = vehicles.notice
order = 10

[group:mapping]
tab = mapping
layout = fields
label = Zuordnung der internen Fahrzeugtypen
label_key = group.mapping
description = Experteneinstellungen fuer Sonderfaelle. Die automatische Zuordnung ist normalerweise richtig.
description_key = mapping.group.description
order = 10


; ----------------------------------------------------------------------------
; General plugin settings
; ----------------------------------------------------------------------------
[field:enabled]
section = general
key = enabled
label = Plugin aktivieren
label_key = field.enabled
type = boolean
description = Aktiviert die zusaetzlichen Produktionsmaterialien. Ein Spielneustart ist erforderlich.
description_key = field.enabled.description
group = general
order = 10

[field:debug]
section = general
key = debug
label = Diagnoseprotokoll
label_key = field.debug
type = boolean
description = Nur fuer die Fehlersuche einschalten; normalerweise deaktiviert lassen.
description_key = field.debug.description
group = general
order = 20

[field:debug_limit]
section = general
key = debug_limit
label = Maximale Diagnoseeintraege
label_key = field.debug_limit
type = integer
description = Begrenzt die Anzahl wiederholter detaillierter Protokolleintraege.
description_key = field.debug_limit.description
minimum = 0
maximum = 10000
step = 1
group = general
order = 30


; ----------------------------------------------------------------------------
; Dynamic resource list summary
; Individual resource0, resource1, ... entries are generated by the collection
; below and must therefore not be declared as fixed fields.
; ----------------------------------------------------------------------------
[field:count]
section = resources
key = count
label = Anzahl Materialien
label_key = field.count
type = readonly
description = Die aktuell konfigurierten Materialien werden darunter angezeigt.
description_key = field.count.description
group = resources
order = 10


; ----------------------------------------------------------------------------
; Advanced vehicle-type mapping
; Values: -1 automatic, 0 road, 1 rail, 2 ship, 3 airplane.
; ----------------------------------------------------------------------------
[field:type0]
section = mapping
key = type0
label = Fahrzeugtyp 0
label_key = field.type0
type = choice
description = -1=automatisch, 0=Strasse, 1=Schiene, 2=Schiff, 3=Flugzeug.
