[mod]
id = tesmio.vehicle_materials
name = Vehicle Materials
version = 0.4.0
enabled = 1
tesmio_api_min = 4
tesmio_api_max = 4

[hooks]
dll = hooks\vehicle_materials.dll

; Additional metadata for Tesmio Autoload. SML ignores these sections.
[configuration]
defaults = hooks\vehicle_materials.ini
launcher_schema = config\vehicle_materials.launcher.ini
user_config = vehicle_materials.ini

[autoload]
format = 1
kind = plugin
target = vehicle_materials
requires_local = resources
conflicts_local = vehiclematerials
