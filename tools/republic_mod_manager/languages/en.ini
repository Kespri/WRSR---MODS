sml_hosted_notice = Soviet Mod Loader has {0} built in. That is why there is no plugins\{1}.dll of its own in the game, and nothing for RMM to set here.
sml_hosted_generated = Soviet Mod Loader rewrites plugins\{0} on every game start - the first line of the file says so. Anything you entered here would be gone the next time you start.
sml_hosted_how = New entries come from packages instead: subscribe to a content package and Soviet Mod Loader merges it itself. It keeps the untouched original under soviet_mod_loader\base.
