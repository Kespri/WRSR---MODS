sml_content = Soviet Mod Loader is active and reads this package itself - subscribing is enough. RMM provides nothing here, it would write into files Soviet Mod Loader regenerates on the next game start.
sml_hosted_wait = Start the game once. Soviet Mod Loader then writes its baseline to soviet_mod_loader\base, and this page turns back into the normal editor - your entries go there and survive every start.
sml_base_notice = Soviet Mod Loader is in charge. Your entries go to {0}, not to {1} - it rewrites that file from your version plus the packages at every game start. What a package adds is listed here with a lock - change it anyway and RMM puts your line into the RMM Overlay layer, which it merges after the packages; and a few switches (hook, code_patch and the like) it sets itself as soon as there is something to load.
sml_overlay_idle = The layer {0} sits in your Workshop folder, but Soviet Mod Loader is switched off. It is the only thing that reads it, so your changes to package entries do nothing right now. Switch it back on, or delete the folder {1} when you no longer need it.
fork_seeded = {0} did not exist yet. RMM created it from {1}, in the same order - the plugin would have done the same at the next game start. The source was left unchanged.
sml_replaced = Soviet Mod Loader brings its own {1}. {0} steps aside at game start and does nothing - your settings here are still fine. If you want {0} instead of Soviet Mod Loader, switch soviet_mod_loader off in the list.
