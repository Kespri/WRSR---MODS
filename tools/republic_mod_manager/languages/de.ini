reference_resource_id = Eintrag „{0}“: Diese Ressource kennt weder das Spiel noch das Resources-Plugin. Das Plugin würde den Eintrag beim Laden der Welt abschalten. Nimm einen Namen aus der Liste oder registriere die Ressource zuerst im Resources-Plugin.
