sml_hosted = Soviet Mod Loader kümmert sich um {0}
sml_hosted_notice = Soviet Mod Loader hat {0} fest eingebaut. Darum liegt keine eigene plugins\{1}.dll im Spiel, und RMM hat hier nichts einzustellen.
sml_hosted_generated = Die Datei plugins\{0} schreibt Soviet Mod Loader bei jedem Spielstart neu - in ihrer ersten Zeile steht das auch so. Was du hier einträgst, wäre beim nächsten Start wieder weg.
sml_hosted_how = Neue Einträge kommen stattdessen aus Paketen: Abonniere ein Paket mit Inhalt, dann baut Soviet Mod Loader es selbst ein. Den unveränderten Grundstand legt er unter soviet_mod_loader\base ab.
sml_hosted_back = Willst du wieder selbst bearbeiten: soviet_mod_loader in der tesmioloader.ini auf 0 setzen und {0}.dll samt {1} nach plugins\ legen. Dann ist der Editor wieder da.
sml_content = Soviet Mod Loader ist aktiv und liest dieses Paket selbst - abonnieren reicht. RMM stellt hier nichts bereit, es würde sonst in Dateien schreiben, die Soviet Mod Loader beim nächsten Spielstart neu erzeugt.
sml_hosted_wait = Starte das Spiel einmal. Dann legt Soviet Mod Loader unter soviet_mod_loader\base seine Grundfassung an, und hier steht wieder der ganz normale Editor - deine Einträge landen dann dort und überleben jeden Start.
sml_base_notice = Soviet Mod Loader ist am Ruder. Deine Einträge gehen nach {0}, nicht nach {1} - diese Datei schreibt er bei jedem Spielstart neu aus deiner Fassung plus den Paketen. Was ein Paket beisteuert, steht hier mit Schloss - änderst du es doch, legt RMM deine Zeile in die Schicht RMM Overlay, die er nach den Paketen liest; und ein paar Schalter (etwa hook, code_patch) setzt er selbst, sobald etwas zu laden ist.
sml_overlay_idle = Die Schicht {0} liegt in deinem Workshop-Ordner, aber Soviet Mod Loader ist aus. Nur er liest sie, deine Änderungen an Paketeinträgen wirken also gerade nicht. Schalte ihn wieder ein, oder lösch den Ordner {1}, wenn du ihn nicht mehr brauchst.
fork_seeded = {0} gab es noch nicht. RMM hat die Datei aus {1} angelegt, in derselben Reihenfolge - das Plugin hätte beim nächsten Spielstart dasselbe getan. Die Quelle blieb unverändert.
