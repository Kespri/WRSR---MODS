; ============================================================================
;  Localization Pack: research_expansion
; ============================================================================
;  This text pack provides additional translations for the Research Expansion
;  plugin. It is loaded by the Localization plugin at game start.
;
;  Files in this folder:
;    localization.ini   - this configuration file
;    sovietGerman.ini   - German translations
;    sovietEnglish.ini  - English translations (fallback)
;
;  The language files must contain a [strings] section.
;  Example:
;    [strings]
;    quartz_smasher.name = Quartz Crusher
;    quartz_smasher.desc = First line.\nSecond line
; ============================================================================


[localization]

; Unique name of this text pack.
; Only lowercase ASCII letters, digits, '_' and '-' are allowed.
; This value must not be empty.
namespace = research_expansion

; Language used when the active language is missing or invalid.
; Must exist as a file in this folder, e.g. sovietEnglish.ini
; The language code is given without the .ini extension.
fallback = sovietEnglish

; Optional replacement text when a key does not exist in any language file.
; The placeholder {key} is replaced by the full key.
; If omitted, the plugin uses:
;   [MISSING TEXT: {key}]
missingText = [MISSING TEXT: {key}]
