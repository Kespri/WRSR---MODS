; ============================================================================
;  Localization Plugin 0.4.0 - Configuration
; ============================================================================
;  This plugin provides shared, namespaced texts for other TesmioLoader
;  plugins. It reads text packs below plugins\localization\ (and, when the DLL
;  runs from a Workshop package, also from the folder localization beside the
;  DLL) and generates
;  extended soviet*.btf files in the TesmioLoader VFS.
;
;  File format for this main plugin INI:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings
;    - Do not repeat sections or keys
;
;  Safety and fallback behavior:
;    - The original game language files are NEVER modified.
;    - Previous generated BTF overlays are removed before configuration and
;      text packs are validated. This also keeps allocated IDs deterministic.
;    - Any initialization or generation error removes generated overlays and
;      leaves the original game language files active.
;    - Set enabled = 0 here and start TesmioLoader once to remove generated
;      overlays before disabling or removing localization.dll.
;    - Disabling the DLL directly in tesmioloader.ini prevents its cleanup
;      code from running.
;    - Do not edit generated files below vfs\media_soviet by hand.
;
;  Requirements:
;    - TesmioLoader API 4 with VFS enabled
;    - At least one valid localization text pack
;    - Tested with WRSR 1.1.1.9
;
;  Limits:
;    - Maximum size per INI file: 16 MiB
;    - Maximum source or generated BTF size: 256 MiB
;    - Maximum pack directories: 256
;    - Maximum registered text keys: 100,000
;    - Reserved localization IDs: 2,000,000 .. 2,999,999
;    - Maximum text length: 65,535 UTF-16 code units
;
;  Detail log: logs\tesmioloader.localization.log
; ============================================================================


; ----------------------------------------------------------------------------
; [localization]  General plugin settings
; ----------------------------------------------------------------------------
[localization]

; Enable the plugin. Only the exact values 0 and 1 are accepted.
; See the cleanup warning in the file header before disabling the DLL.
;   0 = remove generated overlays and remain inactive
;   1 = load packs, provide the service and generate VFS language files
enabled = 1

; Diagnostic logging. Only the exact values 0 and 1 are accepted.
;   0 = normal status messages, warnings and errors
;   1 = additional technical paths for troubleshooting
verbose = 0
