; workshop_bridge 0.2.0 - loads Workshop hook DLLs without Soviet Mod Loader.
;
; UTF-8 without a BOM. This file is the base; your personal values belong in
; user_config\workshop_bridge.ini (Republic Mod Manager writes that file) and
; every key there wins over this one.
;
; The bridge does nothing while Soviet Mod Loader is loaded or switched on,
; and it never loads a package whose DLL also exists as plugins\<name>.dll.

[bridge]
; 0 = the bridge stays idle; no package is loaded.
enabled = 1

; Which subscribed packages with a [hooks] dll are loaded when they are not
; named under [packages]:
;   list   only packages listed below with a 1 (what Republic Mod Manager manages)
;   all    every package with hooks, unless listed below with a 0
policy = list

; auto = <Steam library of the game>\steamapps\workshop\content\784150,
; otherwise an absolute path to a folder with one subfolder per package.
workshop_root = auto

; 1 = one log line per package the bridge looked at and did not load.
log_verbose = 0

[packages]
; <Workshop item number or folder name> = 1 loads its hooks, 0 skips them.
; Republic Mod Manager keeps this list in user_config\workshop_bridge.ini
; through each package's "Plugin active" switch. Example:
; 123456789 = 1
