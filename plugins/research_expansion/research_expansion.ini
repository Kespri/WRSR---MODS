; ============================================================================
;  Research Expansion Plugin 0.4.2 - Configuration
; ============================================================================
;  This file defines additional research entries and scoped Vanilla edits.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings or directives
;    - Directive names are case-sensitive
;
;  Safety and fallback behavior:
;    - The original game file is NEVER modified.
;    - The plugin regenerates an extended research.ini in the TesmioLoader VFS.
;    - Any validation or generation error rejects the complete extension and
;      leaves Vanilla research active.
;    - Set [general] enabled = 0 to remove the generated VFS override during
;      the next initialization.
;    - Disabling the DLL in tesmioloader.ini prevents this cleanup code from
;      running; use enabled = 0 here before disabling the DLL.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Localization plugin (mandatory)
;    - Reference game version: WRSR 1.1.1.9
;
;  Limits:
;    - Maximum configuration size: 8 MiB
;    - Maximum active research blocks: 256
;    - Maximum modification sections: 256; edit operations: 4096 in total
;    - Maximum edit operand length: 4096 bytes per single line
;    - Maximum + / $UNLOCK_RESEARCH lines across new blocks: 4096
;    - No active blocks or edits: no VFS research.ini is generated
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable plugin. Only the exact values 0 and 1 are accepted.
; See the cleanup warning in the file header before disabling the DLL.
enabled = 1

; Diagnostic logging. Only the exact values 0 and 1 are accepted.
;   0 = normal logging
;   1 = additional technical details, including local paths
; Detail log: logs\tesmioloader.research_expansion.log
debug = 0

; Icons: the plugin keeps them in <loader>\vfs\media_soviet\research.
; Put <research_id>.png there (PNG, exactly 128 x 128 pixels, at most 4 MiB).
; A missing icon is created from noimage.png (research_expansion\icons beside
; the DLL, or plugins\research_expansion\noimage.png for installs without the
; Workshop). The old keys icon_folder and noimage_name are ignored.


; ----------------------------------------------------------------------------
; Research blocks
; ----------------------------------------------------------------------------
; Each block starts with $RESEARCH <unique_id> and ends with $RESEARCH_ADD.
;
; Research IDs:
;   - may contain only ASCII letters, digits and '_'
;   - must be unique; comparisons are case-insensitive
;   - also determine the optional icon name <research_id>.png
;
; Mandatory fields:
;   $RESEARCH <id>
;   exactly one of $TYPE_TECHNICAL, $TYPE_SOVIET or $TYPE_MEDICAL
;   $COST <positive_integer>    allowed range: 1 .. 2147483647
;   $NAME <namespace.key>
;   $DESC <namespace.key>
;   $RESEARCH_ADD
;
; $NAME and $DESC must resolve through the Localization plugin. Their numeric
; IDs must be inside the reserved range 2,000,000 .. 2,999,999.
;
; Supported optional directives are listed in the README. Unknown directives,
; missing or unexpected values, and duplicate directives are rejected.
; Unlock directives may be repeated with different values; identical lines are
; rejected. Optional game-directive values must still be valid WRSR identifiers
; or values: the plugin checks their presence and duplication, but not every
; game-specific meaning.
;
; Dependencies:
;   +<existing_research_id> adds $UNLOCK_RESEARCH <new_id> to that research.
;   Several + lines form an AND condition. Dependencies must exist and may not
;   be duplicated, self-referential or circular.
;   $AVAILABLE and $AVAILABLE_NO_GARBAGE cannot be combined with dependencies.
;   Native + lines are preserved in the generated research.ini.
;
; Unlock position (internal commands, never copied into the game file):
;   @before_<research_id> or @after_<research_id>
;   Applies to the most recent +dependency in this new research block.
;   At most one position is allowed per +dependency. The parent must contain
;   exactly one $UNLOCK_RESEARCH <research_id> anchor. No position means the
;   usual insertion immediately before $RESEARCH_ADD.
;   All automatic unlocks are created first, then positioned in INI order.
;   Repeated insertions at the same anchor retain INI order. Conflicting
;   positions, missing/ambiguous anchors and self anchors are rejected.
;
; A line made only of dashes is accepted as an optional visual separator. When
; used inside a research block, it is copied into the generated research.ini.
; Lines beginning with '-' and containing a directive are reserved for the
; Vanilla research.ini and are rejected here.
;
; ----------------------------------------------------------------------------
; Example with dependency on a Vanilla research.
; Remove the leading ';' from every line to enable the complete block.
; ----------------------------------------------------------------------------
;
; $RESEARCH advanced_quartz_processing
; +engineering_1
; ---------------------------------------
; $TYPE_TECHNICAL
; $COST 2400
;
; $UNLOCK_BUILDING_PRODUCTION quartz
;
; $NAME research_expansion.advanced_quartz_processing.name
; $DESC research_expansion.advanced_quartz_processing.desc
;
; $RESEARCH_ADD
;

; ----------------------------------------------------------------------------
; Positioned research example (disabled by comments).
; This uses keys from the research_expansion localization package.
; ----------------------------------------------------------------------------
;
; $RESEARCH quartz_smasher
; +faculty_geology
; @before_uranium_study
; ---------------------------------------
; $TYPE_TECHNICAL
; $COST 1800
; $UNLOCK_BUILDING_PRODUCTION raw_quartz
; $NAME research_expansion.quartz_smasher.name
; $DESC research_expansion.quartz_smasher.desc
; $RESEARCH_ADD
;

; ----------------------------------------------------------------------------
; [research:<id>]  A new research as an INI section
; ----------------------------------------------------------------------------
; The same as a $RESEARCH block, written as keys so Republic Mod Manager can
; edit it. Both forms may be mixed; sections are validated by the same rules
; and are placed after the free blocks. Keys:
;   enabled  = 0 or 1 (default 1; 0 keeps the section but applies nothing)
;   type     = technical, soviet or medical
;   cost     = positive whole number
;   name     = <key>   desc = <key>   (optional: a bare word becomes
;              research_expansion.<word>.name / .desc, nothing means the research
;              id; a key with dots is used as it is)
;   requires = <research_id> | before/after/normal | <anchor research_id>
;              one line per dependency; before/after place the automatic
;              $UNLOCK_RESEARCH line in that dependency next to the anchor
;   unlock   = $UNLOCK_... line (repeatable)
;   line     = any other directive line, copied as it is (repeatable)
;
; [research:quartz_smasher]
; requires = faculty_geology | before | uranium_study
; type = technical
; cost = 1800
; unlock = $UNLOCK_BUILDING_PRODUCTION raw_quartz
;
; (name and desc left out = research_expansion.quartz_smasher.name / .desc)

; ----------------------------------------------------------------------------
; [modify:<research_id>]  Changes to one existing Vanilla research
; ----------------------------------------------------------------------------
; Only the generated VFS copy is edited. Original game files are never written.
; One section per research ID; IDs are matched case-insensitively. Missing,
; deactivated or ambiguously named Vanilla targets are rejected.
; Sections can be used without adding any new research or supplying new icons.
; The Localization service remains mandatory.
;
; enabled = 1     Apply this section (default).
; enabled = 0     Skip this section; its syntax must still be valid.
;
; Supported operations (always use '='):
;   remove        = complete existing line
;   replace       = complete existing line | new single line
;   add           = new single line
;   insert_before = unique anchor line | new single line
;   insert_after  = unique anchor line | new single line
;   move_before   = complete existing line | unique anchor line
;   move_after    = complete existing line | unique anchor line
;   cost          = new research points: replaces the block's single $COST line
;
; Repeated operation keys are allowed and run in file order, AFTER automatic
; + unlock insertion and @ positioning. Later operations see earlier changes.
; 'add' inserts immediately before $RESEARCH_ADD. move_* keeps the existing
; line unchanged. Matching ignores outer whitespace but requires the complete
; line, including case and internal spacing. No partial or wildcard matches.
; '|' is reserved as the operand separator and cannot appear inside operands.
;
; $RESEARCH / $RESEARCH_ADD cannot be removed, replaced, added or moved.
; They may serve as anchors only if the result stays inside the same block.
; New lines may be supported game directives, native +dependencies or dash
; separators. + lines added here are literal edits: no automatic reverse
; $UNLOCK_RESEARCH is created for them. @ commands are not edit operands.
; No duplicate directives/unlocks are allowed; dash separators may repeat.
;
; $NAME / $DESC: positive numeric Vanilla IDs below 2,000,000 remain allowed.
; For new plugin texts use namespace.key; the Localization service must resolve
; the key inside 2,000,000 .. 2,999,999. Resolved lines contain numeric IDs.
; Existence of a manually chosen Vanilla text ID is the author's responsibility.
;
; Final validation checks required fields, conflicting directives, new research
; links and newly created cycles (both + and $UNLOCK_RESEARCH are considered).
; Unknown existing Vanilla directives are preserved, not accepted as new lines.
; Any error rejects the ENTIRE generated extension, not only the current edit.
; Enable [general] debug = 1 for staged operations and placement details.
;
; Example (disabled by comments; adjust values against your original file):
;
; [modify:faculty_geology]
; enabled = 1
; replace = $COST 1500 | $COST 1800
; move_before = $UNLOCK_RESEARCH uranium_study | $UNLOCK_RESEARCH bauxite_study
;
; ----------------------------------------------------------------------------



