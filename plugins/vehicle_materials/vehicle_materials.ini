; ============================================================================
;  Vehicle Materials Plugin 0.4.0 - Configuration
;  Keep this INI beside vehicle_materials.dll (local plugins or Workshop hooks).
;  tesmioloader\build\plugins\vehicle_materials.ini wins over the INI beside
;  the DLL; build\user_config\vehicle_materials.ini (Tesmio Settings) is laid
;  over either, key by key.
; ============================================================================
;  This file selects mod resources used when the game produces vehicles.
;  resources.ini remains the authoritative list of resources available to the
;  game; this file only assigns vehicle-category coefficients to those names.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings
;    - Section and key names are case-insensitive
;    - Every active setting requires a non-empty value
;    - Unknown or repeated sections and keys are rejected
;    - A line containing only '-' characters is accepted as a separator
;
;  Safety and fallback behavior:
;    - Original game files and native vehicle materials are NEVER modified.
;    - The complete configuration is validated before the hook is installed.
;    - Any validation, dependency or game-build error rejects the whole plugin.
;    - A protected runtime fault disables only custom material additions for
;      the rest of the session; native vehicle production remains active.
;    - Configuration changes require a game restart, but no DLL rebuild.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Resources plugin and plugins\resources.ini (mandatory)
;    - Tested with WRSR 1.1.1.9
;
;  Limits:
;    - Maximum configuration size: 1 MiB
;    - Maximum resources: 32
;    - Maximum key or value length: 63 characters
;    - Coefficients: finite numbers from 0 to 1,000,000
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable plugin. Only the exact values 0 and 1 are accepted.
enabled = 1

; Diagnostic logging. Only the exact values 0 and 1 are accepted.
;   0 = normal logging
;   1 = configured materials and vehicle-build details
; Detail log: logs\tesmioloader.vehicle_materials.log
debug = 0

; Shared maximum for repeated runtime warnings and diagnostic messages.
; Allowed range: 0 .. 10000. A value of 0 suppresses those repeated messages.
debug_limit = 80


; ----------------------------------------------------------------------------
; [resources]  Resources used for vehicle production
; ----------------------------------------------------------------------------
[resources]

; Number of consecutive resource0, resource1, ... entries below.
; Allowed range: 0 .. 32. Entries at or above count are rejected.
count = 2

; Each name must be unique and must exist in plugins\resources.ini.
; Unsafe characters, whitespace and path separators are rejected.
resource0 = glass
resource1 = cable

; Example extension:
; resource2 = copper
; resource3 = composites
; Then set count = 4 and add their category coefficients below.


; ----------------------------------------------------------------------------
; Vehicle categories - consumption coefficients
; ----------------------------------------------------------------------------
; Only names listed in [resources] are accepted as keys.
; A missing coefficient or the exact value 0 disables that resource for the
; respective category. Negative, non-finite and malformed values are rejected.
; Sections must remain present even when they contain no active coefficients.
; ----------------------------------------------------------------------------

[road]
; Road vehicles
glass = 0.030
cable = 0.004

[rail]
; Rail vehicles and trains
glass = 0.025
cable = 0.006

[ship]
; Ships
glass = 0.005
cable = 0.008

[airplane]
; Airplanes
glass = 0.015
cable = 0.010


; ----------------------------------------------------------------------------
; [mapping]  Optional vehicle-type overrides
; ----------------------------------------------------------------------------
; Automatic detection:
;   Type 1 -> road
;   Type 6 -> ship
;   Type 7 -> airplane
;   Other production types -> rail
;
; Values:
;   -1 = automatic
;    0 = road
;    1 = rail
;    2 = ship
;    3 = airplane
;
; Unknown type keys and values outside -1 .. 3 are rejected.
; Omitted type keys default to -1. Normally leave this section unchanged.
; ----------------------------------------------------------------------------
[mapping]
type0 = -1
type1 = -1
type2 = -1
type3 = -1
type4 = -1
type5 = -1
type6 = -1
type7 = -1
type8 = -1
type9 = -1
type10 = -1
type11 = -1
type12 = -1
type13 = -1
type14 = -1
type15 = -1
