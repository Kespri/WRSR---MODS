; deposits_plus - deposit types the base game does not have. UTF-8, no BOM.
;
; Read by plugins\deposits_plus.dll, and it is the whole of that feature's
; configuration: [deposits_plus] is what the plugin is allowed to touch, and every
; other section is a deposit. Adding one is adding a section - no source change,
; and the same table drives all three subsystems: the code patch that teaches
; the engine the type, the minimap layer, and the terrain editor's brush.
;
; Deleting the DLL removes mod deposits entirely - and with them the registry
; other plugins read, so depletion falls back to the base game's own five.


[deposits_plus]

; ---------------------------------------------------------------------------- changed by deposits_plus
; Optional read-only sandy meadow surface over the independent Sand deposits.
; 0 restores native visuals after a full restart; no save/map data is changed.
sand_surface = 1
sand_surface_strength = 1.0
sand_surface_token = $TYPE_MINE_SAND
; Which sand pair covers which terrain base texture: the [sand_tile:<id>] sections
; at the end of this file (0.4.1). Winter stays native everywhere.

; Natural deposits inside the country: check ALL resources after EACH world load.
generation = 1
; Initialize unrecorded empty resources and resume previously skipped-empty ones.
; Existing/adopted/generated resources are NEVER refilled, even when exhausted.
; 0 protects legacy/pending empty channels if their earlier mining history is unknown.
; Without metadata, an empty channel cannot prove that it was never mined.
generate_existing_empty = 1
; 0 chooses a random seed for a new world; nonzero gives reproducible generation.
generation_seed = 0
generation_gap_m = 40
generation_shore_m = 40
generation_water_clearance_m = 2
; 1 = treat the terrain's gravel/rock layer as an occupied deposit too. Off by default (0.4.4):
; mountain maps such as Siberia paint that layer over most of the land and new fields found no room.
generation_block_gravel = 0

; Optional settings in EACH resource section (these are the defaults):
; generation = 1
; generation_frequency = 3
; generation_size = 2
; Frequency 1..6 -> 1, 2, 3, 4, 5, 6 whole deposit regions.
; Size 1/2/3 -> base-radius ranges 150..350 / 350..550 / 550..750 metres.
; Natural regions can be elongated/branched: this is NOT a circular boundary.
; Several separated pieces of one region count as ONE region, not extra fields.
; generation=0 disables first placement, never removes existing resources.
; desert_fill = 0
; desert_fill=1 (0.4.1): on a map whose script.ini says $TYPE_DESERT the whole land
; becomes this deposit instead of random regions - once, when the deposit's map is
; first created; saved deposits are never refilled. Infinite unless the Depletion
; plugin mines it down. Such a deposit never blocks the other deposits' placement.
; desert_fill_min = 60 / desert_fill_max = 100 (0.4.6): richness band in percent on
; the lowest land, varied by noise so the fill looks organic.
; desert_fill_relief = 1 (0.4.6): the richness falls with terrain height from the
; band on the lowest land to 0 on the highest; 0 = the band over the whole land.
; New settings affect uninitialized resources ONLY. Saved deposits stay unchanged.
; Materials take turns; no preference from section order or alphabetical name.
; Water, shore, country boundary and existing deposits remain excluded.
; Clipping is allowed only when at least 60% of the field area remains usable.
; If a target cannot be reached, the log reports separate rejection causes.
;
; Richness is independent of frequency and size:
; generation_richness_min = 0.45
; generation_richness_max = 1.00
; All radius/distance values are metres; richness is 0..1 (not percent).
; No hot reload: edit INI, restart the game, then load the saved world.
; Keep token/type stable and keep tesmio_deposits.bin with your saved games.
; ---------------------------------------------------------------------------- changed by deposits_plus

; Splice the declared deposit types into the executable, so their tokens work in
; building.ini and their mines find and size their deposits. This is the only
; part of the project that emits instructions; it verifies all three sites
; against the supported v1.1.1.9 bytes and refuses if any differs.
code_patch = 1

; Add a minimap button and overlay layer per deposit that asks for one, below
; the base game's five: hovering previews the layer, a click keeps it on (0.4.5).
; Purely additive inline hooks on the button-row and overlay-draw functions; the
; vanilla buttons are untouched.
minimap = 1

; Add a paint/erase pair per deposit that asks for one to the terrain editor's
; Resources tab. Four additive inline hooks; the engine's own brush does the
; work, so no code is patched.
editor = 1


; ---------------------------------------------------------------- the deposits
;
; One section per deposit. The section name is the deposit's name; "deposits_plus" is
; the one name it may not have, because that section is the settings above.
;
;   token          The building.ini token that selects this deposit, e.g.
;                  $TYPE_MINE_COPPER. Required. Use it in a mine's building.ini
;                  exactly like $TYPE_MINE_BAUXITE.
;
;   type           The deposit type number the engine keys everything on.
;                  Required, and must be 10 or above: 0-9 belong to the base
;                  game. The upper bound is 127, because every comparison the
;                  patch splices in takes a sign-extended imm8.
;
;   map            Which 1024x1024 map this deposit's channel lives in. The game
;                  ships two with every terrain, resourcemap and resourcemap2,
;                  and keeps one deposit per colour channel with richness as the
;                  byte value. Default resourcemap2.
;
;                  resourcemap3, resourcemap4 ... up to resourcemap10 are maps
;                  THIS PLUGIN creates. It loads <terrain>/resourcemapN.dds
;                  beside the game's own two, or a blank one if the terrain has
;                  none, and writes it back with them on save. Nothing in the
;                  engine has to be taught about them: the sampler takes a
;                  texture pointer, the editor's brush takes one out of the game
;                  object, and both are reachable. So the eight channels are not
;                  a ceiling any more - they were only ever two textures times
;                  four components.
;
;                  auto  picks the next free channel by itself, always in a map
;                  past the engine's two, so a new deposit needs no thought about
;                  channels at all. It deliberately does not hand out the two
;                  free vanilla channels - see the table below for why.
;
;                  terrain  is not a resource map at all: it is the terrain's own
;                  material mask, the splat map the ground textures blend
;                  through, and where GRAVEL lives. A deposit there is mined out
;                  of the ground itself, so working it visibly wears the surface
;                  away - which is what a gravel pit or a sand pit looks like.
;                  Its brush goes in the editor's ROCKS tab beside the rock and
;                  oasis ones, not in the Resources tab, because that is the
;                  primitive it uses.
;
;                    component 0   a ground layer, no deposit
;                    component 1   a ground layer, no deposit
;                    component 2   a ground layer - gravel's, and the rock brush's
;                    component 3   a ground layer - the oasis brush's
;
;                  **None of these is a free channel.** All four are ground
;                  layers that the terrain already blends, and each is a texture
;                  the map is painted with - that is the whole point of putting a
;                  deposit here rather than in a resource map. Gravel works this
;                  way too: the rock you paint *is* the deposit. So a deposit on
;                  component 1 is mined wherever layer 2 is painted, and layer 2
;                  looks like whatever <terrain>/material.mtl says it does.
;
;                  Which layer looks like sand is therefore a question about the
;                  terrain, not about this file. See docs/05-deposits.md for how
;                  to give a layer a texture of its own.
;
;   component      0-3, which channel of that map. Required unless map = auto,
;                  which assigns one.
;
;   building_type  What the parser sets alongside the deposit type. 7 is a mine,
;                  which is almost certainly what you want; water wells are 92.
;                  Default 7.
;
;   radius         How far the mine searches for its deposit. Naming one of the
;                  game's own constants - oil, ore, bauxite, gravel, wood, water,
;                  watersurface - copies its value at startup, so the mod tracks
;                  the game if a patch ever changes it. A number is taken
;                  literally. Default ore, which iron, coal and uranium share.
;
;                  This is not optional in practice. A type the radius table
;                  does not know searches nothing, the average over an empty set
;                  is NaN, and the building window shows quality of source as
;                  -2147483648.
;
;   icon           Resource whose icon the minimap button uses, taken straight
;                  out of its record - so a resource declared in
;                  plugins\resources.ini needs no extra art. Omit for no icon.
;
;   minimap        1 to add a minimap button and overlay layer (hover previews,
;                  click keeps), 0 for none.
;                  Default 1.
;
;   editor         Base name for the terrain editor's paint/erase pair:
;                  "copper" draws the pair with
;                  vfs/media_soviet/editor/tool_paint_copper.png and
;                  tool_erase_copper.png. Omit for no brush.
;
;                  Up to 31 characters, letters, digits, _ and - . The name is
;                  only the two file names: the editor's own key for the pair
;                  is built from the deposit's type number, so the name may be
;                  as long and as plain as you like.
;
;   deplete        Read by the depletion plugin, not by this one, which keeps it
;                  verbatim and hands it over through the deposit service. A
;                  number is the tonnes of mine output one fully saturated texel
;                  of this deposit is worth, overriding tonnes_per_texel in
;                  plugins\depletion.ini; 0 exempts the deposit and leaves it
;                  infinite. Omit to take the global figure.
;
;
; WHICH CHANNELS ARE ACTUALLY FREE
;
; Eight exist in the maps the game ships. Measured over every one of them -
; campaign1, campaign2, terrain3-6, terrain_svk, terrainblank and all eighteen
; tutorial maps:
;
;   resourcemap  component 0   oil        taken
;   resourcemap  component 1   iron       taken
;   resourcemap  component 2   coal       taken
;   resourcemap  component 3   -          FREE, but see below
;   resourcemap2 component 0   uranium    taken
;   resourcemap2 component 1   bauxite    taken
;   resourcemap2 component 2   -          carries data on about half the maps,
;                                         and the minimap has a sixth layer flag
;                                         for it with no button. Avoid.
;   resourcemap2 component 3   copper     taken by the section below
;
; resourcemap component 3 holds no spatial data on any shipped map: it is either
; all 255 or all 0, never anything in between, which is what an unused alpha
; channel looks like. It is usable, with one caveat - on the maps where it is
; 255 a deposit assigned to it reads as maximum richness everywhere until
; something clears it. Paint over it in the editor, or ship a replacement map
; through the VFS. That caveat is exactly why `map = auto` skips it: a deposit
; that silently reads "richest possible" on every texel of half the terrains is
; not a sensible default, however free the channel technically is.
;
; Past those eight, a new map starts blank and has all four of its channels
; free, so `map = auto` is the shortest correct answer for anything new.

[copper]
token                 = $TYPE_MINE_COPPER
generation            = 1
generation_frequency  = 3
generation_size       = 2
working_vehicle_skill = gravelmining
type                  = 10
map                   = resourcemap2
component             = 3
radius                = ore
building_type         = 7
icon                  = copper_ore
minimap               = 1
editor                = copper

; A worked example of a deposit in a map this plugin creates. Everything except
; `map` is what it would be on a vanilla channel - the type is spliced in the
; same way, the mine reads it through the same sampler, the minimap and the
; editor brush behave identically. Automatic generation initializes the new
; resource once; generation=0 allows manual placement instead.
;
; Uncomment to try it. It needs a `nickel_ore` resource in plugins\resources.ini
; for the minimap icon, a mine whose building.ini says $TYPE_MINE_NICKEL, and
; two 96x96 PNGs at vfs/media_soviet/editor/tool_paint_nickel.png and
; tool_erase_nickel.png - without them the buttons keep bauxite's icon and the
; brush still works.
;
; [nickel]
; token                 = $TYPE_MINE_NICKEL
; working_vehicle_skill = none
; type                  = 11
; map                   = auto
; radius                = ore
; icon                  = nickel_ore
; minimap               = 1
; editor                = nickel

; ---------------------------------------------------------------------------- changed by deposits_plus
; Sand keeps its LEGACY terrain mapping below for controlled first adoption.
; independent_map=1 allocates a separate resource channel AFTER old auto entries.
; Existing save sand is copied there (area-averaged to resource-map resolution).
; New worlds receive random sand. Terrain appearance is never repainted and
; sand depletion no longer erodes the visual terrain mask. The editor brush
; now belongs to the Resources tab. Keep independent_map enabled afterwards.
; desert_fill=1: a $TYPE_DESERT map is all sand (0.4.1), 60..100% in the lowlands
; and thinning out with height (0.4.6).
[sand]
token                 = $TYPE_MINE_SAND
generation            = 1
generation_frequency  = 5
generation_size       = 3
independent_map       = 1
desert_fill           = 1
desert_fill_relief    = 1
desert_fill_min       = 60
desert_fill_max       = 100
working_vehicle_skill = gravelmining
type                  = 11
map                   = terrain
component             = 1
radius                = gravel
icon                  = sand
minimap               = 1
editor                = sand
; ---------------------------------------------------------------------------- changed by deposits_plus

[clay]
token                 = $TYPE_MINE_CLAY
generation            = 1
generation_frequency  = 4
generation_size       = 3
working_vehicle_skill = gravelmining
type                  = 12
map                   = auto
radius                = ore
icon                  = clay
minimap               = 1
editor                = clay

[gas]
token                 = $TYPE_MINE_GAS
generation            = 1
generation_frequency  = 1
generation_size       = 3
type                  = 13
map                   = auto
radius                = ore
icon                  = gas
minimap               = 1
editor                = gas

; ---------------------------------------------------------------------------- changed by deposits_plus
; Sand surface tiles (0.4.1). One section per terrain base texture: `base` is the
; texture the map's material.mtl / material_fall.mtl names on slot 5, folder
; included; `color` and `normal` are DDS files under deposits_plus\assets, set
; folders allowed since 0.4.2 ("Siberia/sand_meadow_siberia_color.dds"; no "..",
; no absolute paths). Square, power of two 256..4096, full mip chain; colour DXT1,
; normal DXT5. A base without a section, or a section whose files are missing,
; stays native - winter always does. The "Ultimate Vanilla +" set fits that
; Workshop texture pack: point the meadow entries at its files when you use it.
; Republic Mod Manager offers the files as a list on the Sand tiles tab.
[sand_tile:meadow]
base   = tiles_normal/grass2.dds
color  = Vanilla/sand_meadow_color.dds
normal = Vanilla/sand_meadow_normal.dds

[sand_tile:meadow_autumn]
base   = tiles_normal/grass2_fall.dds
color  = Vanilla/sand_meadow_autumn_color.dds
normal = Vanilla/sand_meadow_autumn_normal.dds

[sand_tile:siberia]
base   = dlc2/tiles_siberia/grass2.dds
color  = Siberia/sand_meadow_siberia_color.dds
normal = Siberia/sand_meadow_siberia_normal.dds

[sand_tile:siberia_autumn]
base   = dlc2/tiles_siberia/grass2snow.dds
color  = Siberia/sand_meadow_autumn_siberia_color.dds
normal = Siberia/sand_meadow_autumn_siberia_normal.dds

[sand_tile:jungle]
base   = dlc2/tiles_asia/jungle_swamp_dm.dds
color  = Asia - Jungle/sand_meadow_jungle_color.dds
normal = Asia - Jungle/sand_meadow_jungle_normal.dds
