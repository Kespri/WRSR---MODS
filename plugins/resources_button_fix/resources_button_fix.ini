; ============================================================================
;  Resources Button Fix 0.4.0 - Configuration
; ============================================================================
;  File format    : UTF-8 without BOM
;  Game version   : WRSR 1.1.1.9 only
;  TesmioLoader   : API 4
;
;  This plugin arranges the tool buttons in two terrain-editor windows:
;
;    [resources_window] = Resources
;    [rocks_window]     = Rocks/Gravel
;
;  Tree buttons and all other editor windows remain unchanged.
;  Original game files are never edited.
;
;  VALIDATION AND SAFETY:
;  - Keep exactly one [general], [resources_window], and [rocks_window].
;  - Do not repeat keys and do not add unknown sections or keys.
;  - Every setting must have a value; enabled/debug flags accept only 0 or 1.
;  - Use full-line comments beginning with ';'. Do not use inline comments.
;  - Missing individual settings use the compiled defaults.
;  - The INI may not exceed 16 MiB; individual values may not exceed 63
;    characters.
;  - Invalid startup configuration prevents the plugin from patching the game.
;
;  LIVE CHANGES:
;  You can edit and save this file while the game is running. Open either
;  supported window again to see the new layout. A reload is atomic: if the
;  complete file is not valid, all previous valid settings remain active.
;  Only [general] enabled requires a complete game restart.
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable the complete plugin
;   1 = on
;   0 = off (requires a game restart)
enabled = 1

; Additional diagnostic messages in tesmioloader.log
;   0 = normal gameplay
;   1 = detailed layout information for troubleshooting
debug = 0


; ----------------------------------------------------------------------------
; [resources_window]  Main Resources window
; ----------------------------------------------------------------------------
[resources_window]

; Enable changes only for the Resources window
;   1 = on
;   0 = use the original game layout
enabled = 1


; --- Button arrangement -----------------------------------------------------

; Number of resource pairs placed beside each other in one block
; Each pair contains one paint button and its matching erase button.
; Allowed values: 1 to 32
columns_per_block = 6

; Maximum number of paint/erase blocks placed below each other
; Capacity = columns_per_block x maximum_blocks
; Example: 6 columns x 2 blocks = room for 12 resources
; Allowed values: 1 to 4
maximum_blocks = 2

; Button size
;   auto = choose a suitable size automatically
;   0.50 = use exactly 50 percent of the original size
; Manual values may be between 0.25 and 1.00.
button_scale = auto

; Distance between buttons in the same row
;   1.00 = normal distance for the selected button size
horizontal_spacing = 1.00

; Distance between the paint row and its erase row
;   1.00 = normal distance for the selected button size
vertical_spacing = 1.00

; Extra distance between one complete paint/erase block and the next
;   0.00 = no additional block gap
block_gap = 0.35


; --- Grid position ----------------------------------------------------------

; Move the complete resource-button grid
; Positive x moves it right. Positive y moves it down.
x_offset = 0.00
y_offset = 0.00


; --- Window and delete-all button ------------------------------------------

; Let the window grow when additional button blocks need more room
;   1 = move the controls below the grid and grow the window
;   0 = keep the original window height and make the buttons fit
expand_window = 1

; Position of the round red delete-all button
;   below_grid = place it below the final resource-button block
;   original   = keep the original game position
; below_grid is recommended when expand_window = 1.
cancel_position = below_grid

; The two visible gaps are arranged like this:
;
;   [resource buttons]
;          |  grid_to_cancel_gap
;      [red X button]
;          |  cancel_to_brush_gap
;        Brush

; Visible space between the final resource button and the red X button
; Used when expand_window = 1 and cancel_position = below_grid.
; Allowed values: 0.00 to 100.00
grid_to_cancel_gap = 10.00

; Visible space between the red X button and the Brush controls
; The red button keeps its original size and complete clickable area.
; Allowed values: 0.00 to 100.00
cancel_to_brush_gap = 40.00

; Fine adjustment for the red X button
; Positive x moves only the button right.
; Positive y moves the button and all following controls down.
cancel_x_offset = 0.00
cancel_y_offset = 0.00


; ----------------------------------------------------------------------------
; [rocks_window]  Rocks/Gravel window
; ----------------------------------------------------------------------------
[rocks_window]

; Enable changes only for the Rocks/Gravel window
;   1 = on
;   0 = use the original game layout
enabled = 1

; Additional terrain tools from deposits.dll, such as Sand, are included
; automatically.


; --- Button arrangement -----------------------------------------------------

; Arrange each paint button (P) and matching erase button (E)
;
;   blocks = 1          blocks = 2
;   P E  P E            P P
;                       E E
blocks = 2

; Button size
;   auto = choose a suitable size automatically
;   0.50 = use exactly 50 percent of the original size
; Manual values may be between 0.25 and 1.00.
button_scale = auto

; Horizontal and vertical distance between the arranged buttons
;   1.00 = normal distance for the selected button size
horizontal_spacing = 1.00
vertical_spacing = 1.00


; --- Grid position ----------------------------------------------------------

; Move the complete Rocks/Gravel button grid
; Positive x moves it right. Positive y moves it down.
x_offset = 0.00
y_offset = 0.00


; --- Window size and following controls ------------------------------------

; Let the window grow when the arranged buttons need more room
;   1 = move the Brush controls below the grid and grow the window
;   0 = keep the original window height and make the buttons fit
expand_window = 1

; Visible space between the bottom of the tool grid and Brush
; The game's internal spacing is handled automatically.
; Used only when expand_window = 1.
; Allowed values: 0.00 to 100.00
controls_gap = 20.00
