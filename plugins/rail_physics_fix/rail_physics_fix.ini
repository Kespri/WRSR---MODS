; ============================================================================
;  RailPhysics Plugin 1.3.5 - Configuration
; ============================================================================
;  Windows/TesmioLoader port of RailPhysics 1.3.0.
;  Changes rail dynamics through in-memory hooks, not generated game files.
;
;  File format:
;    - UTF-8 without BOM; decimal point, not decimal comma
;    - Use ';' for full-line comments; keep setting lines free of comments
;    - Keep the original [railphysics] section name
;    - Use each key once and write switches as 0 or 1
;
;  Requirements:
;    - Windows x64, TesmioLoader API 4
;    - SOVIET64.exe 1.1.1.9 / b23935965 (exact supported executable)
;    - Do not load the original railphysics.dll alongside rail_physics_fix.dll
;    - No Localization plugin, language package or VFS content is required
;
;  Safety and fallback behavior:
;    - No original game file is patched on disk.
;    - Changed positions, speeds and consumption can enter normal game saves.
;    - Restart the game to apply configuration changes or disable hooks.
;    - A failed compatibility preflight installs no hooks.
;    - Partial installation is logged; do not unload a DLL with active hooks.
;    - Test this beta with a COPY of a save; no completed in-game test of this
;      port is recorded in the supplied build evidence.
;
;  Current validation:
;    - Missing settings use CODE defaults, not necessarily the supplied values.
;    - Missing/unreadable INI can fall back to defaults, including enabled = 1.
;    - Invalid/non-finite floating-point values use defaults with RP201.
;    - power_scale and grid_boost have the specific handling described below.
;    - There is NO complete schema/range/duplicate validation. Recommendations
;      in these comments are not additional checks implemented by the plugin.
;    - Numeric values use a 64-byte read buffer. Keep values short; overlong
;      text is not reliably rejected as truncation by the current code.
;
;  Logs (relative to the TesmioLoader base directory, normally build):
;    - tesmioloader.log
;    - logs\tesmioloader.rail_physics_fix.log (opened when this INI enables the plugin)
;  See README_DE.md / README_EN.md for configuration, limits and diagnostics.
; ============================================================================

; ----------------------------------------------------------------------------
; [railphysics]  General settings and feature switches
; ----------------------------------------------------------------------------
[railphysics]

; 0 = no hooks; 1 = enabled. Default if missing: 1.
; Restart the game after changing this or any other setting.
; Deleting only the INI does NOT disable the plugin: code defaults are used.
enabled = 1

; 0 = native acceleration call; 1 = physical acceleration model.
; The model includes grade even when the separate slope hook is disabled.
accel = 1

; 0 = native brake site; 1 = custom brake helper.
; Keep enabled for braking rates matched to the plugin's lookahead model.
brake = 1

; 0 = native slope sites; 1 = the port's separate slope hooks.
; The existing 1.1.1.9 branch behavior is retained, not rebalanced.
; This switch does not remove grade from the accel/fuel physics model.
slope = 1

; 0 = native fuel calls; 1 = mechanical-load model.
; The game's fuel tank, refuelling and economy functions remain in use.
; This changes consumption; it does not add a separate fuel/save system.
fuel = 1

; 0 = no custom route limit; 1 = curve/route lookahead enabled.
; Required for stations, smoothstop and customstop to affect speed limits.
; Existing native speed limits are not raised.
curves = 1

; Requires curves = 1. Caps detected cargo, passenger and waiting-station
; track at station_limit_kmh, including trains passing through.
; The zone follows the train head, not the entire consist.
; Chain-local station track can be detected late on through routes.
stations = 1

; Requires curves = 1. Uses a route-end position match against detected
; station nodes, rather than unverified stop-intent flags.
; Hands the final approach to native logic at approximately 25 m.
; Unrecognised stop types do not get this additional early-stop estimate.
smoothstop = 1

; Requires curves = 1. Combines customs zones, route-end position matches
; and track-graph corridors (up to 8000 m).
; Uses customs_entry_kmh for the entry and a separate final-stop estimate.
; Station/customs tables are rebuilt at the regular 30-second interval.
customstop = 1


; ----------------------------------------------------------------------------
; Customs entry
; ----------------------------------------------------------------------------

; Customs entry target, km/h. Code default: 50.0.
; Used with customstop = 1 and curves = 1. Use a positive speed.
customs_entry_kmh = 50


; ----------------------------------------------------------------------------
; Curve and station lookahead
; ----------------------------------------------------------------------------

; Detected station-zone limit, km/h. Code default: 30.0.
; The supplied value is 60; missing this key does not preserve that value.
; Used with stations = 1 and curves = 1. Use a positive speed.
station_limit_kmh = 60

; Lateral acceleration used in curve speed = sqrt(a_lat * radius), m/s^2.
; Code default: 0.9. Higher values permit higher curve speeds.
; Use a positive value. This is a tuning parameter, not a cant simulation.
curve_lateral_ms2 = 1.4

; Lookahead uses max(service_brake_ms2, 0.05) / max(this value, 1.0).
; Code default: 1.25. At equal brake settings, 1.25 plans with 80% of
; the rate and therefore a longer stopping distance. Not a validation range.
curve_brake_margin = 1.25

; Base route lookahead, metres. Code default: 1200.0.
; It grows with calculated stopping distance plus 150 m, but is capped
; at 8000 m. Values above 8000 do not increase the effective horizon.
; A larger setting cannot extend route data the game has not provided.
curve_lookahead_m = 1200

; 0 = off; 1 = curve/station/customs diagnostics, including raw structure
; samples. Output is event/change driven, not a fixed line per second.
; Requires the relevant route functions to run. Can produce large logs.
log_curves = 0


; ----------------------------------------------------------------------------
; Traction and resistance
; ----------------------------------------------------------------------------

; Adhesion coefficient. Code default: 0.30. Use a positive value.
; Caps low-speed tractive effort by powered adhesive weight.
; No automatic rain/weather adjustment is added by this setting.
adhesion_mu = 0.30

; Engine-power multiplier. Code default: 1.0.
; Explicitly accepted range: 0.1 .. 5.0. Outside: RP202 and fallback 1.0.
; The supplied value is 1.5; it is not the code default.
; Low-speed adhesion can still limit acceleration.
power_scale = 1.5

; Davis constant term A, N per tonne. Code default: 1.5.
; R = mass_t * (A + B * speed_kmh) + C * speed_kmh^2.
; Use non-negative resistance coefficients.
davis_a = 1.5

; Davis linear term B, N per tonne per km/h. Code default: 0.006.
davis_b = 0.006

; Davis quadratic term C for the whole train, N per (km/h)^2.
; Code default: 0.40. Not a per-wagon coefficient.
davis_c = 0.40

; Scale applied to the game's average internal slope. Code default: 0.12.
; The supplied 0.06 halves the model's grade contribution relative to 0.12.
; This does not change terrain geometry or native route data.
grade_scale = 0.06


; ----------------------------------------------------------------------------
; Braking
; ----------------------------------------------------------------------------

; Service brake rate, m/s^2. Code default: 0.8; supplied value: 1.6.
; Also sets the lookahead braking budget. Use a positive value.
; The runtime helper adjusts the applied rate for the current situation.
service_brake_ms2  = 1.6

; Emergency brake rate, m/s^2. Code default: 1.3; supplied value: 2.6.
; Use a positive rate, normally at least service_brake_ms2.
; This relationship is guidance, not an enforced INI rule.
emergency_brake_ms2 = 2.6

; Native-rate floor outside planned curve/route-limit braking.
; Code default: 1.0. 0 disables this floor; 1 uses the native rate as floor.
; This is NOT a promise that every planned braking event is at least as
; strong as native braking. Planned approaches use their own modulation.
brake_min_vanilla_ratio = 1.0


; ----------------------------------------------------------------------------
; Fuel and electricity
; ----------------------------------------------------------------------------

; Idle load factor in the mechanical-load formula. Code default: 0.05.
; Use 0 .. 1 as a sensible tuning interval; this is not enforced by the
; current parser. 0 removes this model's idle-load contribution.
idle_load = 0.05

; Cap on the modelled fuel/energy load factor. Code default: 1.0.
; Positive values above 1 are supported for higher requested loads.
; Normally keep at least idle_load. Native bookkeeping still applies.
fuel_load_max = 1.0

; Grid-wide transfer-ceiling multiplier. Code default: 1.0.
; 1 = no extra grid hook; 1 < value <= 10 = apply multiplier.
; Values <= 1 leave the grid hook off; values > 10 are logged and refused.
; The supplied 2.0 affects the WHOLE electricity grid, not only trains.
; This does not create generation capacity or replace grid infrastructure.
grid_boost = 2.0

; Electric-traction demand multiplier, applied only when value < 1.
; Code default: 1.0. Use 0 .. 1; values >= 1 do not increase demand.
; Lowering it changes requested energy and the economy; it is not free
; physical efficiency. Requires fuel = 1. No complete range validation.
electric_load_scale = 1.0


; ----------------------------------------------------------------------------
; Diagnostic logging
; ----------------------------------------------------------------------------

; 0 = off; 1 = periodic physics/fuel samples and curve-cache statistics.
; The roughly 5-second sample timers are shared per message category,
; not one timer per train. Cache statistics use a 30-second interval.
log_physics = 0

; 0 = off; 1 = per-train decision events and approximately 1-second
; snapshots while a non-curve limiter is active. Requires curves = 1.
; Independent of log_curves/log_physics. Can produce large logs.
; Runtime warnings remain visible with all three diagnostic switches at 0.
log_decisions = 0

; ----------------------------------------------------------------------------
; Optional tuning examples from the upstream documentation
; ----------------------------------------------------------------------------
; These are PARTIAL examples, not selectable presets or verified settings for
; this Windows port. Unlisted keys keep their current values. The active values
; above are the supplied custom configuration, NOT the upstream balanced preset.
;
; Strict realism: power_scale = 1.0, curve_lateral_ms2 = 1.0, grid_boost = 1.0
; Balanced:       power_scale = 1.35, curve_lateral_ms2 = 1.4, grid_boost = 2.0
; Arcade:         power_scale = 1.6, curve_lateral_ms2 = 1.6, grid_boost = 2.5,
;                 brake_min_vanilla_ratio = 1.0
;
; Change only a few settings at a time, restart and compare on a separate save.
