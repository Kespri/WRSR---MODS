; ============================================================================
;  Weather Roads Plugin 0.3.3 - Configuration
; ============================================================================
;  Controls road-snow accumulation, natural melting and material-aware
;  protection after snowplowing. Basic snow and melting work without
;  Technical Services or a snowplow.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments; no comments after setting values
;    - Use a dot for decimal values and 0 or 1 for switches
;    - Keep section/key names unchanged; do not duplicate settings
;    - Restart the game completely after changing this file
;
;  Safety and fallback behavior:
;    - The plugin does not overwrite native game or save files.
;    - Runtime changes use verified hooks; no VFS override is generated.
;    - Optional protection data uses a separate file in the save folder.
;    - Unsupported game/engine builds are refused. An unavailable optional
;      component may leave other verified components active; check the log.
;    - Invalid known values are logged and replaced with compiled fallbacks.
;      Unknown/duplicate keys are not comprehensively validated by this build.
;    - [general] enabled = 0 disables the plugin on the next full restart.
;      Existing protection sidecars are not deleted.
;
;  Requirements:
;    - TesmioLoader API 4; reference game: WRSR 1.1.1.9, 64-bit
;    - Optional: compatible grit-spreader service from technical_service_storage
;    - No Localization plugin or text package is required for this plugin
;
;  Supplied settings:
;    - All active values below are the supplied defaults of this plugin.
;    - Keep the INI installed: missing keys use the DLL's compiled fallbacks.
;      In particular, a missing [overlay] enabled key falls back to 1, whereas
;      this file intentionally sets it to 0.
;
;  Logs: tesmioloader\build\logs\tesmioloader.weather_roads.log and tesmioloader.log
;  See README_EN.md / README_DE.md for dependencies, examples and troubleshooting.
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; 1 = enable Weather Roads
; 0 = disable the complete plugin after restarting the game
enabled = 1


; ----------------------------------------------------------------------------
; [snow]  Road-snow accumulation (works without a snowplow)
; ----------------------------------------------------------------------------
[snow]

; 1 = apply the accumulation settings below
; 0 = leave base accumulation unchanged; melting and plow effects remain
;     separately configurable
enabled = 1

; Multiplier for positive internal road-snow increments.
; 0.35 = 35% of the native increment; 1.00 = unchanged amount before the
; burst limit and material effects. 0.00 suppresses these positive increments.
; Allowed values: 0.00 to 10.00
accumulation_multiplier = 0.35

; Maximum scaled internal snow units forwarded within one grouped burst.
; Internal snow ranges from 0 to 255. This is a cap, not a guaranteed amount
; per snowfall: native calls, the multiplier and material treatment still matter.
; 0 = no additional burst cap. Allowed values: 0 to 255
maximum_accumulation_per_burst = 95

; 1 = queue verified weather increments and release them in small steps
; 0 = apply the scaled amount immediately
; Requires [snow] enabled = 1 and the relevant runtime hooks.
; Step timing and visible batching are configured in [advanced].
gradual_accumulation = 1

; 1 = drop whatever is still queued as soon as the game's winter weather roll is
;     no longer 1 (= snowing), so road snow stops together with the snowfall
; 0 = release the whole queue regardless of the weather (up to the burst maximum
;     at the [advanced] step rate, a few seconds at the defaults)
; Needs gradual_accumulation = 1. An unreadable weather object changes nothing.
release_follows_weather = 1


; ----------------------------------------------------------------------------
; [melting]  Natural road-snow reduction
; ----------------------------------------------------------------------------
[melting]

; 1 = scale the verified native -30 melting increment
; 0 = leave that native reduction unchanged
; Full -255 resets and other negative increments are not scaled.
enabled = 1

; Multiplier for the verified natural melting increment.
; 0.45 = 45% of the native reduction; 1.00 = unchanged reduction.
; 0.00 suppresses this melting path, not snowplowing or full snow resets.
; Allowed values: 0.00 to 10.00
reduction_multiplier = 0.45


; ----------------------------------------------------------------------------
; [visual_snow]  Appearance of tracked road-mask areas
; ----------------------------------------------------------------------------
[visual_snow]

; Applies to the plugin's visual plow after-effect, not all world terrain.
; This needs [snowplow] enabled = 1 and the required texture hooks.

; 0 = continuous snow values
; 1 to 8 = quantized snow levels; 4 gives 25%, 50%, 75% and 100%
; Allowed values: 0 to 8
snow_levels = 0

; Maps the logical snow amount to the native shader's snow-mask range.
; 0.85 = supplied setting; 1.00 = the complete mask range.
; This changes the visual mapping, not the internal road-snow amount.
; Allowed values: 0.00 to 1.00
shader_range = 0.85

; 1.00 = linear visual progression
; Above 1.00 shows less snow early; below 1.00 shows more snow early.
; Allowed values: 0.10 to 5.00
visual_curve = 1.00


; ----------------------------------------------------------------------------
; [snowplow]  Protection and simulated salt phase after plowing
; ----------------------------------------------------------------------------
[snowplow]

; 1 = enable strong protection and the following reduced-accumulation phase
; 0 = keep native snowplowing without these after-effects
enabled = 1

; Duration of the strong phase, in in-game minutes; pauses with the simulation.
; A compatible technical_service_storage service supplies material strength
; from [Streumaterialien]. Strength scales snow prevention, not duration:
; strength 0.50 prevents 50% of new snow during this phase.
; A weaker material does not replace or refresh a stronger active treatment.
; Equal-strength or stronger treatment can refresh an existing treatment.
; Without a compatible service, or if an individual clear cannot be matched,
; the legacy strength 1.00 is used. Check the integration status in the log.
; Allowed values: 0.00 to 1440.00
protection_minutes = 240.00

; Duration of the following phase, in in-game hours.
; "Salt" names the effect phase; weather_roads creates/consumes no resource.
; It also applies to other materials according to their reported strength.
; Allowed values: 0.00 to 168.00
salt_effect_hours = 24.00

; Accumulation factor in the salt phase at material strength 1.00.
; For strength S, the effective factor is 1 - S * (1 - this value).
; Example: S = 0.50 and value = 0.50 result in factor 0.75.
; The factor applies after base accumulation scaling.
; 0.00 = strongest prevention; 1.00 = no prevention in this phase.
; Allowed values: 0.00 to 1.00
salt_accumulation_multiplier = 0.50

; For dry plowing identified by a compatible grit-spreader service:
; 1 = remove snow but preserve existing material protection and its age
;     An untreated road does not gain new material protection.
; 0 = dry plowing also removes an existing treatment
; Affects internal road treatment and the visual after-effect.
dry_plowing_preserves_treatment = 1


; ----------------------------------------------------------------------------
; [persistence]  Save protection alongside the native savegame
; ----------------------------------------------------------------------------
[persistence]

; 1 = save/restore internal treatment and tracked visual shadow state
; 0 = do not read/write protection sidecars; effects remain session-only
; Requires the plow effect and the verified save/load hooks.
; File in the save folder: tesmioloader.weather_roads.protection.bin
; The file is written after the final native save close succeeds.
; Loading preserves treatment age instead of starting a new protection period.
; Missing sidecars are allowed; invalid/stale ones are rejected.
; Disabling this setting does not delete existing sidecars.
enabled = 1


; ----------------------------------------------------------------------------
; [overlay]  Optional live information window
; ----------------------------------------------------------------------------
[overlay]

; 1 = enable the diagnostic window
; 0 = no overlay window/thread (supplied setting)
; Keep this explicit: the compiled fallback for a missing key is 1.
enabled = 0

; auto = German on German Windows, otherwise English (not the game language)
; de   = always German
; en   = always English
; Uses built-in texts; no Localization plugin is required.
language = auto

; Anchor corner of the game window, or the monitor fallback.
; Allowed values: top_right or top_left
position = top_right

; Horizontal distance from the selected corner, in window coordinates.
; Allowed values: 0 to 4000
offset_x = 20

; Vertical distance from the upper edge, in window coordinates.
; Allowed values: 0 to 4000
offset_y = 80

; Overlay width; height is fixed by the plugin.
; Allowed values: 280 to 600
window_width = 350

; Window opacity: higher values are less transparent.
; Allowed values: 80 to 255
opacity = 220

; Overlay refresh/wait interval, in real milliseconds.
; Allowed values: 100 to 2000
update_interval_ms = 250

; Windows virtual-key number: 121 = F10, 0 = no shortcut.
; The shortcut changes visibility only, not the simulation.
; The window's footer still says F10 if a different key is configured.
; Allowed values: 0 to 255
toggle_key = 121

; 0 = allow the overlay while the game is not the foreground application
; 1 = show it only while the game is in the foreground
; Visibility also depends on the toggle state and window availability.
foreground_only = 0


; ----------------------------------------------------------------------------
; [logging]  Normal and diagnostic logging
; ----------------------------------------------------------------------------
[logging]

; 0 = normal startup, save/load, warning and error messages
; 1 = additional EVENT messages and diagnostic snapshots
; Warnings and errors do not depend on this switch.
detailed_events = 0

; Only affects EVENT messages when detailed_events = 1.
; 0 = events go only to logs\tesmioloader.weather_roads.log
; 1 = also copy events to tesmioloader.log
; Normal status, warning and error messages are mirrored independently.
mirror_events_to_loader_log = 0


; ----------------------------------------------------------------------------
; [advanced]  Snow timing and visible update batching
; ----------------------------------------------------------------------------
[advanced]

; Real quiet time separating two snow bursts, in milliseconds.
; Allowed values: 100 to 10000
burst_reset_after_ms = 1000

; Internal snow units released per gradual step.
; Allowed values: 1 to 32
gradual_step_units = 1

; Minimum real time between gradual steps, in milliseconds.
; Release additionally requires simulation time to advance; it pauses in-game.
; Allowed values: 16 to 5000
gradual_step_interval_ms = 125

; Released internal units grouped into one visible terrain-mask update.
; Larger values can reduce update frequency but make visible steps coarser.
; Allowed values: 1 to 255
visual_update_batch_units = 10


; ----------------------------------------------------------------------------
; Additional optional logging/safety keys already supported by the DLL are
; documented in the READMEs. They are not listed here; their compiled
; fallback values remain in use.
; ----------------------------------------------------------------------------
