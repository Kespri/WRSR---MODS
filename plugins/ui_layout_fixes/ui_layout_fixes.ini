; ============================================================================
;  UI Layout Fixes Plugin 0.3.0 - Configuration
; ============================================================================
;  This file configures window-specific UI corrections for WRSR.
;
;  File format:
;    - UTF-8 without BOM
;    - Use ';' for full-line comments
;    - Do not append inline comments to settings
;    - Do not repeat sections or keys
;
;  Safety and fallback behavior:
;    - The original game files are NEVER modified.
;    - The plugin changes only verified code and data in the running process.
;    - The executable build, instructions and call targets are checked before
;      a module writes its patch.
;    - An unsupported build or signature mismatch leaves the module inactive.
;    - Restart the game to remove an active patch completely.
;    - Settings are read during initialization; restart the game after changes.
;    - Unknown or misspelled sections and keys are ignored by the current
;      configuration reader, and the corresponding compiled default is used.
;
;  Requirements:
;    - TesmioLoader API 4
;    - Exact supported executable: SOVIET64.exe 1.1.1.9 (64-bit)
;
;  Scope and limits:
;    - There is intentionally no global row-spacing setting.
;    - Currently supported modules: CUSTOMHOUSE, TEXT_WRAP
;    - Resource row pitch: finite decimal value from 25.0 through 60.0
;    - Text wrap: whole numbers, 20..200 characters per line, 0..12 lines,
;      line spacing 0.50 .. 3.00 font sizes, up to 64 text ids
;
;  Detail log: logs\tesmioloader.ui_layout_fixes.log
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; Enable the complete plugin. Use one of the documented values:
;   0 = disable all modules; no patch is written
;   1 = enable individually configured modules
enabled = 1


; ----------------------------------------------------------------------------
; [customhouse]  Customs-house resource-list spacing
; ----------------------------------------------------------------------------
[customhouse]

; Enable only the CUSTOMHOUSE module. This setting has no effect when the
; complete plugin is disabled in [general].
;   0 = disable the module; no CUSTOMHOUSE patch is written
;   1 = enable the module
enabled = 1

; Vertical distance between rows in the customs-house resource list, measured
; in logical pixels. This affects only the verified list measurement and draw
; calls; unrelated windows and the native layout/scroll logic remain unchanged.
;
;   Native game value: 25.0
;   Plugin default:    30.0
;   Allowed range:     25.0 .. 60.0 inclusive
;
; Use a decimal point. Invalid, non-finite or out-of-range values produce a
; warning and fall back to 30.0. A value of 25.0 keeps the native row spacing.
resource_row_pitch = 30.0

; ----------------------------------------------------------------------------
; [text_wrap]  Word-wrapped captions
; ----------------------------------------------------------------------------
; Long game captions (for example the route hint of the vehicle window) are
; drawn with single-line print functions that ignore line breaks, so they
; run past the window edge. Every text id listed in [text_wrap_ids] is
; answered with a word-wrapped copy and drawn line by line. No game code is
; changed; the module does not depend on a particular game build, only the
; text ids may move with a game update.
[text_wrap]

; Enable only the TEXT_WRAP module. This setting has no effect when the
; complete plugin is disabled in [general].
;   0 = disable the module; no import is redirected
;   1 = enable the module
enabled = 1

; Default longest line in characters for every listed text that has no
; width of its own. Words are never split and the lines are balanced to
; similar lengths.
;   Plugin default: 58
;   Allowed range:  20 .. 200
max_chars = 58

; Upper limit for the number of lines. When a text needs more lines at its
; width, the line length is widened step by step until it fits.
;   0 = no limit
;   Plugin default: 4
;   Allowed range:  0 .. 12
max_lines = 4

; Distance between the wrapped lines as a multiple of the font size the
; game draws the text with (1.00 = exactly one font size).
;   Plugin default: 1.15
;   Allowed range:  0.50 .. 3.00
; Use a decimal point.
line_spacing = 1.15

; What happens to the game's own line breaks inside a listed text.
;   0 = they become spaces, the whole text reflows into as few lines as possible
;   1 = they stay as paragraph breaks; each paragraph is wrapped on its own
keep_breaks = 0

; Diagnostic help for finding candidates: every text id the game asks for
; whose longest line is longer than this many characters is written once to
; the detail log, with its first 80 characters.
;   0 = off
;   Allowed range: 0 .. 400
log_long_texts = 0


; ----------------------------------------------------------------------------
; [text_wrap_ids]  Which texts are wrapped
; ----------------------------------------------------------------------------
; One line per game text: "<text id> = <characters per line>". A text id is
; the number of the caption in the game's language files (the same in every
; language). 0 as the width means the default from [text_wrap] max_chars;
; otherwise 20 .. 200 characters for this text only. Up to 64 entries.
; Keep buttons, table cells and titles out of this list: a line break there
; breaks the window layout.
;
;   1970 = route hint of the vehicle window ("View area where a possible
;          issue exists on route! ...") in WRSR 1.1.1.9
[text_wrap_ids]
1970 = 0
