; ============================================================================
;  Technical Service Storage Plugin 0.3.3 - Configuration
; ============================================================================
;  DLL version: 0.3.3
;  Native Technical Services storage UI, material priorities, snowplow grit
;  tanks, depot refills and add-only storage migration.
;
;  File format:
;    - Recommended: UTF-8 without BOM
;    - UTF-8 BOM and UTF-16 LE BOM files are also supported
;    - Maximum complete configuration size: 1 MiB
;    - Use ';' for full-line comments; keep comments separate from values
;    - Use a dot for material strengths, and 0 or 1 for switches
;    - Keep section/key names unchanged; restart the game after edits
;
;  Validation and fallback behavior:
;    - Unknown/obsolete keys warn and are ignored; valid settings remain active.
;    - First scalar key and first section win if repeated.
;    - Malformed scalar values use compiled defaults; out-of-range integers
;      are clamped with a warning. Materials use the first valid declaration.
;    - Missing INI/section uses defaults, including sand=0.50.
;    - An explicitly empty/all-invalid material list, or an unreadable/incomplete
;      configuration, suspends grit, migration and priority/tank persistence
;      for this session. Existing storages and sidecars are retained.
;
;  Safety and persistence:
;    - Original building-definition files are not edited by this plugin.
;    - Migration adds empty storages to live depots. The game can persist these
;      additions in its native save; disabling migration does not undo them.
;    - Priorities and grit tanks use separate save-folder sidecars.
;    - The plugin does not change the vehicle's real fuel amount.
;    - Check actual component status in the log if a hook or service is missing.
;
;  Requirements:
;    - TesmioLoader API 4; reference game: WRSR 1.1.1.9, 64-bit
;    - Registered materials and matching single-resource depot import storages
;    - Optional: Localization plugin + technical_service_storage text package
;    - Optional: compatible weather_roads for material-dependent road protection
;
;  Detail log: logs\tesmioloader.technical_service_storage.log
;  See README_DE.md / README_EN.md for installation, behavior and troubleshooting.
; ============================================================================


; ----------------------------------------------------------------------------
; [general]  General plugin settings
; ----------------------------------------------------------------------------
[general]

; 1 = enable the complete plugin; 0 = disable it on the next full restart.
; Existing native storage additions and sidecars are not removed.
enabled = 1

; 0 = normal startup, persistence, migration, warning and error messages.
; 1 = additional vehicle, clearing and lifecycle details.
debug = 0

; Limit for UI DEBUG messages only, not every detailed runtime trace.
; Each UI runtime warning cause is logged immediately even at 0; repeats are
; limited to once per minute per cause. Allowed range: 0 to 10000.
debug_limit = 100


; ----------------------------------------------------------------------------
; [storage_migration]  Add missing depot storages when loading a savegame
; ----------------------------------------------------------------------------
[storage_migration]

; Only completed Technical Services depots with supported current definitions
; are eligible. Missing configured grit imports are appended empty, in definition
; order. Existing order, contents, capacity and priority policy are preserved.
; No resizing, conversion or removal is performed. Changed capacity/class for an
; existing resource is not applied automatically.
; Saving can persist additions natively. Set 0 to stop future additions, not to
; undo saved changes. Restart after building-definition or material-list edits.

; 1 = enable add-only migration on savegame load; 0 = disable future additions.
enabled = 1


; ----------------------------------------------------------------------------
; [ui]  Native depot interface
; ----------------------------------------------------------------------------
[ui]

; Layout values use logical pixels before the game's DPI scaling.
; The plugin reuses native storage rendering and avoids duplicate resource rows.
; Vehicle fuel stays separate from selectable grit materials.

; Vertical space before additional storage rows.
; Allowed range: 0 to 50 logical pixels.
resource_gap = 14

; 1 = wrap the nine native Office Priority road labels when necessary.
; One-line rows retain their native height; wrapped rows grow and move later
; rows down. 0 = leave native single-line rendering.
office_priority_wrap = 1

; Available width of the Office Priority label column.
; Allowed range: 120 to 400 logical pixels.
office_priority_max_width = 245

; Distance between wrapped text baselines.
; Allowed range: 12 to 28 logical pixels.
office_priority_line_height = 22

; 1 = show clickable per-depot grit priorities; 0 = hide these controls.
; Click order: OFF -> N -> ... -> 2 -> 1 -> OFF.
; Each enabled number is unique per depot; choosing an occupied number swaps
; the two materials. Number 1 is the highest priority.
material_priority_enabled = 1

; Horizontal offset relative to the native resource label/amount area.
; Allowed range: 100 to 800 logical pixels.
material_priority_offset_x = 390

; Vertical adjustment following the native resource-title layout.
; Allowed range: -50 to 100 logical pixels.
material_priority_offset_y = 0

; Width of the priority control and hitbox.
; Allowed range: 60 to 300 logical pixels.
material_priority_width = 150

; Height of the priority control and hitbox.
; Allowed range: 12 to 60 logical pixels.
material_priority_height = 24

; 1 = insert a localized grit divider before selectable materials.
; 0 = no additional divider; fuel remains excluded from material selection.
material_section_divider = 1

; Replaces the ordinary gap before the first material row.
; Later rows continue to use resource_gap.
; Allowed range: 48 to 100 logical pixels.
material_section_divider_height = 56

; 1 = append native red warnings for configured materials present in this
; building that are empty or OFF; 0 = no additional material-status warnings.
; OFF takes precedence over empty, so one material produces at most one line.
; Fuel is excluded; missing storages are not reported as empty material rows.
material_status_warnings = 1


; ----------------------------------------------------------------------------
; [priority_persistence]  Save depot-specific material priorities
; ----------------------------------------------------------------------------
[priority_persistence]

; Save-folder file: tesmioloader.technical_service_storage.priorities.bin
; Written when the game saves; restored with the corresponding world.
; Missing/invalid data uses material-list defaults. Disabling does not delete
; existing sidecars. Keep [tank_probe] building_lifecycle = 1 for depot tracking.

; 1 = save/load depot priorities; 0 = no priority-sidecar persistence.
enabled = 1


; ----------------------------------------------------------------------------
; [tank_persistence]  Save plugin-owned snowplow tanks
; ----------------------------------------------------------------------------
[tank_persistence]

; Save-folder file: tesmioloader.technical_service_storage.tanks.bin
; Stores actual grit amount and loaded material. Identity uses home-depot
; position, vehicle slot and verified power/weight values. A mismatched record
; is not applied; first-observation reconstruction remains available.
; Restoring a saved tank does not debit the depot again. Disabling does not
; delete existing sidecars.

; 1 = save/load vehicle grit tanks; 0 = no tank-sidecar persistence.
enabled = 1


; ----------------------------------------------------------------------------
; [grit_materials]  Ordered material list and protection strength
; ----------------------------------------------------------------------------
[grit_materials]

; The spelling [Streumaterialien] is accepted as well.
; Use only one spelling. If both occur, the first section in the file wins;
; later sections are ignored with a warning. Lists are never merged/reordered.

; Syntax: exact_internal_resource_name = protection_strength
; The name must exist in the base-game resource table or a resource plugin,
; and the depot needs a compatible single-resource import storage.
; This list creates neither resources nor building storages by itself.
; Use internal ASCII names, not translated captions; fuel is never grit.
;
; Maximum: 32 accepted materials; names up to 63 bytes; parsed key=value entry
; up to 511 bytes. Invalid entries warn individually; valid entries retain order.
; For duplicates, the first valid entry wins (case-insensitive duplicate check).
; Excess materials are ignored. Live resource availability is checked per world.
;
; Missing section: legacy sand=0.50. Explicitly empty/all-invalid list or
; unreadable/incomplete file: no implicit sand substitute; see the file header.
; Runtime-unknown resources are disabled for that world.
;
; File order supplies initial depot priorities: first material = 1.
; The lowest enabled number with stock is selected. OFF materials are skipped.
; Each valid value is a protection strength from 0.00 to 1.00, not a quantity,
; consumption multiplier or duration. A compatible weather_roads uses this value
; to scale snow prevention. Strength 0.00 is valid but grants no material
; protection; use the depot's OFF control to exclude a material from selection.
; Dry clears publish strength 0.00. Retaining older road treatment during dry
; plowing is controlled by weather_roads, not this INI.

sand = 0.30

gravel = 0.45


; ----------------------------------------------------------------------------
; [sand_diagnostic]  Runtime grit system (legacy section name)
; ----------------------------------------------------------------------------
[sand_diagnostic]

; Keep this section name for compatibility: it controls real grit operation,
; not only diagnostics. Skill-based snowplow detection, confirmed clearing and
; fuel-proportional plugin-owned tanks remain independent of open UI windows.
; Detailed event logs require [general] debug = 1.
; There is no fixed per-road depot debit and no upper clearing-speed limit.

; 1 = enable grit operation; 0 = disable this runtime subsystem.
; Other components have their own switches. Use [general] enabled = 0 to
; switch off the entire plugin.
enabled = 1

; Grit use = tank capacity * (eligible native fuel used / native fuel capacity)
;            * this value / 100.
; Only confirmed operating conditions contribute. 110 means 1.10 times the
; relative fuel use; real vehicle fuel is read, never changed by this plugin.
; The grit amount cannot fall below zero. Allowed range: 1 to 1000 percent.
grit_fuel_consumption_factor_percent = 110

; Ignore repeated events for the same vehicle, road and selector within this
; real-time window. 0 = disable duplicate suppression.
; Allowed range: 0 to 60000 milliseconds.
duplicate_window_ms = 5000

; Minimum interval between detailed Technical Services panel summaries.
; Allowed range: 100 to 60000 milliseconds.
sample_interval_ms = 1000

; Maximum assigned/clearing vehicles tracked by this subsystem.
; This is not a limit on the number of vehicles the game itself may own.
; Allowed range: 1 to 1024 (default 512).
max_vehicles = 512

; Interval for scanning Technical Services for loaded, new or newly assigned
; skill-35 snowplows. No Technical Services window needs to be open.
; Allowed range: 250 to 10000 milliseconds.
global_initialization_interval_ms = 1000

; Minimum interval between detailed clearing-event lines for one vehicle.
; Every call is still counted. 0 = allow each confirmed call to be logged.
; Allowed range: 0 to 60000 milliseconds.
clear_log_interval_ms = 500

; 1 = maintain an independent plugin-owned grit tank per snowplow.
; Confirmed refills debit actual loaded stock; real vehicle fuel is unchanged.
; Keep enabled for tank-based treatment reporting to weather_roads.
shadow_tank_enabled = 1

; 1 = request return to the home depot at the reserve threshold when a
; permitted material is available. The native game owns routing and movement.
; Remaining grit is consumed during confirmed clearing down to zero; subsequent
; clears are dry. If all eligible depot materials are empty or OFF, keep plowing
; dry and check again when stock/priority permits a refill.
; 0 = disable the automatic low-grit return request.
automatic_return_enabled = 1

; Reserve threshold in whole percent of the individual tank capacity.
; 20 = return when 20 percent remain. This requests return; it does not refill
; the tank or set its visible amount to zero. Allowed range: 0 to 100.
; (The 0.3.2 key return_threshold_basis_points is still read when this key is absent.)
return_threshold_percent = 20

; 1 = retain/reassert the home-refueling destination until a refill is
; confirmed. Native AI retains route/target handling; real fuel is not changed.
; Physical home arrival is primary confirmation. A qualifying positive native
; fuel change while the home-refueling latch is active is an alternative.
; The return lock does not block confirmed clearing or consume imaginary grit.
return_lock_enabled = 1

; Weight contribution: empty vehicle weight in kg * this percentage / 100.
; Add the engine-power contribution, apply the capacity multiplier, round to
; the configured step and clamp to the minimum/maximum below.
; Allowed range: 0 to 50 percent.
tank_weight_percent = 10

; Engine-power contribution in kg per kW, added to the weight contribution.
; Allowed range: 0 to 20 kg/kW.
tank_power_kg_per_kw = 2

; Multiplier for the combined weight/power capacity before rounding.
; 100 = unchanged, 50 = half, 150 = one and a half times.
; Allowed range: 10 to 500 percent.
tank_capacity_multiplier_percent = 100

; Round the calculated capacity to this step size.
; Allowed range: 1 to 1000 kg.
tank_capacity_step_kg = 50

; Lower capacity bound after rounding.
; Allowed range: 1 to 10000 kg.
tank_minimum_capacity_kg = 250

; Upper capacity bound after rounding.
; Allowed range: 1 to 20000 kg. If below the configured minimum, it is raised
; to that minimum with a warning.
tank_maximum_capacity_kg = 5000

; 1 = show grit amount, capacity and loaded material in the native vehicle UI.
; At zero, show the pending depot return or localized dry-plowing state.
; Text comes from the localization package; resource names use native game
; texts. Missing plugin translations use built-in fallback labels.
vehicle_tank_display_enabled = 1

; Horizontal adjustment relative to the native vehicle-properties block.
; Allowed range: -1000 to 1000 logical pixels.
vehicle_tank_display_offset_x = 0

; Vertical adjustment relative to the native vehicle-properties block.
; Allowed range: -1000 to 1000 logical pixels.
vehicle_tank_display_offset_y = 22


; ----------------------------------------------------------------------------
; [tank_probe]  Depot lifecycle tracking (legacy section name)
; ----------------------------------------------------------------------------
[tank_probe]

; This is operational depot tracking, not a broad memory scan. Demolition and
; collapse end the old depot lifetime; rebuilding uses material-list defaults.
; Keep enabled for normal persistence. The read-only Ctrl+F8 lifecycle snapshot
; is available only with [general] debug = 1; old F9-F12 test actions are removed.

; 1 = enable depot lifecycle tracking; 0 = disable it.
; Recommended: 1, including when debug logging is off.
building_lifecycle = 1

; ----------------------------------------------------------------------------
; Additional supported return timing keys are documented in the READMEs.
; They are not added here; compiled fallback values remain in use.
; ----------------------------------------------------------------------------
